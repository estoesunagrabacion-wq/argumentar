<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Argumentar · 3.º año</title>
<meta name="description" content="El texto argumentativo para practicar: teoría, ejercicios, lectura anotada, taller de escritura y debate.">
<meta name="theme-color" content="#7c3aed"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Argumentar"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>/*
VOICE: a game for 15-year-olds that happens to teach rhetoric: energetic, friendly, never babyish.
IDEA: a debate arena / quiz game — each module is a "world" with its own colour, you earn points, streaks and levels.
PICTURE: two big speech bubbles arguing (one violet, one orange) with a lightning bolt between them; module tiles with drawn icons.
COLOUR and TYPE: one saturated colour per module on a near-white lavender ground; chunky Rubik for UI, Literata for reading texts.
LAYOUT: coloured top bar with level/XP; big pressable tiles and buttons; one column under 600px.
*/
:root{color-scheme:light dark;
--bg:light-dark(#f7f6fb,#14121a);--paper:light-dark(#ffffff,#1f1c27);--ink:light-dark(#1d1a2b,#f1eff8);--mut:light-dark(#6b6780,#a9a5bb);
--line:light-dark(#e6e3f0,#322e3d);--c:#7c3aed;--c2:#5b21b6;--ct:light-dark(#f1eafe,#2a2140);
--ok:#16a34a;--ok2:#15803d;--okbg:light-dark(#dcfce7,#163a24);--bad:#e11d48;--bad2:#be123c;--badbg:light-dark(#ffe4e8,#3d1a24);
--hl:#ffe14d;--okt:light-dark(#15803d,#6ee7a0);--badt:light-dark(#be123c,#ff8fa3);--serif:'Literata',Georgia,serif;--sans:'Rubik',system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--c)}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
/* top bar */
.top{position:sticky;top:0;z-index:10;background:var(--c);color:#fff;box-shadow:0 4px 0 var(--c2);transition:background .3s}
.topin{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px max(3vw,12px) 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;color:#fff;text-decoration:none;letter-spacing:-.01em}
.logo svg{width:34px;height:34px}
.me{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:999px;padding:5px 12px 5px 8px;font-weight:700;font-size:14px;white-space:nowrap}
.pill svg{width:20px;height:20px}
.xpbar{width:70px;height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:#fff;border-radius:4px}
.rail{display:flex;gap:6px;overflow-x:auto;max-width:1140px;margin:0 auto;padding:10px max(3vw,12px) 12px;scrollbar-width:none}
.rail a{flex:none;display:flex;align-items:center;gap:7px;text-decoration:none;color:#fff;font-weight:600;font-size:14.5px;padding:7px 13px 7px 8px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.rail a i{width:14px;height:14px;border-radius:50%;background:var(--mc);box-shadow:0 0 0 2px #fff}
.rail a.on{background:#fff;color:var(--c2)}
main{max-width:1140px;margin:0 auto;padding:clamp(20px,3vw,40px) max(4vw,14px) 80px}
h1,h2,h3{font-weight:800;line-height:1.08;text-wrap:balance;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(42px,7vw,64px)}
h2{font-size:clamp(28px,4vw,40px)}
h3{font-size:20px}
h4{font-size:18px;margin:1.4em 0 .3em}
.lead{font-size:18px;color:var(--mut);max-width:62ch;margin:0 0 1.2em}
.small{font-size:13.5px;color:var(--mut)}
/* module header */
.mhead{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.mhead .ic{flex:none;width:64px;height:64px;border-radius:20px;background:var(--c);display:grid;place-items:center;box-shadow:0 5px 0 var(--c2)}
.mhead .ic svg{width:36px;height:36px}
.mhead h2{margin:0}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--c);color:#fff;border-radius:14px;padding:12px 22px;min-height:48px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;box-shadow:0 4px 0 var(--c2);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c2)}
.btn.sec{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.lnk{background:none;color:var(--c);box-shadow:none;padding:8px 2px;min-height:40px;text-decoration:underline;font-weight:600}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center;margin-bottom:30px}
.hero .kick{font-weight:700;color:var(--c);margin:0 0 8px}
.hero svg.big{width:100%;height:auto;display:block}
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px 20px;margin-top:22px;max-width:520px}
.lvl .badge{grid-row:span 2;width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,#7c3aed,#db2777);display:grid;place-items:center;color:#fff;font-weight:800;font-size:28px;box-shadow:0 4px 0 #5b21b6}
.lvl b{font-size:19px}
.lvl .bar{height:12px}
.who{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.who input{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;font-size:16px;width:min(280px,100%)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mod{position:relative;display:flex;flex-direction:column;text-decoration:none;color:#fff;background:var(--mc);border-radius:24px;padding:20px 20px 18px;box-shadow:0 6px 0 var(--mc2);transition:transform .12s;overflow:hidden;min-height:200px}
.mod:hover{transform:translateY(-3px) rotate(-.4deg)}
.mod:active{transform:translateY(4px);box-shadow:0 2px 0 var(--mc2)}
.mod .ic{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;margin-bottom:12px}
.mod .ic svg{width:32px;height:32px}
.mod b{font-size:22px;line-height:1.1;margin-bottom:6px}
.mod span{font-size:14.5px;line-height:1.4;opacity:.92;flex:1}
.mod::after{content:'';position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12)}
.mod.dark{color:#2a1f00}.mod.dark .ic{background:rgba(0,0,0,.1)}
.bar{height:10px;background:rgba(0,0,0,.12);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px}
.mod .bar{background:rgba(255,255,255,.3);margin-top:14px}.mod .bar i{background:#fff}.mod.dark .bar{background:rgba(0,0,0,.15)}.mod.dark .bar i{background:#2a1f00}
.mod small{font-size:13px;margin-top:6px;font-weight:600;opacity:.95}
/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.tab{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:9px 16px;min-height:46px;cursor:pointer;font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--line)}
.tab.on{background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 3px 0 var(--c2)}
.tab.sm{min-height:38px;padding:5px 12px;font-size:14px}
/* quiz */
.qcard{background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:clamp(18px,3vw,32px);max-width:780px;position:relative}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.qtop .prog{flex:1;height:16px;background:var(--ct);border-radius:9px;overflow:hidden}
.qtop .prog i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .3s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.qtop .cnt{font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
.combo{display:flex;align-items:center;gap:4px;font-weight:800;color:#f97316;font-size:15px}
.combo svg{width:20px;height:20px}
.src{display:inline-block;background:var(--hl);color:#2a2300;border-radius:8px;padding:2px 10px;font-weight:700;font-size:13px;margin-bottom:10px}
.qtext{font-family:var(--serif);font-size:clamp(19px,2.5vw,22px);line-height:1.5;margin:0 0 20px;padding:16px 18px;background:var(--ct);border-radius:16px}
.qask{font-weight:800;font-size:18px;margin:0 0 12px}
.opts{display:grid;gap:10px}
.opts.chips{display:flex;flex-wrap:wrap}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 16px;min-height:50px;cursor:pointer;font-size:16px;font-weight:600;line-height:1.35;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s,background .15s}
.opt:hover:not(:disabled){border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok2);animation:pop .35s}
.opt.bad{background:var(--badbg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad2);animation:shake .4s}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:18px;padding:16px 18px;border-radius:18px;background:var(--okbg);border:2px solid var(--ok);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb .fi{grid-row:span 2;width:40px;height:40px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.fb.bad .fi{background:var(--bad)}
.fb .fi svg{width:22px;height:22px}
.fb b{font-size:18px;color:var(--okt)}.fb.bad b{color:var(--badt)}
:root[data-theme=dark] .fb b,.fb b{filter:none}
.xpf{position:absolute;right:24px;top:18px;font-weight:800;color:var(--ok);font-size:22px;animation:up 1s forwards;pointer-events:none}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
.result{text-align:center}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0 4px}
.stars svg{width:58px;height:58px}
.stars svg.on{animation:pop .5s backwards}
.stars svg:nth-child(2).on{animation-delay:.15s}.stars svg:nth-child(3).on{animation-delay:.3s}
.score{font-size:clamp(52px,9vw,84px);font-weight:800;line-height:1;color:var(--c);margin:6px 0}
.result .row{justify-content:center}
/* teoria */
.teo{display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(18px,3vw,40px)}
.teo-nav{display:flex;flex-direction:column;gap:6px;position:sticky;top:130px;align-self:start}
.teo-nav button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:9px 12px;cursor:pointer;font-weight:600;min-height:44px;font-size:14.5px}
.teo-nav button .d{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ct);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--c)}
.teo-nav button .d.k{background:var(--ok);color:#fff}
.teo-nav button.on{border-color:var(--c);background:var(--ct)}
.ficha{max-width:740px;font-size:17px;background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:clamp(20px,3vw,36px)}
.ficha p,.ficha li{max-width:68ch}
.ej{background:var(--ct);padding:14px 18px;border-radius:16px;margin:14px 0;font-family:var(--serif)}
dl.tipos dt{font-weight:800;margin-top:18px;color:var(--c2)}
:root[data-theme=dark] dl.tipos dt{color:var(--c)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) dl.tipos dt{color:var(--c)}}
dl.tipos dd{margin:3px 0 0}
dl.tipos dd span{display:block;font-family:var(--serif);font-style:italic;margin-top:6px;padding:8px 12px;background:var(--ct);border-radius:10px}
table.conn{border-collapse:separate;border-spacing:0 6px;width:100%;margin:12px 0}
table.conn th{text-align:left;vertical-align:top;padding:10px 14px;width:30%;font-weight:700;background:var(--c);color:#fff;border-radius:12px 0 0 12px}
table.conn td{padding:10px 14px;background:var(--ct);border-radius:0 12px 12px 0}
.mini mark{color:inherit;padding:1px 0;border-radius:3px}
.m-i{background:light-dark(#dbeafe,#1e3a5f)}.m-t{background:var(--hl);color:#1a1a1a!important}.m-a{background:light-dark(#fde2e4,#4a2228)}.m-c{background:light-dark(#dcfce7,#173d2a)}
.ley span{display:inline-block;padding:2px 9px;border-radius:6px;font:700 13px var(--sans);margin:2px}
/* lectura */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lcard{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px 18px 16px;cursor:pointer;text-align:left;box-shadow:0 5px 0 var(--line);transition:transform .1s}
.lcard:hover{border-color:var(--c);box-shadow:0 5px 0 var(--c)}
.lcard:active{transform:translateY(3px)}
.lcard .tag{display:inline-block;background:var(--c);color:#fff;font-weight:700;font-size:12px;border-radius:8px;padding:2px 9px;margin-bottom:10px}
.lcard b{display:block;font-family:var(--serif);font-size:20px;line-height:1.25;margin-bottom:4px}
.lcard em{font-style:normal;color:var(--mut);font-size:14px}
.lcard .bar{margin-top:12px;height:8px;background:var(--ct)}
.reader{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:clamp(18px,3vw,36px);align-items:start}
.texto{font-family:var(--serif);font-size:18.5px;line-height:1.75;background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:clamp(18px,3vw,38px)}
.texto p{margin:0 0 1em;position:relative}
.texto h5{font:800 14px var(--sans);letter-spacing:.03em;margin:1.6em 0 .5em;color:var(--c)}
.texto .eli{color:var(--mut);text-align:center}
.s{cursor:pointer;border-radius:4px;transition:background .15s}
.mk-on .s:not([data-m]):hover{background:var(--ct)}
.s[data-m]{background:light-dark(#ffeeb8,#5a4d12)}
.s[data-m=Tesis]{background:var(--hl);color:#1a1a1a}
.s[data-m=Ironía]{background:light-dark(#ecdcff,#3d2a5c)}
.s[data-m]::after{content:attr(data-m);font:700 11px var(--sans);color:#fff;background:var(--c);border-radius:6px;padding:1px 5px;vertical-align:2px;margin-left:4px;white-space:nowrap}
.s.pf{outline:2.5px solid var(--c);outline-offset:1px}
.s .pn{font:800 11px var(--sans);background:var(--c);color:#fff;border-radius:9px;padding:0 6px;margin-right:4px;vertical-align:2px}
.side{position:sticky;top:130px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px}
.panel h3{font-size:17px;margin-bottom:8px}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 11px;font-size:13.5px;font-weight:700;cursor:pointer;min-height:38px}
.pal button.on{border-color:var(--c);background:var(--c);color:#fff}
.estsel{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px;font-family:var(--sans)}
.estsel button{font-size:12.5px;font-weight:700;border:2px solid var(--line);background:var(--paper);border-radius:9px;padding:3px 9px;cursor:pointer;min-height:34px}
.estsel button.on{background:var(--c);color:#fff;border-color:var(--c)}
.texto p.okp{box-shadow:-12px 0 0 var(--ok)}
.texto p.badp{box-shadow:-12px 0 0 var(--bad)}
.estsel .sol{font-size:12.5px;color:var(--badt);align-self:center;font-weight:700}
ol.notas{padding-left:22px;margin:0;font-size:14.5px}
ol.notas li{margin-bottom:8px}
ol.notas li::marker{color:var(--c);font-weight:800}
ol.notas b{color:var(--c)}
.preg{margin:0 0 20px}
.preg label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:11px 14px;font-size:16px;line-height:1.5;resize:vertical}
textarea:focus,input:focus,select:focus{outline:3px solid var(--c);outline-offset:0;border-color:transparent}
details{margin-top:6px}
summary{cursor:pointer;color:var(--c);font-weight:700;font-size:14.5px;min-height:32px}
.seg{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:9px 14px;font-weight:700;cursor:pointer;min-height:46px;box-shadow:0 3px 0 var(--line)}
.seg button.on{background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 3px 0 var(--c2)}
.seg button i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ct);color:var(--c);font-size:12px;margin-right:6px}
.seg button.on i{background:rgba(255,255,255,.25);color:#fff}
/* taller */
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,3vw,36px);align-items:start}
.paso{margin-bottom:18px;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
.paso label{display:flex;gap:10px;align-items:center;font-weight:800;font-size:17px}
.paso label i{font-style:normal;flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:14px}
.paso p{margin:4px 0 8px;font-size:14.5px;color:var(--mut)}
.hoja{background:#fffdf5;color:#1d1a2b;border-radius:6px;padding:clamp(18px,3vw,32px);font-family:var(--serif);font-size:17px;line-height:1.7;white-space:pre-wrap;box-shadow:0 2px 0 rgba(0,0,0,.06),0 18px 36px -18px rgba(40,20,80,.35);min-height:220px;transform:rotate(-.4deg);border-top:8px solid var(--c)}
.hoja h3{font-family:var(--serif);white-space:normal}
.hoja .vacio{color:#8a8698;font-style:italic}
.chipsF{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chipsF span{background:var(--ct);border-radius:999px;padding:4px 11px;font-size:13.5px;font-weight:600;color:var(--mut)}
.chipsF span.c{background:var(--ok);color:#fff}
.check label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--c)}
.temas{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.temas button{border:2px dashed var(--c);background:var(--ct);border-radius:12px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.sticky2{position:sticky;top:130px}
/* polemica */
.cuadro{display:grid;gap:14px;max-width:900px}
.fila{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px}
.fila .k{font-family:var(--serif);font-size:17.5px;margin-bottom:10px}
.fila .k::before{content:'Karakas dice';display:block;font:800 12px var(--sans);color:#fff;background:var(--c);border-radius:6px;padding:1px 8px;width:max-content;margin-bottom:6px}
.fila select{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-size:15px;min-height:46px}
.fila.okf{border-color:var(--ok);background:var(--okbg)}
.fila.badf{border-color:var(--bad);background:var(--badbg)}
.fila .res{margin-top:8px;font-weight:600}

<script>const ARG_TIPOS={cita:'Cita de autoridad',gen:'Generalización',con:'Concesión',ref:'Refutación',ej:'Ejemplificación',preg:'Pregunta retórica',ana:'Analogía',acu:'Acumulación',dat:'Datos y cifras'};

const TEORIA=[
{id:'t1',titulo:'¿Qué es argumentar?',html:`
<p>Un texto argumentativo busca <b>convencer</b> a alguien de algo o <b>expresar una opinión</b> fundamentada. Tiene dos componentes básicos:</p>
<ul><li><b>La tesis:</b> la idea que se quiere demostrar. Casi siempre se puede resumir en una sola oración.</li>
<li><b>Los argumentos:</b> las razones que sostienen esa tesis.</li></ul>
<p>La tesis puede ser <b>explícita</b> (aparece escrita en el texto) o <b>implícita</b> (no está escrita, pero se deduce de lo que se dice). En los textos irónicos, como el de Swift, la tesis real casi siempre es implícita: el autor dice una cosa para que entendamos otra.</p>
<div class="ej"><b>Tesis posibles:</b> «Los celulares deberían estar permitidos en el aula con reglas claras». «Usar IA para hacer la tarea sin entenderla es hacerse trampa a uno mismo». «El ciberacoso debería tratarse en todas las materias, no solo en tutoría».</div>
<p>Ojo: una tesis no es un tema. «Las redes sociales» es un tema; «Las redes sociales deberían tener edad mínima de 16 años» es una tesis, porque toma posición y se puede discutir.</p>`,
prueba:{q:'¿Cuál de estas opciones es una tesis y no solo un tema?',opts:['Los videojuegos en la adolescencia','Los videojuegos en línea enseñan a trabajar en equipo','La historia de los videojuegos','Videojuegos y violencia'],ok:1,exp:'Solo la segunda toma una posición que alguien podría discutir. Las otras nombran un tema, pero no dicen qué se piensa de él.'}},

{id:'t2',titulo:'Tipos de argumentos',html:`
<p>Hay muchas maneras de sostener una tesis. Estas son las más frecuentes. Todos los ejemplos defienden o atacan la misma tesis: <i>«Hay que enseñar a usar la IA en la escuela en lugar de prohibirla»</i>.</p>
<dl class="tipos">
<dt>Cita de autoridad</dt><dd>Se apoya en alguien que sabe del tema: un especialista, una institución, una ley. Marcas: «según…», «como afirma…», «de acuerdo con…».<span>«Según la UNESCO, los sistemas educativos deben preparar a los estudiantes para usar la IA de manera crítica y ética.»</span></dd>
<dt>Generalización</dt><dd>Enuncia una supuesta ley general, algo que valdría para todos o casi todos los casos.<span>«Hoy cualquier adolescente sabe pedirle a un chatbot que le resuma un texto.»</span></dd>
<dt>Concesión</dt><dd>Acepta (o finge aceptar) parte de lo que dice el otro, para después reafirmar la posición propia. Marcas: «si bien…», «es cierto que…, pero…», «aunque…».<span>«Es cierto que la IA puede usarse para copiar, pero justamente por eso la escuela tiene que enseñar a usarla bien.»</span></dd>
<dt>Refutación (o negación)</dt><dd>Niega o discute la validez de un argumento contrario. Marcas: «no es cierto que…», «es falso que…».<span>«No es verdad que prohibir la IA evite que se use: los chicos la usan igual, solo que a escondidas.»</span></dd>
<dt>Ejemplificación</dt><dd>Apoya la tesis con un caso concreto. Marcas: «por ejemplo», «tal es el caso de…».<span>«En algunas escuelas, por ejemplo, ya se pide entregar la conversación con la IA junto con el trabajo, para ver cómo se la usó.»</span></dd>
<dt>Pregunta retórica</dt><dd>Una pregunta que no espera respuesta, porque la respuesta ya está implícita. Busca la complicidad del lector.<span>«¿De verdad creemos que una prohibición va a frenar una tecnología que está en todos los celulares?»</span></dd>
<dt>Analogía</dt><dd>Compara una situación con otra a partir de un parecido.<span>«Prohibir la IA en la escuela es como haber prohibido la calculadora: no la hizo desaparecer, solo dejó a los alumnos sin saber usarla.»</span></dd>
<dt>Acumulación</dt><dd>Enumera una serie de elementos que apuntan a lo mismo.<span>«La IA ya está en los buscadores, en los celulares, en los procesadores de texto, en los traductores y en las redes sociales.»</span></dd>
<dt>Datos y cifras</dt><dd>Usa números, porcentajes o estadísticas para respaldar lo que se afirma.<span>«En nuestro curso, 24 de 28 alumnos dijeron haber usado alguna IA en el último mes.»</span></dd>
</dl>
<p>Un mismo fragmento puede combinar varios tipos: una cita de autoridad que trae datos, una acumulación de ejemplos, una pregunta retórica que encierra una analogía.</p>`,
prueba:{q:'«Si bien las redes sociales nos acercan a quienes están lejos, también nos alejan de quienes están cerca.» ¿Qué tipo de argumento es?',opts:['Refutación','Concesión','Generalización','Analogía'],ok:1,exp:'«Si bien…» acepta una parte del argumento contrario (las redes acercan) para reafirmar la propia posición (también alejan). Es una concesión.'}},

{id:'t3',titulo:'Estructura del texto argumentativo',html:`
<p>En general, un texto argumentativo tiene tres partes:</p>
<ol><li><b>Introducción o presentación del tema.</b> Puede empezar con un hecho que conecte el tema con la realidad del lector, con una pregunta que invite a pensar o con los antecedentes del problema. A veces se omite y el texto arranca directamente con la tesis.</li>
<li><b>Argumentación.</b> Se exponen ordenadamente los argumentos que sostienen la tesis (y, muchas veces, se refutan los del otro).</li>
<li><b>Conclusión.</b> Sintetiza lo expuesto y cierra el razonamiento. Puede incluir una apelación al lector para que tome posición o actúe.</li></ol>
<div class="ej mini"><p><mark class="m-i">Esta semana, en un curso de tercero, una foto trucada con IA de una alumna circuló por todos los celulares de la escuela.</mark> <mark class="m-t">La escuela no puede seguir tratando el ciberacoso como un tema menor.</mark></p>
<p><mark class="m-a">En primer lugar, el acoso en las redes no termina cuando suena el timbre: sigue de noche, los fines de semana, en vacaciones. Además, es fácil y barato: hoy cualquiera puede fabricar una imagen falsa en segundos. Es cierto que la escuela no controla lo que pasa fuera del aula, pero sí puede enseñar qué hacer, a quién recurrir y por qué compartir también es participar.</mark></p>
<p><mark class="m-c">Por eso, el ciberacoso tiene que ser tema de todas las materias. ¿O vamos a esperar a que le pase a alguien de nuestro curso?</mark></p>
<p class="ley"><span class="m-i">introducción</span> <span class="m-t">tesis</span> <span class="m-a">argumentación</span> <span class="m-c">conclusión</span></p></div>`,
prueba:{q:'¿Qué parte del texto suele incluir una apelación al lector para que tome posición?',opts:['La introducción','La argumentación','La conclusión','El título'],ok:2,exp:'La conclusión cierra el razonamiento y muchas veces interpela directamente al lector.'}},

{id:'t4',titulo:'Conectores',html:`
<p>Los conectores relacionan las ideas y le muestran al lector cómo avanza el razonamiento. Elegir bien el conector es parte del argumento.</p>
<table class="conn"><tbody>
<tr><th>Ordenar</th><td>en primer lugar, en segundo lugar, por un lado, por otro lado, por una parte, por otra parte, finalmente, por último</td></tr>
<tr><th>Agregar</th><td>además, también, asimismo, es más, incluso</td></tr>
<tr><th>Oponer</th><td>sin embargo, pero, no obstante, en cambio, por el contrario</td></tr>
<tr><th>Conceder</th><td>aunque, si bien, a pesar de que, aun cuando</td></tr>
<tr><th>Explicar la causa</th><td>porque, ya que, puesto que, dado que</td></tr>
<tr><th>Mostrar la consecuencia</th><td>por eso, por lo tanto, en consecuencia, entonces, así que</td></tr>
<tr><th>Ejemplificar</th><td>por ejemplo, como, tal es el caso de, así</td></tr>
<tr><th>Reformular</th><td>es decir, o sea, en otras palabras</td></tr>
<tr><th>Concluir</th><td>en conclusión, en síntesis, en definitiva, para terminar</td></tr>
</tbody></table>
<div class="ej">«Las redes nos conectan con gente que está lejos; <b>sin embargo</b>, pueden aislarnos de quienes tenemos al lado. <b>Por eso</b>, el problema no son las redes, sino cómo las usamos.»</div>`,
prueba:{q:'«Dormimos con el celular al lado de la almohada; ___, llegamos cansados a la escuela.» ¿Qué conector corresponde?',opts:['sin embargo','en consecuencia','por ejemplo','aunque'],ok:1,exp:'La segunda idea es una consecuencia de la primera: «en consecuencia», «por eso», «por lo tanto».'}},

{id:'t5',titulo:'Recursos de la argumentación',html:`
<p>Además de los argumentos, quien argumenta usa recursos de lenguaje que dejan ver su posición.</p>
<h4>Modalizadores</h4>
<p>Palabras o expresiones que muestran qué tan seguro está el autor o cómo valora lo que dice: «sin duda», «evidentemente», «quizás», «lamentablemente», «por suerte», «es necesario que…».</p>
<div class="ej">«<b>Lamentablemente</b>, la escuela llegó tarde a la discusión sobre la IA. <b>Quizás</b> todavía esté a tiempo.»</div>
<h4>Subjetivemas</h4>
<p>Palabras cargadas de valoración (sobre todo adjetivos y sustantivos): no es lo mismo decir «un videojuego» que «un videojuego <b>adictivo</b>», ni «un influencer» que «un <b>vendehúmo</b>».</p>
<h4>Ironía</h4>
<p>Decir lo contrario de lo que se piensa, para que el lector entienda lo que realmente se piensa. Swift propone comerse a los niños pobres para denunciar la crueldad de los ricos; Caparrós escribe «Fantástico…» para burlarse de lo que describe.</p>
<div class="ej">«¡Qué buena idea dejar el grupo del curso abierto toda la noche! Así nadie duerme y todos llegan frescos a la prueba.»</div>
<h4>Polifonía</h4>
<p>En la argumentación suelen aparecer otras voces: citas de especialistas, palabras del oponente para refutarlas, frases hechas. Arlt, por ejemplo, copia lo que dijo Monner Sans para después burlarse de eso.</p>`,
prueba:{q:'«Ningún científico duda de que nada de todo esto habría sucedido si no se hubiesen excedido en la caza del mamut.» (Caparrós) ¿Qué recurso predomina?',opts:['Cita de autoridad seria','Ironía','Datos y cifras','Concesión'],ok:1,exp:'El autor imita el tono de una cita científica para decir algo absurdo: es ironía. Se burla del razonamiento que critica.'}},

{id:'t6',titulo:'Nota de opinión, noticia y editorial',html:`
<p>En diarios, revistas y portales conviven textos que informan y textos que opinan.</p>
<table class="conn"><tbody>
<tr><th>Noticia</th><td>Informa un hecho reciente, sin juzgarlo (o intentando no hacerlo). No suele estar firmada.</td></tr>
<tr><th>Nota de opinión</th><td>Un autor (periodista o especialista) expresa su punto de vista personal sobre un tema. Está firmada: la opinión es de esa persona, no del medio.</td></tr>
<tr><th>Editorial</th><td>Expresa la posición del medio. Por eso no suele estar firmado (o lo firma el director). Usa fórmulas como «desde este diario…».</td></tr>
<tr><th>Carta de lectores</th><td>Un lector le escribe al medio para opinar, quejarse o responder a algo publicado.</td></tr>
<tr><th>Carta abierta</th><td>Una carta dirigida a alguien en particular, pero publicada para que la lea todo el mundo. Puede ser seria o, como la de Podetti, humorística.</td></tr>
</tbody></table>
<p>En internet la frontera es más borrosa: un posteo, un hilo o un video de un influencer pueden funcionar como notas de opinión.</p>`,
prueba:{q:'«Desde este diario sostenemos que la ley contra el ciberacoso no puede esperar más.» ¿Qué tipo de texto es?',opts:['Noticia','Nota de opinión','Editorial','Reseña'],ok:2,exp:'«Desde este diario» indica que habla el medio, no una persona: es un editorial.'}},

{id:'t7',titulo:'Publicidad y propaganda',html:`
<p>La publicidad es un discurso que busca <b>persuadir</b> a un público (los consumidores) para que compre algo. Su tesis es casi siempre la misma: <b>«comprá X porque Y»</b>.</p>
<ul><li>Está dirigida a un <b>público determinado</b>, y eso se nota en el tipo de lenguaje, los personajes, la música, los colores y los lugares donde aparece (no se publicita lo mismo en un video de Twitch que en un noticiero).</li>
<li>No apela solo a razones: busca la <b>identificación emotiva</b>. Propone una idea de felicidad a partir del consumo.</li>
<li>Muchas veces difunde <b>estereotipos y clichés</b>: la madre que limpia, el gamer encerrado, la chica perfecta.</li>
<li>Usa mucho algunas <b>falacias</b>: «lo usan millones» (ad populum), «lo recomienda tal famoso» (ad verecundiam).</li></ul>
<p>Hoy buena parte de la publicidad no parece publicidad: el influencer que «recomienda» un producto, el video patrocinado, el sorteo en Instagram. Reconocerla es el primer paso para no dejarse llevar.</p>
<p>La <b>propaganda política</b> es un discurso emparentado: busca que el público apoye a un candidato, un partido o una idea.</p>`,
prueba:{q:'«Los auriculares que usan los campeones de esports.» ¿Qué falacia publicitaria usa este eslogan?',opts:['Ad baculum','Ad verecundiam','Pregunta compleja','Petición de principio'],ok:1,exp:'Apela al prestigio de los campeones, que pueden saber de juegos pero no necesariamente de calidad de sonido: apelación a la autoridad (ad verecundiam).'}},

{id:'t8',titulo:'La reseña crítica',html:`
<p>La reseña mezcla <b>exposición</b> y <b>argumentación</b>: resume una obra (libro, película, serie, videojuego, disco, obra de teatro) y la <b>valora</b>. Debe resumir sin arruinar la sorpresa (sin spoilers) y dejar claro que la valoración es del autor de la reseña.</p>
<p>Partes habituales:</p>
<ol><li><b>Título</b> (muchas veces ya adelanta la valoración).</li>
<li><b>Presentación de la obra:</b> los datos de la ficha (autor o director, título, editorial o productora, año, duración o páginas, etc.).</li>
<li><b>Resumen expositivo:</b> los contenidos fundamentales, seleccionados y condensados. Suele incluir algo sobre el autor.</li>
<li><b>Comentario crítico:</b> la valoración, con argumentos.</li>
<li><b>Conclusión.</b></li></ol>
<p>A veces resumen y comentario aparecen mezclados. No hay que confundir la reseña con la <b>sinopsis</b>, que es solo un resumen, sin valoración.</p>`,
prueba:{q:'¿Qué diferencia a una reseña de una sinopsis?',opts:['La reseña es más corta','La reseña incluye una valoración crítica','La sinopsis tiene ficha técnica','La sinopsis cuenta el final'],ok:1,exp:'La sinopsis solo resume; la reseña también valora y argumenta esa valoración.'}},

{id:'t9',titulo:'La polémica',html:`
<p>La palabra viene del griego <i>polemikós</i>, «relativo a la guerra»: una polémica es una «guerra de palabras» en la que se enfrentan dos o más posiciones sobre un mismo tema. Por eso es un discurso <b>polifónico</b>: intervienen por lo menos dos voces, la del enunciador y la del oponente.</p>
<p>Como todo texto argumentativo busca persuadir, pero además se dirige a un <b>blanco</b> (el discurso del oponente, o el oponente mismo). Es un <b>contradiscurso</b>: no solo defiende su tesis, también intenta debilitar o destruir la contraria. Por eso abundan las citas del adversario, refutadas enseguida.</p>
<p>La polémica tiene tres tipos de destinatarios:</p>
<dl class="tipos">
<dt>Prodestinatario</dt><dd>El que ya está de acuerdo. No hay que convencerlo, solo fortalecerlo en sus ideas.</dd>
<dt>Contradestinatario</dt><dd>El rival. Tampoco se lo intenta convencer: es el blanco al que se ataca.</dd>
<dt>Paradestinatario</dt><dd>El indeciso, el que todavía no tomó posición. Es el verdadero destinatario de la persuasión.</dd></dl>
<div class="ej">En una discusión en el grupo del curso sobre si hacer o no el viaje de egresados en julio, tus amigos que ya están de acuerdo con vos son prodestinatarios; el que propone diciembre es el contradestinatario; los que todavía no votaron son los paradestinatarios: a ellos les estás hablando de verdad.</div>`,
prueba:{q:'En una polémica, ¿a quién se intenta persuadir realmente?',opts:['Al prodestinatario','Al contradestinatario','Al paradestinatario','A ninguno'],ok:2,exp:'El paradestinatario es el indeciso: de él se busca la adhesión. Al pro ya se lo tiene, y al contra se lo ataca.'}},

{id:'t10',titulo:'Falacias',html:`
<p>Una <b>falacia</b> es un argumento incorrecto que parece correcto: un razonamiento mal construido. No hay que confundir falacia con falsedad: la conclusión puede ser verdadera por casualidad, pero el razonamiento sigue estando mal. Conocer las falacias sirve para no dejarse engañar y para razonar mejor.</p>
<dl class="tipos">
<dt>Ad baculum (apelación a la fuerza)</dt><dd>Convencer con una amenaza, física o simbólica.<span>«Si no votás lo que digo, te saco del grupo.»</span></dd>
<dt>Ad hominem ofensivo</dt><dd>Atacar a la persona en lugar de su argumento.<span>«No le hagan caso a Tomás sobre el uniforme: es un vago.»</span></dd>
<dt>Ad hominem circunstancial</dt><dd>Descalificar el argumento por la situación de quien lo dice.<span>«Claro que la delegada quiere recreos más largos: es alumna.»</span></dd>
<dt>Tu quoque («vos también»)</dt><dd>Una variante del ad hominem: rechazar una crítica porque el que la hace comete la misma falta.<span>«¿Vos me decís que uso mucho el celular? ¡Si vos no lo soltás nunca!»</span></dd>
<dt>Ad ignorantiam (apelación a la ignorancia)</dt><dd>Afirmar que algo es verdadero porque no se probó que es falso (o al revés).<span>«Nadie demostró que la IA no tenga sentimientos; por lo tanto, los tiene.»</span></dd>
<dt>Ad populum (apelación a la mayoría)</dt><dd>Dar algo por válido porque mucha gente lo cree o lo hace.<span>«Todo el curso usa esa app para copiar; no puede estar tan mal.»</span></dd>
<dt>Ad verecundiam (falsa autoridad)</dt><dd>Citar a alguien importante en un campo, pero no en el tema que se discute.<span>«Esta dieta funciona: la recomienda un streamer con cinco millones de seguidores.»</span></dd>
<dt>Ad misericordiam (apelación a la piedad)</dt><dd>Provocar lástima para que se acepte lo que se dice.<span>«Profe, apruébeme: estuve toda la noche buscando a mi gato.»</span></dd>
<dt>Causa falsa</dt><dd>Establecer una relación de causa y efecto que no existe (por ejemplo, porque una cosa pasó después de otra).<span>«Desde que uso estas zapatillas ganamos todos los partidos: son de la suerte.»</span></dd>
<dt>Pregunta compleja</dt><dd>Una pregunta que esconde una afirmación previa.<span>«¿Ya dejaste de copiarte en las pruebas?»</span></dd>
<dt>Petición de principio</dt><dd>Dar como razón lo mismo que se quiere demostrar.<span>«Las redes son dañinas porque hacen daño.»</span></dd>
<dt>Falso dilema</dt><dd>Presentar solo dos opciones cuando hay más.<span>«O prohibimos la IA o nadie vuelve a pensar por sí mismo.»</span></dd>
<dt>Hombre de paja</dt><dd>Deformar la posición del otro para que sea más fácil atacarla.<span>«—Habría que regular las redes para menores. —O sea que querés prohibir internet.»</span></dd>
<dt>Pendiente resbaladiza</dt><dd>Suponer que un primer paso lleva sí o sí a una cadena de consecuencias catastróficas.<span>«Si dejamos el celular en el recreo, después lo van a querer en clase, después en las pruebas y al final nadie va a aprender nada.»</span></dd>
<dt>Generalización apresurada</dt><dd>Sacar una conclusión general a partir de uno o pocos casos.<span>«Conozco dos gamers agresivos: los videojuegos vuelven violenta a la gente.»</span></dd>
<dt>Conclusión irrelevante</dt><dd>Dar razones que no tienen nada que ver con lo que se concluye.<span>«Tiene que ganar el premio a mejor deportista: es muy buena persona y dona a una ONG.»</span></dd>
</dl>`,
prueba:{q:'«O estás conmigo o estás contra mí.» ¿Qué falacia es?',opts:['Hombre de paja','Falso dilema','Ad populum','Causa falsa'],ok:1,exp:'Reduce todo a dos opciones, cuando se puede, por ejemplo, no estar de acuerdo en todo sin ser un enemigo.'}}
];

const ARGS=[
{id:'ac-a',src:'Cuadernillo, p. 8',t:'Es falso que en los últimos años haya habido un aumento en los niveles de violencia social, como afirma el ministro.',ok:['ref'],exp:'«Es falso que…» niega el argumento de otro (el ministro): refutación.'},
{id:'ac-b',src:'Cuadernillo, p. 8',t:'¿Qué derecho tenía Colón a descubrir América cuando ya estaba siendo habitada desde hacía miles de años? El mismo derecho que ahora tengo para llegar a Italia y proclamar el descubrimiento de su país.',ok:['ana','preg'],exp:'Compara el «descubrimiento» de América con «descubrir» Italia hoy: analogía. Además, empieza con una pregunta retórica.'},

{id:'f26-h',src:'Cuadernillo, p. 26',t:'Esta película tiene que ser buena porque la ha visto mucha gente.',ok:['pop'],exp:'Que mucha gente la haya visto no prueba que sea buena.'},

{id:'f29-d',src:'Cuadernillo, p. 29',t:'Asistir a la iglesia es un factor valioso en la educación de la juventud, pues todos nuestros dirigentes, industriales y hombres de negocios lo recomiendan firmemente.',ok:['ver','pop'],exp:'Dirigentes y empresarios no son autoridad en educación (ad verecundiam); además se apoya en que «todos» lo recomiendan.'},

{id:'f29-g',src:'Cuadernillo, p. 29',t:'El vendedor: «¿Quiere pagar al contado y obtener nuestro descuento especial o prefiere usted nuestros ventajosos créditos? Mientras usted lo decide voy a disponer que se le entregue inmediatamente la mercadería».',ok:['comp','dilema'],exp:'La pregunta da por hecho que el cliente ya decidió comprar. Además le ofrece solo dos opciones.'},
