const TEXTS={"arlt1": ["Me escribe un lector:", "\"Me interesaría muchísimo que Vd. escribiera algunas notas sobre los libros que deberían leer los jóvenes, para que aprendan y se formen un concepto claro, amplio, de la existencia (no exceptuando, claro está, la experiencia propia de la vida)\".", "## NO LE PIDE NADA EL CUERPO...", "No le pide nada a usted el cuerpo, querido lector. Pero, ¿en dónde vive? ¿Cree usted acaso, por un minuto, que los libros le enseñarán a formarse \"un concepto claro y amplio de la existencia\"? Está equivocado, amigo; equivocado hasta decir basta. Lo que hacen los libros es desgraciarlo al hombre, créalo. No conozco un solo hombre feliz que lea. Y tengo amigos de todas las edades. Todos los individuos de existencia más o menos complicada que he conocido habían leído. Leído, desgraciadamente, mucho.", "Si hubiera un libro que enseñara, fíjese bien, si hubiera un libro que enseñara a formarse un concepto claro y amplio de la existencia, ese libro estaría en todas las manos, en todas las escuelas, en todas las universidades; no habría hogar que, en estante de honor, no tuviera ese libro que usted pide. ¿Se da cuenta?", "No se ha dado usted cuenta todavía de que si la gente lee, es porque espera encontrar la verdad en los libros. Y lo más que puede encontrarse en un libro es la verdad del autor, no la verdad de todos los hombres. Y esa verdad es relativa... esa verdad es tan chiquita... que es necesario leer muchos libros para aprender a despreciarlos.", "## LOS LIBROS Y LA VERDAD", "Calcule usted que en Alemania se publican anualmente más o menos 10.000 libros, que abarcan todos los géneros de la especulación literaria; en París ocurre lo mismo; en Londres, ídem; en Nueva York, igual.", "Piense esto:", "Si cada libro contuviera una verdad, una sola verdad nueva en la superficie de la tierra, el grado de civilización moral que habrían alcanzado los hombres sería incalculable. ¿No es así? Ahora bien, piense usted que los hombres de esas naciones cultas, Alemania, Inglaterra, Francia, están actualmente discutiendo la reducción de armamentos (no confundir con supresión). Ahora bien, sea un momento sensato usted. ¿Para qué sirve esa cultura de diez mil libros por nación, volcada anualmente sobre la cabeza de los habitantes de esas tierras? ¿Para qué sirve esa cultura, si en el año 1930, después de una guerra catastrófica como la de 1914, se discute un problema que debía causar espanto?", "¿Para qué han servido los libros, puede decirme usted? Yo, con toda sinceridad, le declaro que ignoro para qué sirven los libros. Que ignoro para qué sirve la obra de un señor Ricardo Rojas, de un señor Leopoldo Lugones, de un señor Capdevilla, para circunscribirme a este país.", "## EL ESCRITOR COMO OPERARIO", "Si usted conociera los entretelones de la literatura, se daría cuenta de que el escritor es un señor que tiene el oficio de escribir, como otro de fabricar casas. Nada más. Lo que lo diferencia del fabricante de casas, es que los libros no son tan útiles como las casas, y después... después que el fabricante de casas no es tan vanidoso como el escritor.", "En nuestros tiempos, el escritor se cree el centro del mundo. Macanea a gusto. Engaña a la opinión pública, consciente o inconscientemente. No revisa sus opiniones. Cree que lo que escribió es verdad por el hecho de haberlo escrito él. El es el centro del mundo. La gente que hasta experimenta dificultades para escribirle a la familia, cree que la mentalidad del escritor es superior a la de sus semejantes y está equivocada respecto a los libros y respecto a los autores. Todos nosotros, los que escribimos y firmamos, lo hacemos para ganarnos el puchero. Nada más. Y para ganarnos el puchero no vacilamos a veces en afirmar que lo blanco es negro y viceversa. Y, además, hasta a veces nos permitimos el cinismo de reírnos y de creernos genios...", "## DESORIENTADORES", "La mayoría de los que escribimos, lo que hacemos es desorientar a la opinión pública. La gente busca la verdad y nosotros les damos verdades equivocadas. Lo blanco por lo negro. Es doloroso confesarlo, pero es así. Hay que escribir. En Europa los autores tienen su público; a ese público le dan un libro por un año. ¿Usted puede creer, de buena fe, que en un año se escribe un libro que contenga verdades? No, señor. No es posible. Para escribir un libro por año hay que macanear. Dorar la píldora. Llenar páginas de frases.", "Es el oficio, \"el métier\". La gente recibe la mercadería y cree que es materia prima, cuando apenas se trata de una falsificación burda de otras falsificaciones, que también se inspiraron en falsificaciones.", "## CONCEPTO CLARO", "Si usted quiere formarse \"un concepto claro\" de la existencia, viva.", "Piense. Obre. Sea sincero. No se engañe a sí mismo. Analice. Estúdiese. El día que se conozca a usted mismo perfectamente, acuérdese de lo que le digo: en ningún libro va a encontrar nada que lo sorprenda. Todo será viejo para usted. Usted leerá por curiosidad libros y libros y siempre llegará a esa fatal palabra terminal: \"Pero sí esto lo había pensado yo, ya\". Y ningún libro podrá enseñarle nada.", "Salvo los que se han escrito sobre esta última guerra. Esos documentos trágicos valen la pena conocerlos. El resto es papel..."], "caparros1": ["Hoy empiezan las clases y no empiezan las clases: para la mayoría de los alumnos argentinos, esta mañana no hay escuela. Los maestros de medio país van a la huelga para pedir un sueldo que ninguno de nosotros, periodistas, por ejemplo, aceptaría ni para empezar. Son sueldos tan elocuentes, tan didácticos: dicen, antes que nada, que a la sociedad argentina la educación le importa tres carajos. O, mejor: que a la sociedad argentina le importa tres carajos la educación de sus pobres.", "Soy un producto de la escuela pública argentina y a veces, cuando me distraigo, me da orgullo; mi hijo también fue a la escuela pública y acaba de terminar su quinto año. Pero en las décadas que pasaron desde que empecé primer grado –inferior– nuestro sistema educativo cambió brutalmente. Cuando yo era chico sólo iban a colegios privados los garcas que querían educarse a fuerza de hostias y los raros que preferían hablar otros idiomas y los vagos que la escuela pública no soportaba más. Pero mis amigos y yo –hijos de la clásica clase media porteña– sabíamos que el sistema de educación estatal era nuestro lugar: la escuela pública era la mejor, la primera opción. Ahora no: mis amigos dudan mucho antes de mandar a sus hijos a una escuela del Estado –y la mayoría no lo hace.", "La educación pública ya no es para todos, ni para el que la elige; es para quien no tiene más remedio. Tres de cada cuatro alumnos estatales pertenecen al tercio más pobre de la población. Entre el 20 por ciento más pobre, nueve de cada diez van a la escuela pública; entre el 20 por ciento más rico, uno de cada siete. Y la tendencia se acelera: en 1997 el 24 por ciento de los chicos acomodados iba a escuelas públicas; en 2006, según un informe del Centro de Estudios de Políticas Públicas, sólo el 15 por ciento. Las cifras precisan lo que ya sabemos: que los padres quieren mandar a sus hijos al privado porque –mejores o peores– por lo menos les garantizan que van a tener clases. Cosa que el Estado no consigue hacer. Así que, entre 2003 y 2006, en apenas tres años kirchneristas, 800.000 argentinitos –casi todos los que pueden– pasaron del público al privado. En la escuela sarmientina quedan los que no pueden: los más pobres.", "El fracaso de la educación pública es el efecto más espectacular del derrumbe del Estado argentino. Solía ser su estandarte: la forma más eficiente de producir esa relativa integración social que nos constituyó como país, en esas aulas donde, bajo los delantales blancos, las clases sociales se mezclaban por un rato y se formaban con las mismas consignas, las posibilidades brevemente emparejadas. La educación pública servía para equilibrar, para integrar, para “redistribuir” –y para producir un país más educado, con mejores posibilidades en todos los terrenos. Ahora parece como si no importara. Y, de hecho, no les importa a los que manejan el Estado: hace mucho que mandan a sus chicos a colegios privados. Es una característica de muchos estados actuales –sus dirigentes no se incluyen en ellos, no usan sus escuelas y hospitales, no le pagan impuestos, no respetan sus leyes–y es curiosa: ¿quién se imagina al gerente de la cocacola pidiéndose una pepsi?", "Así que tengo una propuesta populista para encarar la cuestión educativa. Es una ley que habría que votar cuanto antes: “Queridos gobernantes, no todo pueden ser alegrías, ganancias extraordinarias, honores merecidos, gratitud popular. Los cargos deben tener alguna carga. Y ésta será modesta pero inflexible: se ordena, so pena de prisión y pedorreta pública, que todos los funcionarios del Estado –de un nivel equis para arriba– manden a sus hijos y nietos, sin excepción, a la escuela estatal más cercana”. Es posible que, entonces, la educación pública mejore seriamente. Así estamos, en la lucha de clases."], "batlle": ["Dicen quienes desprecian al fútbol que son 22 personas corriendo detrás de una pelota y podrían argumentar aquellos que minimicen los alcances de John Wick 4 que son tres horas de tipos golpeándose y/o disparándose. No estoy con unos ni con otros. No escribiré aquí en defensa del arte del fútbol, pero sí una exaltación de los logros y hallazgos de la saga en general y de esta cuarta entrega en particular.", "El de John Wick es un caso único (o muy infrecuente) de una saga que va creciendo en todos los aspectos con el paso del tiempo. La primera película (2014) costó 20 millones de dólares, duraba 101 minutos y recaudó 86 millones en las salas de todo el mundo; la segunda (2017) duraba 122 y tuvo 172 millones de ingresos; la tercera (2019) pasó a 130 minutos, costó 75 millones y consiguió 328 millones en taquilla, mientras que esta cuarta tuvo un presupuesto de 90 millones, dura 169 minutos y seguramente tendrá la mejor recaudación de toda la franquicia.", "Semejante “inflación”, contra todos los pronósticos, no afecta sino que incluso potencia el resultado final de esta cuarta entrega. Cualquiera dirá que el corte final podría haber tenido 20, 40 o 60 minutos menos, pero es precisamente en la acumulación, en el desborde, en sus ínfulas desmedidas, que la película encuentra su aspecto distintivo, su razón de ser. De hecho, tras una primera parte impecable, pero bastante genérica, John Wick 4 alcanza en su segunda mitad (rodada en los lugares más emblemáticos de París como la Torre Eiffel, el Arco de Triunfo o la basílica de Sacré-Cœur de Montmartre) el pico no solo de esta película sino de toda la saga.", "Con muy pocos diálogos, mínimo desarrollo de personajes y excusas argumentales básicas, John Wick arranca su viaje por Nueva York, Osaka, Berlín y no se detendrá hasta el mencionado desenlace parisino. A Wick lo perseguirán por el mundo temibles organizaciones (como la denominada Mesa Alta que lidera El Marqués de Bill Skarsgård) e individuos (desde Caine, el eximio luchador no vidente de Donnie Yen, hasta el Tracker de Shamier Anderson y su feroz perro) y contará en principio con algunas ayudas: el Bowery King de Laurence Fishburne, el Shimazu de Hiroyuki Sanada y su hija, la Akira de Rina Sawayama, o el Winston del gran Ian McShane, a quien en los primeros minutos le vuelan por los aires su hotel Continental y le matan frente a sus ojos a su leal conserje Charon (Lance Reddick).", "Las influencias de John Wick son conocidas (las coreografías de Bruce Lee, la estilización de John Woo y los thrillers del cine hongkonés de la década de 1980, el neo-noir del danés Nicolas Winding Refn, pero también la saga Matrix, la estética de los videojuegos de acción, el comic y el universo animado de Tex Avery) y en esta cuarta entrega Chad Stahelski lleva esa mixtura a nuevas dimensiones con largas secuencias dentro de una discoteca, en plena calle o sobre unas escaleras; bajo el agua o en un virtuoso plano secuencia con una cámara siempre cenital.", "Y habrá un duelo con espíritu de spaghetti western a-la-Sergio Leone. Y un cierre con mucho de épica y toque romántico. Si es que efectivamente se trata del final de la saga, con John Wick 4 se termina a lo grande, como para que el universo concebido por Stahelski-Reeves quede en cuatro entregas de culto, con su propia mitología y un legado indeleble."], "forn": ["Un hombre cualquiera, al que vamos a llamar Emmanuel Carrère, está de vacaciones en un hotel en las playas de Sri Lanka, con su mujer y su hijo, cuando sobreviene el terrible tsunami de 2004. Los tres salen ilesos, pero una joven pareja que se les sentaba a la mesa de al lado en cada comida pierde a su pequeña hija. El hotel y la zona quedan aislados. Todo es atroz. Hay cientos de muertos y los vivos los tienen en sus caras. La pareja que perdió a su hija es francesa, como Carrère y su mujer; la nena muerta tenía casi la misma edad que el hijo de la mujer de Carrère. Casi sin conocerse, las dos parejas pasan a ser familia, en la aciaga tarea de recuperar el cadáver y dar sostén y acompañar en el dolor. Están tan íntimamente próximas y tan radicalmente distanciadas como es posible estarlo: una pareja salió ilesa, a la otra le pasó lo peor. En determinado momento, en una caótica sala de hospital, mientras esperan por el cadáver de la niña, asisten al encuentro de una mujer con el esposo que creía muerto. La sala entera queda en silencio contemplando cómo ese hombre y esa mujer se tocan el rostro y se miran atónitos a los ojos y lloran. Incluso la pareja que ha perdido a su hija se queda contemplando la escena, por un instante idos de su terrible realidad. Cuando Carrère y su mujer se echan a descansar por primera vez, horas antes de abordar el avión que los devuelva a Francia, lo único que puede pensar él, como un mantra protector, es un anhelo desesperado: que un día esa mujer a la que abraza sea vieja, y él también, y siga queriéndola. Que sigan vivos, que sigan juntos, como en esa cama, en ese momento.", "Dos meses después, ya en París, la mujer de Carrère recibe la noticia de que su hermana menor tiene cáncer, y es fulminante y sin esperanzas. La hermana tiene 38 años, marido y tres hijas pequeñas. Es jueza en una pequeña ciudad de provincia. Es, además, feliz. A los quince años zafó del primer zarpazo del cáncer, pero ese zarpazo le llevó una pierna. Eso definió su vida. Se hundió en los libros de Derecho, creyó que no tenía posibilidad de ser feliz hasta que apareció alguien que no la quería porque fuera lisiada ni a pesar de que fuera lisiada: simplemente la quería. El Derecho y ese hombre que le dio tres hijas son la vida de ella. Una vida pequeña, burguesa, de provincia, que acaba de entrar en brutal y acelerada cuenta regresiva. Los médicos le han explicado cómo será. La joven jueza encara su muerte con la parsimonia con que encaró cada juicio que le tocó presidir. Carrère y su mujer asisten a ese rito de despedida: llegan para verla despedirse paso a paso de sus pequeñas hijas y morir abrazada por el hombre que la amó totalmente (a quien ella le pide: “Diles que luché, que hice todo lo que pude para no dejarlas”).", "Carrère tuvo delante, en breves meses, las dos cosas que más miedo dan en este mundo: la muerte de una hija pequeña para sus padres y la muerte de una mujer joven para su marido y sus hijos. “La vida me hizo testigo de esas desgracias una tras otra y me encomendó, o al menos así lo he entendido, dar testimonio de ello.” ¿Por qué dice eso Carrère? Porque, después del entierro de la jueza, conoce a un colega de la difunta, un hombre que es de la edad de ella y es juez como ella, y está felizmente casado y tiene hijos pequeños como ella, y es lisiado y víctima del cáncer como ella: ese hombre convoca a la familia para explicarles qué clase de juez fue la jueza y cómo fue la vida para ella, tal como se la confesó a la única persona en el mundo a quien podía contarle todo sin temer despertar lástima, compasión. La manera en que ese hombre les habla “no era serenidad, ni sabiduría, ni dominio de sí mismo, sino una forma de apoyarse en su miedo y desplegarlo. Era todo lo que siendo él no era él: lo que lo superaba, lo inspiraba, lo maltrataba y lo salvaba, y a lo que poco a poco había aprendido a dejar actuar”.", "Hay experiencias que nos enseñan algo inequívocamente. Incluso la vecindad con ciertas experiencias puede enseñarnos algo inequívocamente. Es asombroso que eso pueda ocurrir a través de la palabra. Eso es lo que siente Carrère cuando lo ve ocurrir delante de sus ojos, en las palabras de ese joven juez lisiado. Porque ese hombre que mira a la muerte de frente habla como debería hablar la literatura, como alguna vez habló. Así intenta Carrère que hable el libro que escribe, un libro que en francés se llamó De otras vidas que la mía (en castellano se llama, más escuetamente, De vidas ajenas). Viene la desgracia y pasa su guadaña y qué queda. Hay una escena en el libro en que la jueza lisiada entra por primera vez en la oficina del juez lisiado. Al verla, éste se sonríe y se alza de su escritorio con sus muletas, para que las vea la mujer en muletas que tiene enfrente. Carrère dice: “Se reconocieron al instante”. Yo creo hace mucho en las hermandades que produce la desgracia: el nivel de comunicación casi absoluta que se da de pronto entre hermanos de desgracia. Carrère encuentra nombre a lo que estuvo asistiendo, a través de las palabras de aquel juez. Se reconoce al instante, como se reconocieron esos dos jueces. Se siente adentro de la escena, como todos aquellos que miraban a la pareja reencontrada en aquel hospital de Sri Lanka, como la familia de su mujer mirando a la jueza decir a su marido, poco antes de partir por última vez al hospital, cuando la hija menor, que es un bebé, pide que la alce la madre: “No tiene que acostumbrarse a mí porque después me echará más en falta”.", "Hay ciertos libros capaces de producir lo mismo que nos hace la desgracia, la enfermedad, la muerte, cuando nos pasa cerca, cuando nos semblantea. En ambos casos hacen que nos importe más lo que nos asemeja a las demás personas que lo que nos distingue de ellas. Quizá sea imposible vivir ahí siempre, o incluso estar ahí seguido, pero cuando ocurre es estremecedor, nos queda grabado en el adn. Lo que nos asemeja a los demás por encima de lo que nos distingue de ellos. Lo que aprendemos entre todos es lo más valioso que se puede aprender, porque no lo sabemos solos: sabemos que otro lo sabe también. Esa ceremonia logra Carrère que ocurra en su libro. El juez, la jueza, su viudo con tres hijas pequeñas, la pareja que perdió a su hijita, el aleteo de esa mariposa negra que es la desgracia, y nosotros, los demás. Hay otras vidas que no son la nuestra.", "Si van a leer un solo libro este año, que sea éste."], "karakas": ["Me siento obligado a señalar las engañosas analogías y la incorrecta información histórica que se menciona en el artículo “La gran novela del genocidio armenio”, escrito por Marcos Aguinis y publicado en LA NACION el 12 de marzo. Allí, Aguinis intenta trazar un paralelismo entre el Holocausto y los acontecimientos de 1915. En lugar de hacer analogías directas entre los dos acontecimientos de la historia, Aguinis optó por un enfoque más sutil.", "Los turcos no niegan el sufrimiento de los armenios durante la Primera Guerra Mundial. Muchos armenios murieron o fueron asesinados en ese trágico período. Sin embargo, sin duda muchos más turcos perecieron en el período previo y durante esa guerra. El hecho es que los acontecimientos de 1915 son incomparables a lo que sucedió en Alemania entre 1933 y 1945. Es éticamente problemático y sumamente injusto, tanto para los turcos como para los judíos, tratar de establecer una analogía entre el Holocausto, un fenómeno reconocido a nivel mundial, y los eventos de 1915, sobre los cuales continúa una genuina controversia histórica. Las diferencias entre los dos en términos de naturaleza, propósito y alcance son tan amplias que hacer una comparación resulta altamente problemático.", "El autor menciona la repetida frase atribuida a Hitler (“¿Quién se acuerda del genocidio armenio?”). No hay ninguna evidencia verdadera disponible de que Hitler se haya referido a los armenios de esa manera. De hecho, los juicios de Nuremberg rechazaron todo documento que incluyera cualquier expresión parecida atribuida a Hitler. Además, de haber realizado Hitler esa declaración, ¿deberían sus ideas personales sobre temas específicos ser tomadas como referencia para avanzar en un argumento? De hecho, la supuesta declaración de Hitler es tan poco confiable que hoy es solamente utilizada por aquellos que quieren influir en audiencias desinformadas.", "A menudo se olvida que el genocidio es un delito específico definido por la ley internacional. La Convención de 1948 nos dice qué es genocidio y cómo puede determinarse: un tribunal internacional competente puede establecer si un evento es un genocidio. Ese fallo judicial existe para el Holocausto, Ruanda y Srebrenica. Sin embargo, ningún fallo de este tipo existe para 1915.", "El Holocausto se basó en una ideología racista; se nutrió del antisemitismo que prevaleció en Europa durante siglos. Los judíos no se habían rebelado contra el gobierno alemán, no habían cooperado con las potencias extranjeras contra Alemania, no habían traicionado al ejército alemán y tampoco constituían una amenaza para el Estado alemán. Las mismas observaciones no se pueden aplicar a los grupos militantes armenios del Imperio Otomano que cooperaron con los ejércitos invasores.", "Los judíos fueron aniquilados en una consciente, planificada, coordinada y sistemática campaña de desgaste. Durante la reubicación de la población armenia, el Imperio Otomano tomó medidas de seguridad para proteger las caravanas. El gobierno otomano condenó y castigó severamente a alrededor de 2000 administradores civiles y militares que dañaron o maltrataron a los armenios durante su reubicación. Por el contrario, los judíos fueron matados donde estuviesen y quienes protegían a los judíos fueron castigados severamente.", "Los acontecimientos de 1915 no son comparables con el Holocausto. Ambas partes sufrieron en este período. A los armenios les gustaría establecer su narrativa nacional como la verdad indiscutible, pero esto no conduce a la reconciliación. Los turcos y los armenios deben trabajar para reconstruir la amistad histórica que existía desde hace siglos, hasta finales del siglo XIX y principios del XX, sin olvidar los momentos difíciles de su pasado común. El diálogo y los estudios académicos conjuntos entre las dos naciones son esenciales para resolver este tema controversial."], "tokatlian": ["La nota publicada el 26 de abril por LA NACION y escrita por el embajador de Turquía en la Argentina, Taner Karakas, en torno al genocidio armenio es un escrito inquietante para los argentinos descendientes de armenios y para todos aquellos que, desde diferentes orillas ideológicas, partidistas y sociales creemos que la defensa y la promoción de los derechos humanos es un pilar de la convivencia nacional, un compromiso ineludible de la política exterior y un imperativo de la comunidad internacional.", "El señor Karakas pretende desconocer las múltiples evidencias sólidas que afirman que lo que ocurrió entre 1915-1924 a los armenios en el Imperio Otomano, y en Turquía como Estado sucesor, fue un genocidio en términos de la Convención de 1948. El señor Karakas no menciona el hecho de que en varios países (entre ellos, la Argentina), tanto los Ejecutivos como los legislativos y algunos jueces han reconocido explícitamente que lo ocurrido entre 1915-24 fue un genocidio. El señor Karakas se permite dudar de la frase de Hitler (“¿Quién se acuerda del genocidio armenio?”) a pesar de que hay fundadas evidencias de que Hitler conoció lo sucedido al pueblo armenio y varios alemanes (Max Erwin von Scheubner-Richter, Karl Dönitz, Hans von Seeckt y Rudolf Höss, por ejemplo) que años más tarde apoyaron o rodearon al Führer estuvieron en Turquía durante los años del genocidio armenio. El señor Karakas procura, mediante una comparación opaca y sofística, separar las vivencias genocidas que en distintas circunstancias históricas sufrieron judíos y armenios.", "A pesar de que es claro que los argumentos anteriores forman parte de la lógica de la diplomacia turca es inadmisible y alarmante que para sostenerlos señale que los armenios, a diferencia de los judíos, habrían sido merecedores de su destino por su supuesta cooperación “con los ejércitos invasores”, lo que es una falacia.", "Este argumento significa un escalamiento en la política de negación del genocidio por parte de Turquía. No es suficiente la negación; ahora se trata de tergiversar los hechos históricos. “Algo habrán hecho” era el mensaje de la última dictadura argentina para legitimar su política de tortura, desaparición y muerte. Esa noción supo calar en algunos sectores de la sociedad argentina. El señor Karakas transmite hoy el mismo mensaje ominoso: algo hicieron los armenios.", "Es posible que se crea que sus palabras sólo deben ser repudiadas por los argentinos descendientes de armenios. Sin embargo, creerlo sería pensar que la tentación genocida, en muchas latitudes, es cosa del pasado."], "melikian": ["En un artículo reciente, bajo el título “El genocidio, un delito definido por la ley”, el embajador de Turquía Taner Karakas apela a variados recursos para demostrar que el exterminio de 1.500.000 armenios por parte del Imperio Otomano no fue un genocidio.", "La verdad histórica es que hace 98 años se cometió un crimen diabólico contra el pueblo armenio, que vivía pacíficamente en la cuna de su nacionalidad. Ese crimen sería caracterizado y definido varias décadas después, en 1944, por el jurista polaco Rafael Lemkin, quien, al crear el término genocidio, intentaba describir y definir la política nazi de asesinatos y violaciones, así como las atrocidades cometidas en 1915 contra los armenios.", "En 1948, la ONU adoptó la Convención sobre Prevención y Castigo del Delito de Genocidio, definido como un crimen internacional, y desde entonces, los países miembros de la convención están obligados a prevenir, así como a castigar a los que cometen un crimen de esa naturaleza.", "El plan de exterminio y destierro del pueblo armenio fue trazado y ejecutado fríamente por el gobierno del Imperio Otomano y hoy se inscribe entre los ejemplos más claros del terrorismo de Estado. El objetivo era uno solo: el gobierno de los Jóvenes Turcos, para preservar los restos del debilitado Imperio Otomano, dio nacimiento a la ideología del panturquismo, es decir, la constitución de un inmenso imperio cuyas fronteras llegarían hasta China y abarcaría a todos los pueblos de habla turca del Cáucaso y de Asia Central. El plan preveía también la turquificación de todas las minorías nacionales. La población armenia era considerada el principal obstáculo en ese camino.", "Preparado detalladamente, el plan se ejecutó en varias etapas. La primera etapa comenzó con la eliminación de cientos de intelectuales armenios el 24 de abril de 1915. La segunda fue el reclutamiento de más de 60.000 armenios para el ejército otomano, que fueron asesinados por sus compañeros de armas turcos. La tercera parte del genocidio se caracterizó por la matanza y el destierro de mujeres, ancianos y niños hacia los desiertos de Siria, donde miles de ellos murieron de hambre y enfermedades. Decenas de miles de armenios cristianos fueron islamizados por la fuerza. La última etapa del genocidio está definida por la negación de las deportaciones y del plan de exterminio por parte del gobierno turco.", "Esa política de negacionismo continúa hasta hoy, como lo prueba el artículo del embajador Taner Karakas. La negación es la continuación más directa del genocidio, un hecho innegable que, tarde o temprano, obligará a Turquía a enfrentarse con su pasado y saldar cuentas con la historia.", "Se podría haber esperado del embajador turco un mínimo respeto a la memoria de los armenios víctimas del genocidio, decenas de miles de cuyos descendientes hoy viven en la Argentina.", "El reconocimiento y la condena del genocidio de 1915-1923, por los cuales lucha todo el pueblo armenio unido, no constituyen un fin en sí mismos. Es un permanente mensaje a la comunidad internacional destinado a prevenir futuros crímenes, impedir la repetición de los ya cometidos y detener nuevos intentos, porque el genocidio no es un crimen contra tal o cual nación, sino contra toda la humanidad."], "swift": ["Es un asunto melancólico para quienes pasean por esta gran ciudad o viajan por el campo, ver las calles, los caminos y las puertas de las cabañas atestados de mendigos del sexo femenino, seguidos de tres, cuatro o seis niños, todos en harapos e importunando a cada viajero por una limosna. Esas madres, en vez de hallarse en condiciones de trabajar para ganarse la vida honestamente, se ven obligadas a perder su tiempo en la vagancia, mendigando el sustento de sus desvalidos infantes: quienes, apenas crecen, se hacen ladrones por falta de trabajo. (...)", "Creo que todos los partidos están de acuerdo en que este número prodigioso de niños en los brazos, sobre las espaldas o a los talones de sus madres, y frecuentemente de sus padres, resulta en el deplorable estado actual del Reino un perjuicio adicional muy grande; y por lo tanto, quienquiera que encontrase un método razonable, económico y fácil para hacer de ellos miembros cabales y útiles del estado, merecería tanto agradecimiento del público como para tener instalada su estatua como protector de la Nación.", "(...)", "Por mi parte, habiendo volcado mis pensamientos durante muchos años sobre este importante asunto, y sopesado maduradamente los diversos planes de otros proyectistas, siempre los he encontrado groseramente equivocados en su cálculo. Es cierto que un niño recién nacido puede ser mantenido durante un año solar por la leche materna y poco alimento más; a lo sumo por un valor no mayor de dos chelines o su equivalente en mendrugos, que la madre puede conseguir ciertamente mediante su legítima ocupación de mendigar. Y es exactamente al año de edad que yo propongo que nos ocupemos de ellos de manera tal que en lugar de constituir una carga para sus padres o la parroquia, o de carecer de comida y vestido por el resto de sus vidas, contribuirán por el contrario a la alimentación, y en parte a la vestimenta, de muchos miles.", "Hay además otra gran ventaja en mi plan, que evitará esos abortos voluntarios y esa práctica horrenda, ¡cielos!, ¡demasiado frecuente entre nosotros!, de mujeres que asesinan a sus hijos bastardos, sacrificando a los pobres bebés inocentes, no sé si más por evitar los gastos que la vergüenza, lo cual arrancaría las lágrimas y la piedad del pecho más salvaje e inhumano.", "El número de almas en este reino se estima usualmente en un millón y medio, de éstas calculo que puede haber aproximadamente doscientas mil parejas cuyas mujeres son fecundas; de ese número resto treinta mil parejas capaces de mantener a sus hijos, aunque entiendo que puede no haber tantas bajo las actuales angustias del reino; pero suponiéndolo así, quedarán ciento setenta mil parideras. Resto nuevamente cincuenta mil por las mujeres que abortan, o cuyos hijos mueren por accidente o enfermedad antes de cumplir el año. Quedan sólo ciento veinte mil hijos de padres pobres nacidos anualmente: la cuestión es entonces, cómo se educará y sostendrá a esta cantidad, lo cual, como ya he dicho, es completamente imposible, en el actual estado de cosas, mediante los métodos hasta ahora propuestos. Porque no podemos emplearlos ni en la artesanía ni en la agricultura; ni construimos casas (quiero decir en el campo) ni cultivamos la tierra: raramente pueden ganarse la vida mediante el robo antes de los seis años, excepto cuando están precozmente dotados. (...)", "Propondré ahora por lo tanto humildemente mis propias reflexiones, que espero no se prestarán a la menor objeción.", "Me ha asegurado un americano muy entendido que conozco en Londres, que un tierno niño sano y bien criado constituye al año de edad el alimento más delicioso, nutritivo y saludable, ya sea estofado, asado, al horno o hervido; y no dudo que servirá igualmente en un fricasé o un ragout.", "Ofrezco por lo tanto humildemente a la consideración del público que de los ciento veinte mil niños ya calculados, veinte mil se reserven para la reproducción, de los cuales sólo una cuarta parte serán machos; lo que es más de lo que permitimos a las ovejas, las vacas y los puercos; y mi razón es que esos niños raramente son frutos del matrimonio, una circunstancia no muy estimada por nuestros salvajes, en consecuencia un macho será suficiente para servir a cuatro hembras. De manera que los cien mil restantes pueden, al año de edad, ser ofrecidos en venta a las personas de calidad y fortuna del reino; aconsejando siempre a las madres que los amamanten copiosamente durante el último mes, a fin de ponerlos regordetes y mantecosos para una buena mesa. Un niño llenará dos fuentes en una comida para los amigos; y cuando la familia cene sola, el cuarto delantero o trasero constituirá un plato razonable, y sazonado con un poco de pimienta o de sal después de hervirlo resultará muy bueno hasta el cuarto día, especialmente en invierno.", "He calculado que como término medio un niño recién nacido pesará doce libras, y en un año solar, si es tolerablemente criado, alcanzará las veintiocho.", "Concedo que este manjar resultará algo costoso, y será por lo tanto muy apropiado para terratenientes, quienes, como ya han devorado a la mayoría de los padres, parecen acreditar los mejores derechos sobre los hijos.", "(...)", "Ya he calculado el costo de crianza de un hijo de mendigo (entre los que incluyo a todos los cabañeros, a los jornaleros y a cuatro quintos de los campesinos) en unos dos chelines por año, harapos incluidos; y creo que ningún caballero se quejaría de pagar diez chelines por el cuerpo de un buen niño gordo, del cual, como he dicho, sacará cuatro fuentes de excelente carne nutritiva cuando sólo tenga a algún amigo o a su propia familia a comer con él. De este modo, el hacendado aprenderá a ser un buen terrateniente y se hará popular entre los arrendatarios; y la madre tendrá ocho chelines de ganancia limpia y quedará en condiciones de trabajar hasta que produzca otro niño.", "Quienes sean más ahorrativos (como debo confesar que requieren los tiempos) pueden desollar el cuerpo; con la piel, artificiosamente preparada, se podrán hacer admirables guantes para damas y botas de verano para caballeros elegantes.", "En nuestra ciudad de Dublín, los mataderos para este propósito pueden establecerse en sus zonas más convenientes, y podemos estar seguros de que carniceros no faltarán; aunque más bien recomiendo comprar los niños vivos y adobarlos mientras aún están tibios del cuchillo, como hacemos para asar los cerdos.", "(...)", "Algunas personas de espíritu agorero están muy preocupadas por la gran cantidad de pobres que están viejos, enfermos o inválidos, y me han pedido que dedique mi talento a encontrar el medio de desembarazar a la nación de un estorbo tan gravoso. Pero este asunto no me aflige en absoluto, porque es muy sabido que esa gente se está muriendo y pudriendo cada día por el frío y el hambre, la inmundicia y los piojos, tan rápidamente como se puede razonablemente esperar. Y en cuanto a los trabajadores jóvenes, están en una situación igualmente prometedora; no pueden conseguir trabajo y desfallecen de hambre, hasta tal punto que si alguna vez son tomados para un trabajo común no tienen fuerza para cumplirlo; y entonces el país y ellos mismos son felizmente librados de los males futuros.", "He divagado excesivamente, de manera que volveré al tema. Me parece que las ventajas de la proposición que he enunciado son obvias y muchas, así como de la mayor importancia.", "En primer lugar, los más pobres arrendatarios poseerán algo de valor que la ley podrá hacer embargable y que les ayudará a pagar su renta al terrateniente, habiendo sido confiscados ya su ganado y cereales, y siendo el dinero algo desconocido para ellos.", "Segundo, puesto que la manutención de cien mil niños, de dos años para arriba, no se puede calcular en menos de diez chelines anuales por cada uno, el tesoro nacional se verá incrementado en cincuenta mil libras por año, sin contar el provecho del nuevo plato introducido en las mesas de todos los caballeros de fortuna del reino que tengan algún refinamiento en el gusto. Y el dinero circulará sólo entre nosotros, ya que los bienes serán enteramente producidos y manufacturados por nosotros.", "Tercero, las reproductoras constantes, además de ganar ocho chelines anuales por la venta de sus niños, se quitarán de encima la obligación de mantenerlos después del primer año.", "Cuarta, este manjar atraerá una gran clientela a las tabernas, donde los venteros serán seguramente tan prudentes como para procurarse las mejores recetas para prepararlo a la perfección, y consecuentemente ver sus casas frecuentadas por todos los distinguidos caballeros, quienes se precian con justicia de su conocimiento del buen comer: y un diestro cocinero, que sepa cómo agradar a sus huéspedes, se las ingeniará para hacerlo tan caro como a ellos les plazca.", "Quinto: esto constituirá un gran estímulo para el matrimonio, que todas las naciones sabias han alentado mediante recompensas o impuesto mediante leyes y penalidades. Aumentaría el cuidado y la ternura de las madres hacia sus hijos, al estar seguras de que los pobres niños tendrían una colocación de por vida, provista de algún modo por el público, y que les daría una ganancia anual en vez de gastos. Pronto veríamos una honesta emulación entre las mujeres casadas para mostrar cuál de ellas lleva al mercado al niño más gordo. Los hombres atenderían a sus esposas durante el embarazo tanto como atienden ahora a sus yeguas, sus vacas o sus puercas cuando están por parir; y no las amenazarían con golpearlas o patearlas (práctica tan frecuente) por temor a un aborto.", "Muchas otras ventajas podrían enumerarse. Por ejemplo, la adición de algunos miles de reses a nuestra exportación de carne en barricas, la difusión de la carne de puerco y el progreso en el arte de hacer buen tocino, del que tanto carecemos ahora a causa de la gran destrucción de cerdos, demasiado frecuentes en nuestras mesas; que no pueden compararse en gusto o magnificencia con un niño de un año, gordo y bien desarrollado, que hará un papel considerable en el banquete de un Alcalde o en cualquier otro convite público. Pero, siendo adicto a la brevedad, omito esta y muchas otras ventajas.", "Suponiendo que mil familias de esta ciudad serían compradoras habituales de carne de niño, además de otras que la comerían en celebraciones, especialmente casamientos y bautismos: calculo que en Dublín se colocarían anualmente cerca de veinte mil cuerpos, y en el resto del reino (donde probablemente se venderán algo más barato) las restantes ochenta mil.", "No se me ocurre ningún reparo que pueda oponerse razonablemente contra esta proposición, a menos que se aduzca que la población del Reino se vería muy disminuida. Esto lo reconozco francamente, y fue de hecho mi principal motivo para ofrecerla al mundo. Deseo que el lector observe que he calculado mi remedio para este único y particular Reino de Irlanda, y no para cualquier otro que haya existido, exista o pueda existir sobre la tierra. Por consiguiente, que ningún hombre me hable de otros expedientes: de crear impuestos para nuestros desocupados a cinco chelines por libra; de no usar ropas ni mobiliario que no sean producidos por nosotros; de rechazar completamente los materiales e instrumentos que fomenten el lujo exótico; de curar el derroche de engreimiento, vanidad, holgazanería y juego en nuestras mujeres; de introducir una vena de parsimonia, prudencia y templanza; de aprender a amar a nuestro país, en lo cual nos diferenciamos hasta de los lapones y los habitantes de Tupinambú; de abandonar nuestras animosidades y facciones; de cuidarnos un poco de no vender nuestro país y nuestra conciencia por nada; de enseñar a los terratenientes a tener aunque sea un punto de compasión de sus arrendatarios. De imponer, en fin, un espíritu de honestidad, industria y cuidado en nuestros comerciantes, quienes, si hoy tomáramos la decisión de no comprar otras mercancías que las nacionales, inmediatamente se unirían para trampearnos en el precio, la medida y la calidad, y a quienes por mucho que se insistiera no se les podría arrancar una sola oferta de comercio honrado.", "Por consiguiente, repito, que ningún hombre me hable de esos y parecidos expedientes, hasta que no tenga por lo menos un atisbo de esperanza de que se hará alguna vez un intento sano y sincero de ponerlos en práctica. Pero en lo que a mí concierne, habiéndome fatigado durante muchos años ofreciendo ideas vanas, ociosas y visionarias, y al final completamente sin esperanza de éxito, di afortunadamente con este proyecto, que por ser totalmente novedoso tiene algo de sólido y real, trae además poco gasto y pocos problemas, está completamente a nuestro alcance, y no nos pone en peligro de desagradar a Inglaterra.(...)", "Después de todo, no me siento tan violentamente ligado a mi propia opinión como para rechazar cualquier plan propuesto por hombres sabios que fuera hallado igualmente inocente, barato, cómodo y eficaz. Pero antes de que alguna cosa de ese tipo sea propuesta en contradicción con mi plan, deseo que el autor o los autores consideren seriamente dos puntos. Primero, tal como están las cosas, cómo se las arreglarán para encontrar ropas y alimentos para cien mil bocas y espaldas inútiles. Y segundo, ya que hay en este reino alrededor de un millón de criaturas de forma humana cuyos gastos de subsistencia reunidos las dejaría debiendo dos millones de libras esterlinas, añadiendo los que son mendigos profesionales al grueso de campesinos, cabañeros y peones, con sus esposas e hijos, que son mendigos de hecho: yo deseo que esos políticos que no gusten de mi propuesta y sean tan atrevidos como para intentar una contestación, pregunten primero a lo padres de esos mortales si hoy no creen que habría sido una gran felicidad para ellos haber sido vendidos como alimento al año de edad de la manera que yo recomiendo, y de ese modo haberse evitado un escenario perpetuo de infortunios como el que han atravesado desde entonces por la opresión de los terratenientes, la imposibilidad de pagar la renta sin dinero, la falta de sustento y de casa y vestido para protegerse de las inclemencias del tiempo, y la más inevitable expectativa de legar parecidas o mayores miserias a sus descendientes para siempre.", "Declaro, con toda la sinceridad de mi corazón, que no tengo el menor interés personal en esforzarme por promover esta obra necesaria, y que no me impulsa otro motivo que el bien público de mi patria, desarrollando nuestro comercio, cuidando de los niños, aliviando al pobre y dando algún placer al rico. No tengo hijos por los que pueda proponerme obtener un solo penique; el más joven tiene nueve años, y mi mujer ya no es fecunda."], "caparros2": ["Eran tan primitivos que se creían astutos. Los pelos de la nariz les llegaban al coxis y aprendían a sonreírse satisfechos mientras hurgaban con sus deditos cortos uñas negras la calavera de aquel bisonte, buscando últimas carnes. Ninguno decía ug, porque era de salvajes: ahora estaba de moda el provechito suave, terminado en un chillido como de ratón boniato, que era el toque elegante.", "–Cruaaaa jiiiii.", "Y seguían escarbando. Una hembra de tetas cantimpalos manoteó un ojo y trató de escaparse hacia los yuyos. En segundos, tres machos musculosos chuecos se le echaron encima, le pegaron con ramas y con saña, le sacaron el ojo. La caza estaba difícil, y muchas veces se quedaban con hambre.", "En unos pocos milenios habían cambiado mucho. Los bichos escaseaban, así que habían tenido que inventar arcos, flechas, arpones, redes, trampas, y ya no había animal que se les resistiese. El problema era que, a fuerza de cazar y cazar, se había hecho muy difícil encontrar una presa, y había que embarcarse en expediciones interminables para dar con algún mamut desprevenido. La caza estaba en vías de extinción.", "–Cruaaaa jiiiiii.", "Dijo la hembra con un ojo menos, queriendo significar:", "–Ug, kriga bundolo, grande catastrófe ecológico ahora, oh sí, oh sí.", "A veces pasaban lunas y lunas sin encontrar presa, y comían raíces y semillas. Pero tampoco era seguro que las encontraran. Fue en esos días confusos cuando a alguien –o a muchos a la vez, quién sabe– se les ocurrió que algunos de esos frutos podían recogerse con cierta seguridad todos los veranos, y el grupo empezó a volver cada año a su trigal salvaje.", "–Craaac, bilicundia aj doj.", "Dijo la hipertataranieta de la tuerta, queriendo significar:", "–Oh, felices tiempos antes, cuando todos animales.", "La tribu comía y eructaba cada vez mejor, pero la cosecha silvestre raleaba de año en año, porque crecían las bocas. Alguien volvió a hablar de catástrofe ecológica. Otro descubrió, vaya a saber cómo, que esas semillas podían plantarse y al verano siguiente surgirían con renovados bríos.", "–Crc, mí constata que aquesto nunca ya serán como antes y la degradación seríamos eterna como la noche del escuerzo.", "Dijo una hipernietísima, que tenía la vocación lírica, y era cierto: a partir de entonces empezó la catástrofe. Para cultivar sus plantas y criar a sus nuevos animales domésticos, los hombres abandonaron la vida errante y empezaron a establecerse en poblados, florearon sus lenguajes, se hicieron unos dioses, supusieron linajes, descubrieron el vino con soda, improvisaron la filosofía, se largaron a andar a treinta por hora en sus caballos verdes y, después, inventaron las carpas en la playa, los masajes, los aviones a chorro, los microchips y los chips de pavita. Un desastre. Pero se podía haber evitado. Ningún científico duda de que nada de todo esto habría sucedido si los guarangos de nuestros ancestros no se hubiesen excedido en la caza del mamut y del oso hormiguero. Porque no habría sido necesario buscar otras fuentes de alimentos, y ahora seríamos felices, usaríamos pieles y garrotes, hablaríamos con los pajaritos, no sabríamos qué es el sida y pintaríamos quirquinchos en las paredes de la cueva.", "La ecología supone una idea de fin de la historia: hasta acá llegamos, la evolución se acaba acá. De ahora en más todo funcionará según otro modelo: el de la degradación, la decadencia –porque quisimos demasiado.", "Los ecologistas querrían retrotraer el mundo a esa soñada edad dorada; como saben que no pueden, tratan al menos de que ya nada cambie. Nostalgia del presente visto como pasado, el miedo ante el carácter eternamente fugitivo, odio del tiempo; los ejemplos rebosan. España, en el siglo XII, era un gran bosque: la frase clásica que dice que un mono podía atravesar la península de Gibraltar al Pirineo sin bajar de los árboles. España rebosaba de madera y la madera era la materia indispensable: con madera se hacían las casas, los carros, las ruedas, los arados, los muebles, las herramientas, las lanzas, los zapatos; con madera se calentaban las personas, se cocían las comidas, se trabajaban los metales escasos. Un mundo sin madera habría sido pensado, entonces, como la quintaesencia del desastre, un espacio invivible. Ante la posibilidad de su desaparición, los ecologistas habrían alertado contra “la destrucción de nuestro patrimonio forestal, que condenará a la muerte a las generaciones venideras”. El hombre es la gran amenaza para el medio ambiente: taló, utilizó, gastó esos árboles. En el siglo XII, España daba de vivir a cuatro millones de personas. Nueve siglos después, España era una llanura casi yerma desarbolada capaz de sostener –incomparablemente mejor- a diez veces más personas que vivían más del doble que en tiempos del gran bosque: otros materiales, otros combustibles, otras técnicas habían reemplazado con enorme ventaja a la madera.", "Pero la ecología suele suponer un mundo estático donde los mismos métodos requerirán siempre los mismos recursos naturales, y se aterra porque proyecta las carencias del futuro sobre las necesidades actuales: porque todo lo que imagina son apocalipsis.", "Es una de sus grandes ventajas: la ecología es la forma más prestigiosa del conservadurismo. La forma más actual, más activa, más juvenil, más poderosa del conservadurismo. O, sintetizado: el conservadurismo cool, el conservadurismo progre, el conservadurismo moderno. Es, en sentido estricto, un esfuerzo por conservar –los bosques, los ríos y montañas, los pájaros, las plantas, la pureza del aire– y eso, tras tantos años de suponer que lo bueno era el cambio, debe ser muy tranquilizador. Fantástico haber encontrado una forma de participación que no suponga riesgos, beneficie directamente a uno mismo y proponga la conservación de lo conocido. Fantástico poder sentir que uno está haciendo algo por el mundo, defendiendo al mundo de los malos, tratando de que sólo cambie lo necesario para que nada cambie. Fantástico que lleve incluso cierto tinte de insatisfacción con la forma en que el mundo funciona –capitalismo despiadado, grandes corporaciones–, tan ligero que puede ser compartido por los capitalistas despiadados, por las grandes corporaciones. Fantástico haber dado con una causa común, tan aparentemente noble, tan indiscutible –en el sentido estricto de la palabra indiscutible–, tan unificadora que pueda ser enarbolada por una joven nigeriana que cocina con leña o el presidente de los Estados Unidos o mi tía Púpele o la banca Morgan. Fantástico: y sirve, incluso, como materia para enseñarle a los chicos en la escuela –o como material de propaganda y, sobre todo, relaciones públicas.", "Yo, por mi parte, a mi modo de ver, en lo que a mí respecta, personalmente y sin ánimo de ofensa, creo que la enorme atención que gobernantes y empresarios de los países más ricos le están dando a la amenaza del cambio climático se relaciona, sobre todo, con ventajas políticas y económicas que pueden obtener de esos temores:", "–retrasar la industrialización de los nuevos países emergentes y, así, mantener su hegemonía unas décadas más;", "–cambiar el modelo energético global para modificar ciertas relaciones, y para conseguir que nuevas empresas se hagan fuertes en uno de los mayores mercados mundiales;", "Y creo, por fin, que su mayor ganancia es ideológica: convencernos de que lo mejor es lo que ya tenemos, lo que estamos siempre a punto de perder si no lo conservamos: que no hay nada tan peligroso como el cambio."], "podetti": ["Sr. Ernesto Fort (o como se llame, no soy de esos boludos que saben todo sobre los boludos de la tele), Esq:", "Le escribo por un problemita que tiene que ver con el rubro empresarial que le ha permitido llevar su extravagante modo de vida. Soy admirador como el que más de la empresa creada por su abuelo (o su padre, no soy de los que etc. etc.); por esto es que me siento dolido por cierto descuido que he observado en uno de sus más refinados productos.", "Para no dar vueltas y que no crea que soy una especie de loco, ¡ja, ja, ja!, se trata en este caso de la Gatúbela que viene en los chocolatines Jack. Desde ya que no me quejo de que el trajecito sea de la película esa de Halle Berry, -un producto cinematográfico menor- en lugar del clásico, o el de “Batman Vuelve” aunque más no sea. Tampoco está dentro de mis preocupaciones que el citado muñequito pueda aportar su granito de arena para la creación de una nueva generación de fetichistas del cuero; la mayoría de nosotros –criados a golpes de “Batman” y “Los Vengadores”- podemos desenvolvernos en sociedad prácticamente con normalidad.", "No, mi queja viene en cuanto al diseño anatómico del personaje. O sea, se cae (En la foto aparece parada, pero después de mucho esfuerzo y varios intentos. No pasa lo mismo con el Dr. Octopus, por ejemplo).", "El problema parece bastante fácil de identificar: es como que la parte de arriba tiene más peso que la de abajo. Yo entiendo que la intención fue buena. O sea, no me estoy quejando de las tetotas que tiene el muñequito. No tengo nada en contra de las tetotas. Me parece, lógico, hasta coherente que tenga tetotas y tampoco digo que tenga nada de desagradable. Aclaro esto porque no es que esté pidiendo que le rebajen las tetotas, que en sí además parecen bastante armoniosas y diría que hasta naturales. Pero habría que hacerle un contrapeso o algo. Para que no se caiga. Por ahí un culo más grande, no sé. Usted vea. No digo que sí o sí tenga que tener un culo más grande, ni tampoco es que esté escribiendo esta carta con el objetivo secreto de que le pongan un culo más grande, como si fuera una especie de degenerado o loco, nada que ver. Digo lo del culo como ejemplo, puede ser otra cosa, lo que a usted se le ocurra.", "Bueno, ud. vea qué hace, pero le recomiendo que deje de andar con las cosas esas de Tinelli por un rato y le preste atención al buen funcionamiento de su empresa, porque esto no le está haciendo nada bien al buen nombre de su abuelo o su padre (y aparte se me desemprolija la línea de muñequitos).", "Salúdolole atte.", "Podeti"], "arlt2": ["El señor Monner Sans, en una entrevista concedida a un repórter de El Mercurio, de Chile, nos alacranea de la siguiente forma:", "“En mi patria se nota una curiosa evolución. Allí, hoy nadie defiende a la Academia ni a su gramática. El idioma, en la Argentina, atraviesa por momentos críticos… La moda del ‘gauchesco’ pasó; pero ahora se cierne otra amenaza, está en formación el ‘lunfardo’, léxico de origen espurio, que se ha introducido en muchas capas sociales pero que sólo ha encontrado cultivadores en los barrios excéntricos de la capital argentina. Felizmente, se realiza una eficaz obra depuradora, en la que se hallan empeñados altos valores intelectuales argentinos”.", "¿Quiere usted dejarse de macanear? ¡Cómo son ustedes los gramáticos! Cuando yo he llegado al final de su reportaje, es decir, a esa frasecita: “Felizmente se realiza una obra depuradora en la que se hallan empeñados altos valores intelectuales argentinos”, me he echado a reír de buenísima gana, porque me acordé que a esos “valores” ni la familia los lee, tan aburridores son.", "¿Quiere que le diga otra cosa? Tenemos un escritor aquí -no recuerdo el nombre- que escribe en purísimo castellano y para decir que un señor se comió un sandwich, operación sencilla, agradable y nutritiva, tuvo que emplear todas estas palabras: “y llevó a su boca un emparedado de jamón”. No me haga reír, ¿quiere? Esos valores, a los que usted se refiere, insisto: no los lee ni la familia. Son señores de cuello palomita, voz gruesa, que esgrimen la gramática como un bastón, y su erudición como un escudo contra las bellezas que adornan la tierra. Señores que escriben libros de texto, que los alumnos se apresuran a olvidar en cuanto dejaron las aulas, en las que se les obliga a exprimirse los sesos estudiando la diferencia que hay entre un tiempo perfecto y otro pluscuamperfecto. Estos caballeros forman una colección pavorosa de “engrupidos” -¿me permite la palabreja?- que cuando se dejan retratar, para aparecer en un diario, tienen el buen cuidado de colocarse al lado de una pila de libros, para que se compruebe de visu que los libros que escribieron suman una altura mayor de la que miden sus cuerpos.", "Querido señor Monner Sans: La gramática se parece mucho al boxeo. Yo se lo explicaré:", "Cuando un señor sin condiciones estudia boxeo, lo único que hace es repetir los golpes que le enseña el profesor. Cuando otro señor estudia boxeo, y tiene condiciones y hace una pelea magnífica, los críticos del pugilismo exclaman: “¡Este hombre saca golpes de ‘todos los ángulos’!” Es decir, que, como es inteligente, se le escapa por una tangente a la escolástica gramatical del boxeo. De más está decir que éste que se escapa de la gramática del boxeo, con sus golpes de “todos los ángulos”, le rompe el alma al otro, y de allí que ya haga camino esa frase nuestra de “boxeo europeo o de salón”, es decir, un boxeo que sirve perfectamente para exhibiciones, pero para pelear no sirve absolutamente nada, al menos frente a nuestros muchachos antigramaticalmente boxeadores.", "Con los pueblos y el idioma, señor Monner Sans, ocurre lo mismo. Los pueblos bestias se perpetúan en su idioma, como que, no teniendo ideas nuevas que expresar, no necesitan palabras nuevas o giros extraños; pero, en cambio, los pueblos que, como el nuestro, están en una continua evolución, sacan palabras de todos los ángulos, palabras que indignan a los profesores, como lo indigna a un profesor de boxeo europeo el hecho inconcebible de que un muchacho que boxea mal le rompa el alma a un alumno suyo que, técnicamente, es un perfecto pugilista. Eso sí; a mí me parece lógico que ustedes protesten. Tienen derecho a ello, ya que nadie les lleva el apunte, ya que ustedes tienen el tan poco discernimiento pedagógico de no darse cuenta de que, en el país donde viven, no pueden obligarnos a decir o escribir: “llevó a su boca un emparedado de jamón”, en vez de decir: “se comió un sandwich”. Yo me jugaría la cabeza que usted, en su vida cotidiana, no dice: “llevó a su boca un emparedado de jamón”, sino que, como todos diría: “se comió un sandwich”. De más está decir que todos sabemos que un sandwich se come con la boca, a menos que el autor de la frase haya descubierto que también se come con las orejas.", "Un pueblo impone su arte, su industria, su comercio y su idioma por prepotencia. Nada más. Usted ve lo que pasa con Estados Unidos. Nos mandan sus artículos con leyendas en inglés, y muchos términos ingleses nos son familiares. En el Brasil, muchos términos argentinos (lunfardos) son populares. ¿Por qué? Por prepotencia. Por superioridad.", "Last Reason, Félix Lima, Fray Mocho y otros, han influido mucho más sobre nuestro idioma, que todos los macaneos filológicos y gramaticales de un señor Cejador y Frauca, Benot y toda la pandilla polvorienta y malhumorada de ratones de biblioteca, que lo único que hacen es revolver archivos y escribir memorias, que ni ustedes mismos, gramáticos insignes, se molestan en leer, porque tan aburridas son.", "Este fenómeno nos demuestra hasta la saciedad lo absurdo que es pretender enchalecar en una gramática canónica, las ideas siempre cambiantes y nuevas de los pueblos. Cuando un malandrín que le va a dar una puñalada en el pecho a un consocio, le dice: “te voy a dar un puntazo en la persiana”, es mucho más elocuente que si dijera: “voy a ubicar mi daga en su esternón”. Cuando un maleante exclama, al ver entrar a una pandilla de pesquisas: “¡los relojié de abanico!”, es mucho más gráfico que si dijera: “al socaire examiné a los corchetes”.", "Señor Monner Sans: Si le hiciéramos caso a la gramática, tendrían que haberla respetado nuestros tatarabuelos, y en progresión retrogresiva, llegaríamos a la conclusión que, de haber respetado al idioma aquellos antepasados, nosotros, hombres de la radio y la ametralladora, hablaríamos todavía el idioma de las cavernas. Su modesto servidor.", "Q. B. S. M."]};

/* ---------- puntos, racha, niveles ---------- */
const NIV=[[0,'Aprendiz'],[100,'Opinador'],[250,'Argumentador'],[450,'Polemista'],[700,'Orador'],[1000,'Retórico'],[1400,'Maestro de la persuasión']];
const nivel=()=>{let i=0;while(i+1<NIV.length&&S.xp>=NIV[i+1][0])i++;const lo=NIV[i][0],hi=NIV[i+1]?NIV[i+1][0]:lo;return{n:i+1,nom:NIV[i][1],pct:hi>lo?(S.xp-lo)/(hi-lo)*100:100,falta:hi>lo?hi-S.xp:0,sig:NIV[i+1]?.[1]}};
function meBar(){const L=nivel();$('#me').innerHTML=`<span class="pill" title="Racha de respuestas correctas seguidas">${FLAME}${S.racha}</span><span class="pill" title="${esc(L.nom)}">Nivel ${L.n}<span class="xpbar"><i style="width:${L.pct}%"></i></span><span>· ${S.xp} pts</span></span>`}
function rec(id,ok,host){
  const first=!(id in S.r);if(first)S.r[id]=ok?1:0;
  S.racha=ok?S.racha+1:0;S.rachaMax=Math.max(S.rachaMax,S.racha);
  if(ok&&first){S.xp+=10;if(S.racha>0&&S.racha%5===0)S.xp+=10;if(host)host.insertAdjacentHTML('beforeend',`<span class="xpf">+${S.racha%5===0?20:10}</span>`)}
  save();meBar();
}

/* ---------- motor de preguntas ---------- */
function quiz(el,items,cfg){
  let i=0,pts=0,wrong=[];const N=items.length;
  const show=()=>{
    if(i>=N)return end();
    const it=items[i],opts=cfg.opts(it);
    el.innerHTML=`<div class="qcard"><div class="qtop"><span class="cnt">${i+1}/${N}</span><div class="prog"><i style="width:${i/N*100}%"></i></div><span class="combo">${S.racha>=2?FLAME+S.racha:''}</span></div>
    ${it.src?`<span class="src">${esc(it.src)}</span>`:''}
    ${cfg.pre?cfg.pre(it):''}${cfg.q(it)}
    ${cfg.ask?`<p class="qask">${esc(cfg.ask)}</p>`:''}
    <div class="opts ${cfg.chips?'chips':''}">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.l)}</button>`).join('')}</div><div class="after"></div></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.k],ok=cfg.isOk(it,o.v);
      el.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(cfg.isOk(it,opts[k].v))x.classList.add('ok')});
      if(!ok)b.classList.add('bad');
      rec(it.id,ok,$('.qcard',el));if(ok)pts++;else wrong.push(it);
      const extra=cfg.extra?cfg.extra(it,o.v):'';
      $('.after',el).innerHTML=`<div class="fb ${ok?'':'bad'}"><span class="fi">${ok?CHECK:CROSS}</span><b>${ok?shuf(['¡Bien!','¡Exacto!','¡Eso!','¡Muy bien!'])[0]:'No es esa.'}</b><span>${extra}${esc(cfg.exp(it,o.v))}</span></div>
      <div class="row" style="margin-top:16px"><button class="btn nx">${i+1<N?'Siguiente':'Ver resultado'}</button></div>`;
      const nx=$('.nx',el);nx.onclick=()=>{i++;show();el.scrollIntoView({block:'nearest'})};nx.focus({preventScroll:true});
    });
  };
  const end=()=>{
    const pct=Math.round(pts/N*100),st=pct>=90?3:pct>=70?2:pct>=40?1:0;
    if(cfg.key){S.best[cfg.key]=Math.max(S.best[cfg.key]||0,pct);save()}
    el.innerHTML=`<div class="qcard result"><div class="stars">${[1,2,3].map(k=>STAR(k<=st)).join('')}</div><div class="score">${pts}/${N}</div>
    <p style="font-size:18px;font-weight:600">${pct>=90?'¡Impecable! Esto lo tenés dominado.':pct>=70?'Muy bien. Repasá las que fallaste.':pct>=40?'Vas bien, pero conviene repasar la teoría.':'Volvé a la ficha de teoría y probá otra vez.'}</p>
    ${cfg.key?`<p class="small">Tu mejor marca en esta actividad: ${S.best[cfg.key]} %</p>`:''}
    <div class="row" style="margin-top:14px"><button class="btn again">Otra ronda</button>${wrong.length?'<button class="btn sec rep">Repasar las que fallé</button>':''}</div></div>`;
    $('.again',el).onclick=()=>cfg.restart();
    const r=$('.rep',el);if(r)r.onclick=()=>quiz(el,wrong,Object.assign({},cfg,{key:null}));
  };
  show();
}

function inlineMC(el,it){
  el.innerHTML=`<div class="qcard"><p class="qask">${esc(it.q)}</p><div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><div class="after"></div></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k===it.ok;
    el.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===it.ok)x.classList.add('ok')});if(!ok)b.classList.add('bad');
    rec(it.id,ok,$('.qcard',el));$('.after',el).innerHTML=`<div class="fb ${ok?'':'bad'}"><span class="fi">${ok?CHECK:CROSS}</span><b>${ok?'¡Bien!':'No es esa.'}</b><span>${esc(it.exp)}</span></div>`});

/* Lectura */
let lecId=null,lecMode='leer',lecTool='Tesis';
const TOOLS=['Tesis',...Object.values(ARG_TIPOS),'Ironía','Otro'];
const ABR=/(?:^|[\s(])(?:Dr|Sr|Sra|Vd|Ud|ud|Esq|atte|Q|B|S|M)\.$/;
const splitS=t=>{const out=[],re=/[.!?…]+["”»’)]*\s+(?=[A-ZÁÉÍÓÚÑ¿¡“"«–—(])/g;let st=0,m;while((m=re.exec(t))){if(ABR.test(t.slice(st,m.index+1)))continue;const e=m.index+m[0].length;out.push(t.slice(st,e));st=e}if(st<t.length)out.push(t.slice(st));return out.length?out:[t]};
V.lectura=()=>{
  if(!lecId){
    M.innerHTML=`${head('lectura','Elegí un texto. Vas a poder marcar oraciones, armar la estructura, encontrar la tesis, responder las preguntas y comparar con la lectura del profe.')}

    M.querySelectorAll('.lcard').forEach(b=>b.onclick=()=>{lecId=b.dataset.id;lecMode='leer';V.lectura();scrollTo(0,0)});
    return;
  }
  const L=LECTURAS.find(l=>l.id===lecId),P=TEXTS[L.id];
  const mk=S.marcas[L.id]||(S.marcas[L.id]={}),es=S.est[L.id]||(S.est[L.id]={});
  const pf={};L.profe.forEach((a,n)=>{const ss=splitS(P[a.p]||'');let j=ss.findIndex(s=>s.includes(a.f));if(j<0)j=0;pf[a.p+'-'+j]=(pf[a.p+'-'+j]||[]).concat(n+1)});
  const para=(t,i)=>{
    if(t.startsWith('## '))return `<h5>${esc(t.slice(3))}</h5>`;
    if(t==='(...)')return `<p class="eli">(…)</p>`;
    const sel=lecMode==='estructura'&&L.est[i]?`<span class="estsel" data-p="${i}">${L.etiq.map(e=>`<button class="${es[i]===e?'on':''}" data-e="${esc(e)}">${esc(e)}</button>`).join('')}</span>`:'';
    return `<p data-i="${i}">${sel}${splitS(t).map((s,j)=>{const id=i+'-'+j,m=mk[id],p=lecMode==='profe'&&pf[id];
      return `<span class="s${p?' pf':''}" data-id="${id}"${m&&lecMode!=='estructura'?` data-m="${esc(m)}"`:''}>${p?p.map(n=>`<span class="pn">${n}</span>`).join(''):''}${esc(s)}</span>`}).join('')}</p>`;
  };
  M.innerHTML=`<button class="btn lnk back">← Todos los textos</button>
  <h2 style="margin-top:6px">${esc(L.titulo)}</h2><p class="lead" style="margin-bottom:4px"><b>${esc(L.autor)}</b></p><p class="small" style="margin-bottom:18px">${esc(L.fuente)} En el cuadernillo: ${esc(L.pag)}.</p>
  <div class="seg">${[['leer','Leer y marcar'],['estructura','Estructura'],['tesis','Tesis'],['profe','Lectura del profe'],['preguntas','Preguntas']].map(([k,l],n)=>`<button class="${lecMode===k?'on':''}" data-m="${k}"><i>${n+1}</i>${l}</button>`).join('')}</div>
  <div class="reader"><div class="texto ${lecMode==='leer'?'mk-on':''}">${L.intro&&!['tesis','preguntas'].includes(lecMode)?`<p class="small" style="font-family:var(--sans)">${esc(L.intro)}</p>`:''}${['tesis','preguntas'].includes(lecMode)?'':P.map(para).join('')}<div id="lx"></div></div>
  <aside class="side" id="side"></aside></div>`;
  $('.back').onclick=()=>{lecId=null;V.lectura();scrollTo(0,0)};
  M.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{lecMode=b.dataset.m;V.lectura()});
  const side=$('#side'),lx=$('#lx');
  if(lecMode==='leer'){
    side.classList.add('mkside');
    side.innerHTML=`<div class="panel"><h3>¿Qué querés marcar?</h3><div class="pal">${TOOLS.map(t=>`<button class="${t===lecTool?'on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>

function confirmIn(btn,msg,yes){const s=document.createElement('span');s.className='confirm';s.innerHTML=`<span class="small">${esc(msg)}</span><button class="btn">Sí</button><button class="btn sec">No</button>`;btn.replaceWith(s);
  const [y,n]=s.querySelectorAll('button');y.onclick=yes;n.onclick=()=>s.replaceWith(btn)}
function copy(txt,msgEl){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{if(msgEl)msgEl.textContent=' ¡Copiado!'}).catch(()=>{if(msgEl)msgEl.textContent=' No se pudo copiar: seleccioná el texto a mano.'})}

/* Taller */
let talId=null;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function analiza(txt){
  const n=norm(txt),words=(txt.match(/\S+/g)||[]).length;
  const con=CONN_DETECT.filter(c=>new RegExp('(^|[^a-zñ])'+norm(c)+'([^a-zñ]|$)').test(n));
  return {words,con,preg:(txt.match(/¿[^?]+\?/g)||[]).length,conc:/(si bien|aunque|es cierto que|es verdad que|a pesar de)/.test(n),refu:/(no es cierto|es falso|no es verdad|no es asi)/.test(n),
    cita:/(segun|como dice|como afirma|de acuerdo con|«|")/.test(n),dato:/\d/.test(n),ej:/(por ejemplo|tal es el caso|como ocurre)/.test(n),ana:/(es como|se parece a|igual que)/.test(n)};
}
V.taller=()=>{
  if(!talId){
    M.innerHTML=`${head('taller','Elegí qué querés escribir. Cada plantilla te guía paso a paso y, mientras escribís, te muestra qué recursos estás usando. Lo que escribas se guarda en este dispositivo.')}
    <div class="lgrid">${TALLER.map(t=>{const has=Object.values(S.taller[t.id]||{}).some(v=>v&&v.trim());return `<button class="lcard" data-id="${t.id}"><span class="tag">${has?'Empezado':'Nuevo'}</span><b>${esc(t.titulo)}</b><em>${esc(t.bajada)}</em></button>`}).join('')}</div>`;
    M.querySelectorAll('.lcard').forEach(b=>b.onclick=()=>{talId=b.dataset.id;V.taller();scrollTo(0,0)});return;
  }
  const T=TALLER.find(t=>t.id===talId),D=S.taller[T.id]||(S.taller[T.id]={}),C=S.checks[T.id]||(S.checks[T.id]={});
  M.innerHTML=`<button class="btn lnk back">← Todas las plantillas</button><h2 style="margin-top:6px">${esc(T.titulo)}</h2><p class="lead">${esc(T.bajada)}</p>
  ${T.temas?`<p class="small" style="margin:0;font-weight:700">Ideas para arrancar (tocá una):</p><div class="temas">${T.temas.map(x=>`<button>${esc(x)}</button>`).join('')}</div>`:''}
  <div class="tgrid"><div>${T.pasos.map((p,n)=>`<div class="paso"><label for="f-${p.k}"><i>${n+1}</i>${esc(p.l)}</label>${p.a?`<p>${esc(p.a)}</p>`:''}<textarea id="f-${p.k}" data-k="${p.k}" rows="${p.r}" placeholder="${esc(p.ph)}">${esc(D[p.k]||'')}</textarea></div>`).join('')}
  <div class="panel check"><h3>Antes de entregar, revisá</h3>${T.check.map((c,i)=>`<label><input type="checkbox" data-i="${i}" ${C[i]?'checked':''}> ${esc(c)}</label>`).join('')}</div></div>
  <div class="sticky2"><div class="panel"><h3>Devolución automática</h3><div id="an"></div></div><h3 style="margin:20px 0 12px">Tu texto</h3><div class="hoja" id="hoja"></div>
  <div class="row" style="margin-top:18px"><button class="btn cp">Copiar el texto</button><span class="small cpm"></span><button class="btn lnk del">Borrar todo</button></div></div></div>`;
  $('.back').onclick=()=>{talId=null;V.taller();scrollTo(0,0)};
  M.querySelectorAll('.temas button').forEach(b=>b.onclick=()=>{const tx=b.textContent;
    if(T.id==='opinion'){D._tema=tx;$('.lead').textContent='Tema elegido: '+tx}
    else{const k=T.pasos[0].k,f=$('#f-'+k);if(!f.value.trim()){f.value=T.id==='swift'?'Una modesta proposición para '+tx.charAt(0).toLowerCase()+tx.slice(1):tx;D[k]=f.value}else f.focus()}
    save();upd()});
  const assemble=()=>{const tit=T.pasos.find(p=>p.k==='titulo'||p.k==='eslogan');const h=tit&&!T.orden.includes(tit.k)&&D[tit.k]?D[tit.k].trim():'';
    return {h,body:T.orden.map(k=>(D[k]||'').trim()).filter(Boolean).join('\n\n')}};
  const upd=()=>{const {h,body}=assemble();$('#hoja').innerHTML=(h?`<h3>${esc(h)}</h3>`:'')+(body?esc(body):'<span class="vacio">Acá va a ir apareciendo tu texto a medida que completes los pasos.</span>');
    const a=analiza(body),tips=[];
    if(a.words<80&&a.words>0)tips.push('Todavía es corto: desarrollá más los argumentos.');
    if(['opinion','carta','swift'].includes(T.id)){if(!a.conc&&!a.refu)tips.push('Probá agregar una concesión («si bien…», «es cierto que…, pero…») o una refutación.');
      if(a.con.length<3)tips.push('Usá más conectores para ordenar y relacionar las ideas.');
      if([a.preg,a.cita,a.dato,a.ej,a.ana,a.conc,a.refu].filter(Boolean).length<3&&a.words>40)tips.push('Variá los tipos de argumentos: ¿un dato, una analogía, una pregunta retórica?')}
    $('#an').innerHTML=`<p class="small" style="margin:0 0 6px"><b>${a.words}</b> palabras</p>
    <div class="chipsF">${[['Pregunta retórica',a.preg],['Concesión',a.conc],['Refutación',a.refu],['Cita o voz ajena',a.cita],['Datos o cifras',a.dato],['Ejemplo',a.ej],['Analogía',a.ana]].map(([l,v])=>`<span class="${v?'c':''}">${v?'✓':'○'} ${l}</span>`).join('')}</div>
    <p class="small" style="margin:8px 0 4px"><b>Conectores que usaste (${a.con.length}):</b> ${a.con.length?esc(a.con.join(', ')):'ninguno todavía'}</p>
    ${tips.length?`<ul class="small" style="margin:6px 0 0;padding-left:18px">${tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:(a.words>80?'<p class="small" style="margin:6px 0 0">Bien variado. Releelo en voz alta antes de entregarlo.</p>':'')}
    <p class="small" style="margin:8px 0 0">La detección es automática y aproximada: es una ayuda, no una nota.</p>`};
  M.querySelectorAll('.paso textarea').forEach(t=>t.oninput=()=>{D[t.dataset.k]=t.value;save();upd()});
  M.querySelectorAll('.check input').forEach(c=>c.onchange=()=>{C[c.dataset.i]=c.checked;save()});
  $('.cp').onclick=()=>{const {h,body}=assemble();copy((h?h+'\n\n':'')+body,$('.cpm'))};
  const del=$('.del');del.onclick=()=>confirmIn(del,'¿Borrar todo lo escrito?',()=>{S.taller[T.id]={};S.checks[T.id]={};save();V.taller()});
  if(T.id==='opinion'&&D._tema)$('.lead').textContent='Tema elegido: '+D._tema;
  upd();
};

V.desafio=()=>{
  M.innerHTML=`${head('desafio','Quince preguntas al azar de todos los módulos. Tu mejor marca se guarda.')}<div id="q"></div>`;
  const pool=[...shuf(ARGS).slice(0,4).map(a=>({k:'arg',it:a})),...shuf(FALACIAS).slice(0,4).map(a=>({k:'fal',it:a})),...shuf(CONECTORES).slice(0,2).map(a=>({k:'con',it:a})),
    ...shuf(GENEROS).slice(0,2).map(a=>({k:'gen',it:a})),...shuf(TEORIA).slice(0,2).map(t=>({k:'teo',it:Object.assign({id:t.id},t.prueba)})),...shuf(POL_PREG).slice(0,1).map(a=>({k:'teo',it:a}))];
  const items=shuf(pool).map(p=>Object.assign({},p.it,{_k:p.k}));
  const optsFor=it=>{
    if(it._k==='arg'){const o=shuf(Object.keys(ARG_TIPOS).filter(k=>!it.ok.includes(k))).slice(0,3);return shuf([it.ok[0],...o]).map(v=>({v,l:ARG_TIPOS[v]}))}
    if(it._k==='fal'){const o=shuf(Object.keys(FAL_TIPOS).filter(k=>!it.ok.includes(k))).slice(0,3);return shuf([it.ok[0],...o]).map(v=>({v,l:FAL_TIPOS[v]}))}
    if(it._k==='gen'){const o=shuf(GENEROS_OPC.filter(k=>k!==it.ok)).slice(0,3);return shuf([it.ok,...o]).map(v=>({v,l:v}))}
    return shuf(it.opts.map((l,k)=>({l,v:k})))};
  const cache=new Map();
  quiz($('#q'),items,{key:'desafio',
    q:it=>it._k==='teo'?`<p class="qask">${esc(it.q)}</p>`:it._k==='con'?`<p class="qask">¿Qué conector completa la oración?</p><p class="qtext">${esc(it.t).replace('___','<b style="display:inline-block;border-bottom:3px solid var(--c);width:5em"> </b>')}</p>`:`<p class="qask">${it._k==='arg'?'¿Qué tipo de argumento es?':it._k==='fal'?'¿Qué problema tiene este argumento?':'¿Qué tipo de texto es?'}</p><p class="qtext">«${esc(it.t)}»</p>`,
    opts:it=>{if(!cache.has(it))cache.set(it,optsFor(it));return cache.get(it)},
    isOk:(it,v)=>it._k==='arg'||it._k==='fal'?it.ok.includes(v):v===it.ok,exp:it=>it.exp,restart:V.desafio});
};

  <h3 style="margin-top:30px">Mejores marcas</h3>${bests.length?`<div class="stats">${bests.map(([k,l])=>`<div class="simple"><span>${esc(l)}</span><b>${S.best[k]} %</b></div>`).join('')}</div>`:'<p class="empty">Todavía no completaste ninguna ronda.</p>'}
  <h3 style="margin-top:30px">Estructura de los textos</h3><div class="stats">${LECTURAS.filter(l=>S.best['est-'+l.id]!=null).map(l=>`<div class="simple"><span>${esc(l.titulo)}</span><b>${S.best['est-'+l.id]} %</b></div>`).join('')||'<p class="empty">Todavía no corregiste ninguna estructura.</p>'}</div>
  <div class="row" style="margin-top:30px"><button class="btn cp">Copiar resumen para el profe</button><span class="small cpm"></span><button class="btn lnk rst">Reiniciar todo mi progreso</button></div>`;
  $('.cp').onclick=()=>copy(`Argumentar — ${S.nombre||'(sin nombre)'}\nNivel ${L.n} (${L.nom}) · ${S.xp} puntos · mejor racha ${S.rachaMax}\n`+rows.map(r=>`${r.m.n}: ${r.a}/${r.t} respondidas, ${r.c} bien`).join('\n')+'\n'+bests.map(([k,l])=>`${l}: ${S.best[k]} %`).join('\n'),$('.cpm'));
  const r=$('.rst');r.onclick=()=>confirmIn(r,'Se borran puntos, marcas y textos. ¿Seguro?',()=>{const n=S.nombre;S=blank();S.nombre=n;save();meBar();V.progreso()});
};

/* instalación */
let deferred=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function showInst(){const el=$('#inst');if(!el)return;
  if(standalone()){el.innerHTML='';return}
  if(deferred){el.innerHTML='<button class="btn sec ins">Instalar la app</button><span class="small">Queda en tu pantalla de inicio y funciona sin conexión.</span>';
    $('.ins',el).onclick=async()=>{deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;showInst()};return}
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){el.innerHTML='<span class="small"><b>Para instalarla en iPhone:</b> tocá el botón Compartir de Safari y después «Agregar a inicio».</span>';return}
  el.innerHTML='';}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;showInst()});
addEventListener('appinstalled',()=>{deferred=null;showInst()});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}

/* router */
const rail=document.getElementById('rail');
rail.innerHTML=[MOD.inicio,...MODS].map(m=>`<a href="#${m.h}" data-h="${m.h}" style="--mc:${m.c}"><i></i>${m.n}</a>`).join('');
const tint=(hex,a)=>`color-mix(in srgb, ${hex} ${a}%, var(--paper))`;
function route(){
  const h=(location.hash||'#inicio').slice(1);const v=V[h]?h:'inicio',m=MOD[v],R=document.documentElement.style;
  R.setProperty('--c',m.c);document.querySelector('meta[name=theme-color]')?.setAttribute('content',m.c);R.setProperty('--c2',m.c2);R.setProperty('--ct',tint(m.c,12));
  rail.querySelectorAll('a').forEach(a=>{const on=a.dataset.h===v;a.classList.toggle('on',on);if(on)a.scrollIntoView({block:'nearest',inline:'nearest'})});
  meBar();V[v]();window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
}
</script></body></html>
