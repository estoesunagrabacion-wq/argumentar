o son obvias y muchas, así como de la mayor importancia.", "En primer lugar, los más pobres arrendatarios poseerán algo de valor que la ley podrá hacer embargable y que les ayudará a pagar su renta al terrateniente, habiendo sido confiscados ya su ganado y cereales, y siendo el dinero algo desconocido para ellos.", "Segundo, puesto que la manutención de cien mil niños, de dos años para arriba, no se puede calcular en menos de diez chelines anuales por cada uno, el tesoro nacional se verá incrementado en cincuenta mil libras por año, sin contar el provecho del nuevo plato introducido en las mesas de todos los caballeros de fortuna del reino que tengan algún refinamiento en el gusto. Y el dinero circulará sólo entre nosotros, ya que los bienes serán enteramente producidos y manufacturados por nosotros.", "Tercero, las reproductoras constantes, además de ganar ocho chelines anuales por la venta de sus niños, se quitarán de encima la obligación de mantenerlos después del primer año.", "Cuarta, este manjar atraerá una gran clientela a las tabernas, donde los venteros serán seguramente tan prudentes como para procurarse las mejores recetas para prepararlo a la perfección, y consecuentemente ver sus casas frecuentadas por todos los distinguidos caballeros, quienes se precian con justicia de su conocimiento del buen comer: y un diestro cocinero, que sepa cómo agradar a sus huéspedes, se las ingeniará para hacerlo tan caro como a ellos les plazca.", "Quinto: esto constituirá un gran estímulo para el matrimonio, que todas las naciones sabias han alentado mediante recompensas o impuesto mediante leyes y penalidades. Aumentaría el cuidado y la ternura de las madres hacia sus hijos, al estar seguras de que los pobres niños tendrían una colocación de por vida, provista de algún modo por el público, y que les daría una ganancia anual en vez de gastos. Pronto veríamos una honesta emulación entre las mujeres casadas para mostrar cuál de ellas lleva al mercado al niño más gordo. Los hombres atenderían a sus esposas durante el embarazo tanto como atienden ahora a sus yeguas, sus vacas o sus puercas cuando están por parir; y no las amenazarían con golpearlas o patearlas (práctica tan frecuente) por temor a un aborto.", "Muchas otras ventajas podrían enumerarse. Por ejemplo, la adición de algunos miles de reses a nuestra exportación de carne en barricas, la difusión de la carne de puerco y el progreso en el arte de hacer buen tocino, del que tanto carecemos ahora a causa de la gran destrucción de cerdos, demasiado frecuentes en nuestras mesas; que no pueden compararse en gusto o magnificencia con un niño de un año, gordo y bien desarrollado, que hará un papel considerable en el banquete de un Alcalde o en cualquier otro convite público. Pero, siendo adicto a la brevedad, omito esta y muchas otras ventajas.", "Suponiendo que mil familias de esta ciudad serían compradoras habituales de carne de niño, además de otras que la comerían en celebraciones, especialmente casamientos y bautismos: calculo que en Dublín se colocarían anualmente cerca de veinte mil cuerpos, y en el resto del reino (donde probablemente se venderán algo más barato) las restantes ochenta mil.", "No se me ocurre ningún reparo que pueda oponerse razonablemente contra esta proposición, a menos que se aduzca que la población del Reino se vería muy disminuida. Esto lo reconozco francamente, y fue de hecho mi principal motivo para ofrecerla al mundo. Deseo que el lector observe que he calculado mi remedio para este único y particular Reino de Irlanda, y no para cualquier otro que haya existido, exista o pueda existir sobre la tierra. Por consiguiente, que ningún hombre me hable de otros expedientes: de crear impuestos para nuestros desocupados a cinco chelines por libra; de no usar ropas ni mobiliario que no sean producidos por nosotros; de rechazar completamente los materiales e instrumentos que fomenten el lujo exótico; de curar el derroche de engreimiento, vanidad, holgazanería y juego en nuestras mujeres; de introducir una vena de parsimonia, prudencia y templanza; de aprender a amar a nuestro país, en lo cual nos diferenciamos hasta de los lapones y los habitantes de Tupinambú; de abandonar nuestras animosidades y facciones; de cuidarnos un poco de no vender nuestro país y nuestra conciencia por nada; de enseñar a los terratenientes a tener aunque sea un punto de compasión de sus arrendatarios. De imponer, en fin, un espíritu de honestidad, industria y cuidado en nuestros comerciantes, quienes, si hoy tomáramos la decisión de no comprar otras mercancías que las nacionales, inmediatamente se unirían para trampearnos en el precio, la medida y la calidad, y a quienes por mucho que se insistiera no se les podría arrancar una sola oferta de comercio honrado.", "Por consiguiente, repito, que ningún hombre me hable de esos y parecidos expedientes, hasta que no tenga por lo menos un atisbo de esperanza de que se hará alguna vez un intento sano y sincero de ponerlos en práctica. Pero en lo que a mí concierne, habiéndome fatigado durante muchos años ofreciendo ideas vanas, ociosas y visionarias, y al final completamente sin esperanza de éxito, di afortunadamente con este proyecto, que por ser totalmente novedoso tiene algo de sólido y real, trae además poco gasto y pocos problemas, está completamente a nuestro alcance, y no nos pone en peligro de desagradar a Inglaterra.(...)", "Después de todo, no me siento tan violentamente ligado a mi propia opinión como para rechazar cualquier plan propuesto por hombres sabios que fuera hallado igualmente inocente, barato, cómodo y eficaz. Pero antes de que alguna cosa de ese tipo sea propuesta en contradicción con mi plan, deseo que el autor o los autores consideren seriamente dos puntos. Primero, tal como están las cosas, cómo se las arreglarán para encontrar ropas y alimentos para cien mil bocas y espaldas inútiles. Y segundo, ya que hay en este reino alrededor de un millón de criaturas de forma humana cuyos gastos de subsistencia reunidos las dejaría debiendo dos millones de libras esterlinas, añadiendo los que son mendigos profesionales al grueso de campesinos, cabañeros y peones, con sus esposas e hijos, que son mendigos de hecho: yo deseo que esos políticos que no gusten de mi propuesta y sean tan atrevidos como para intentar una contestación, pregunten primero a lo padres de esos mortales si hoy no creen que habría sido una gran felicidad para ellos haber sido vendidos como alimento al año de edad de la manera que yo recomiendo, y de ese modo haberse evitado un escenario perpetuo de infortunios como el que han atravesado desde entonces por la opresión de los terratenientes, la imposibilidad de pagar la renta sin dinero, la falta de sustento y de casa y vestido para protegerse de las inclemencias del tiempo, y la más inevitable expectativa de legar parecidas o mayores miserias a sus descendientes para siempre.", "Declaro, con toda la sinceridad de mi corazón, que no tengo el menor interés personal en esforzarme por promover esta obra necesaria, y que no me impulsa otro motivo que el bien público de mi patria, desarrollando nuestro comercio, cuidando de los niños, aliviando al pobre y dando algún placer al rico. No tengo hijos por los que pueda proponerme obtener un solo penique; el más joven tiene nueve años, y mi mujer ya no es fecunda."], "caparros2": ["Eran tan primitivos que se creían astutos. Los pelos de la nariz les llegaban al coxis y aprendían a sonreírse satisfechos mientras hurgaban con sus deditos cortos uñas negras la calavera de aquel bisonte, buscando últimas carnes. Ninguno decía ug, porque era de salvajes: ahora estaba de moda el provechito suave, terminado en un chillido como de ratón boniato, que era el toque elegante.", "–Cruaaaa jiiiii.", "Y seguían escarbando. Una hembra de tetas cantimpalos manoteó un ojo y trató de escaparse hacia los yuyos. En segundos, tres machos musculosos chuecos se le echaron encima, le pegaron con ramas y con saña, le sacaron el ojo. La caza estaba difícil, y muchas veces se quedaban con hambre.", "En unos pocos milenios habían cambiado mucho. Los bichos escaseaban, así que habían tenido que inventar arcos, flechas, arpones, redes, trampas, y ya no había animal que se les resistiese. El problema era que, a fuerza de cazar y cazar, se había hecho muy difícil encontrar una presa, y había que embarcarse en expediciones interminables para dar con algún mamut desprevenido. La caza estaba en vías de extinción.", "–Cruaaaa jiiiiii.", "Dijo la hembra con un ojo menos, queriendo significar:", "–Ug, kriga bundolo, grande catastrófe ecológico ahora, oh sí, oh sí.", "A veces pasaban lunas y lunas sin encontrar presa, y comían raíces y semillas. Pero tampoco era seguro que las encontraran. Fue en esos días confusos cuando a alguien –o a muchos a la vez, quién sabe– se les ocurrió que algunos de esos frutos podían recogerse con cierta seguridad todos los veranos, y el grupo empezó a volver cada año a su trigal salvaje.", "–Craaac, bilicundia aj doj.", "Dijo la hipertataranieta de la tuerta, queriendo significar:", "–Oh, felices tiempos antes, cuando todos animales.", "La tribu comía y eructaba cada vez mejor, pero la cosecha silvestre raleaba de año en año, porque crecían las bocas. Alguien volvió a hablar de catástrofe ecológica. Otro descubrió, vaya a saber cómo, que esas semillas podían plantarse y al verano siguiente surgirían con renovados bríos.", "–Crc, mí constata que aquesto nunca ya serán como antes y la degradación seríamos eterna como la noche del escuerzo.", "Dijo una hipernietísima, que tenía la vocación lírica, y era cierto: a partir de entonces empezó la catástrofe. Para cultivar sus plantas y criar a sus nuevos animales domésticos, los hombres abandonaron la vida errante y empezaron a establecerse en poblados, florearon sus lenguajes, se hicieron unos dioses, supusieron linajes, descubrieron el vino con soda, improvisaron la filosofía, se largaron a andar a treinta por hora en sus caballos verdes y, después, inventaron las carpas en la playa, los masajes, los aviones a chorro, los microchips y los chips de pavita. Un desastre. Pero se podía haber evitado. Ningún científico duda de que nada de todo esto habría sucedido si los guarangos de nuestros ancestros no se hubiesen excedido en la caza del mamut y del oso hormiguero. Porque no habría sido necesario buscar otras fuentes de alimentos, y ahora seríamos felices, usaríamos pieles y garrotes, hablaríamos con los pajaritos, no sabríamos qué es el sida y pintaríamos quirquinchos en las paredes de la cueva.", "La ecología supone una idea de fin de la historia: hasta acá llegamos, la evolución se acaba acá. De ahora en más todo funcionará según otro modelo: el de la degradación, la decadencia –porque quisimos demasiado.", "Los ecologistas querrían retrotraer el mundo a esa soñada edad dorada; como saben que no pueden, tratan al menos de que ya nada cambie. Nostalgia del presente visto como pasado, el miedo ante el carácter eternamente fugitivo, odio del tiempo; los ejemplos rebosan. España, en el siglo XII, era un gran bosque: la frase clásica que dice que un mono podía atravesar la península de Gibraltar al Pirineo sin bajar de los árboles. España rebosaba de madera y la madera era la materia indispensable: con madera se hacían las casas, los carros, las ruedas, los arados, los muebles, las herramientas, las lanzas, los zapatos; con madera se calentaban las personas, se cocían las comidas, se trabajaban los metales escasos. Un mundo sin madera habría sido pensado, entonces, como la quintaesencia del desastre, un espacio invivible. Ante la posibilidad de su desaparición, los ecologistas habrían alertado contra “la destrucción de nuestro patrimonio forestal, que condenará a la muerte a las generaciones venideras”. El hombre es la gran amenaza para el medio ambiente: taló, utilizó, gastó esos árboles. En el siglo XII, España daba de vivir a cuatro millones de personas. Nueve siglos después, España era una llanura casi yerma desarbolada capaz de sostener –incomparablemente mejor- a diez veces más personas que vivían más del doble que en tiempos del gran bosque: otros materiales, otros combustibles, otras técnicas habían reemplazado con enorme ventaja a la madera.", "Pero la ecología suele suponer un mundo estático donde los mismos métodos requerirán siempre los mismos recursos naturales, y se aterra porque proyecta las carencias del futuro sobre las necesidades actuales: porque todo lo que imagina son apocalipsis.", "Es una de sus grandes ventajas: la ecología es la forma más prestigiosa del conservadurismo. La forma más actual, más activa, más juvenil, más poderosa del conservadurismo. O, sintetizado: el conservadurismo cool, el conservadurismo progre, el conservadurismo moderno. Es, en sentido estricto, un esfuerzo por conservar –los bosques, los ríos y montañas, los pájaros, las plantas, la pureza del aire– y eso, tras tantos años de suponer que lo bueno era el cambio, debe ser muy tranquilizador. Fantástico haber encontrado una forma de participación que no suponga riesgos, beneficie directamente a uno mismo y proponga la conservación de lo conocido. Fantástico poder sentir que uno está haciendo algo por el mundo, defendiendo al mundo de los malos, tratando de que sólo cambie lo necesario para que nada cambie. Fantástico que lleve incluso cierto tinte de insatisfacción con la forma en que el mundo funciona –capitalismo despiadado, grandes corporaciones–, tan ligero que puede ser compartido por los capitalistas despiadados, por las grandes corporaciones. Fantástico haber dado con una causa común, tan aparentemente noble, tan indiscutible –en el sentido estricto de la palabra indiscutible–, tan unificadora que pueda ser enarbolada por una joven nigeriana que cocina con leña o el presidente de los Estados Unidos o mi tía Púpele o la banca Morgan. Fantástico: y sirve, incluso, como materia para enseñarle a los chicos en la escuela –o como material de propaganda y, sobre todo, relaciones públicas.", "Yo, por mi parte, a mi modo de ver, en lo que a mí respecta, personalmente y sin ánimo de ofensa, creo que la enorme atención que gobernantes y empresarios de los países más ricos le están dando a la amenaza del cambio climático se relaciona, sobre todo, con ventajas políticas y económicas que pueden obtener de esos temores:", "–retrasar la industrialización de los nuevos países emergentes y, así, mantener su hegemonía unas décadas más;", "–cambiar el modelo energético global para modificar ciertas relaciones, y para conseguir que nuevas empresas se hagan fuertes en uno de los mayores mercados mundiales;", "Y creo, por fin, que su mayor ganancia es ideológica: convencernos de que lo mejor es lo que ya tenemos, lo que estamos siempre a punto de perder si no lo conservamos: que no hay nada tan peligroso como el cambio."], "podetti": ["Sr. Ernesto Fort (o como se llame, no soy de esos boludos que saben todo sobre los boludos de la tele), Esq:", "Le escribo por un problemita que tiene que ver con el rubro empresarial que le ha permitido llevar su extravagante modo de vida. Soy admirador como el que más de la empresa creada por su abuelo (o su padre, no soy de los que etc. etc.); por esto es que me siento dolido por cierto descuido que he observado en uno de sus más refinados productos.", "Para no dar vueltas y que no crea que soy una especie de loco, ¡ja, ja, ja!, se trata en este caso de la Gatúbela que viene en los chocolatines Jack. Desde ya que no me quejo de que el trajecito sea de la película esa de Halle Berry, -un producto cinematográfico menor- en lugar del clásico, o el de “Batman Vuelve” aunque más no sea. Tampoco está dentro de mis preocupaciones que el citado muñequito pueda aportar su granito de arena para la creación de una nueva generación de fetichistas del cuero; la mayoría de nosotros –criados a golpes de “Batman” y “Los Vengadores”- podemos desenvolvernos en sociedad prácticamente con normalidad.", "No, mi queja viene en cuanto al diseño anatómico del personaje. O sea, se cae (En la foto aparece parada, pero después de mucho esfuerzo y varios intentos. No pasa lo mismo con el Dr. Octopus, por ejemplo).", "El problema parece bastante fácil de identificar: es como que la parte de arriba tiene más peso que la de abajo. Yo entiendo que la intención fue buena. O sea, no me estoy quejando de las tetotas que tiene el muñequito. No tengo nada en contra de las tetotas. Me parece, lógico, hasta coherente que tenga tetotas y tampoco digo que tenga nada de desagradable. Aclaro esto porque no es que esté pidiendo que le rebajen las tetotas, que en sí además parecen bastante armoniosas y diría que hasta naturales. Pero habría que hacerle un contrapeso o algo. Para que no se caiga. Por ahí un culo más grande, no sé. Usted vea. No digo que sí o sí tenga que tener un culo más grande, ni tampoco es que esté escribiendo esta carta con el objetivo secreto de que le pongan un culo más grande, como si fuera una especie de degenerado o loco, nada que ver. Digo lo del culo como ejemplo, puede ser otra cosa, lo que a usted se le ocurra.", "Bueno, ud. vea qué hace, pero le recomiendo que deje de andar con las cosas esas de Tinelli por un rato y le preste atención al buen funcionamiento de su empresa, porque esto no le está haciendo nada bien al buen nombre de su abuelo o su padre (y aparte se me desemprolija la línea de muñequitos).", "Salúdolole atte.", "Podeti"], "arlt2": ["El señor Monner Sans, en una entrevista concedida a un repórter de El Mercurio, de Chile, nos alacranea de la siguiente forma:", "“En mi patria se nota una curiosa evolución. Allí, hoy nadie defiende a la Academia ni a su gramática. El idioma, en la Argentina, atraviesa por momentos críticos… La moda del ‘gauchesco’ pasó; pero ahora se cierne otra amenaza, está en formación el ‘lunfardo’, léxico de origen espurio, que se ha introducido en muchas capas sociales pero que sólo ha encontrado cultivadores en los barrios excéntricos de la capital argentina. Felizmente, se realiza una eficaz obra depuradora, en la que se hallan empeñados altos valores intelectuales argentinos”.", "¿Quiere usted dejarse de macanear? ¡Cómo son ustedes los gramáticos! Cuando yo he llegado al final de su reportaje, es decir, a esa frasecita: “Felizmente se realiza una obra depuradora en la que se hallan empeñados altos valores intelectuales argentinos”, me he echado a reír de buenísima gana, porque me acordé que a esos “valores” ni la familia los lee, tan aburridores son.", "¿Quiere que le diga otra cosa? Tenemos un escritor aquí -no recuerdo el nombre- que escribe en purísimo castellano y para decir que un señor se comió un sandwich, operación sencilla, agradable y nutritiva, tuvo que emplear todas estas palabras: “y llevó a su boca un emparedado de jamón”. No me haga reír, ¿quiere? Esos valores, a los que usted se refiere, insisto: no los lee ni la familia. Son señores de cuello palomita, voz gruesa, que esgrimen la gramática como un bastón, y su erudición como un escudo contra las bellezas que adornan la tierra. Señores que escriben libros de texto, que los alumnos se apresuran a olvidar en cuanto dejaron las aulas, en las que se les obliga a exprimirse los sesos estudiando la diferencia que hay entre un tiempo perfecto y otro pluscuamperfecto. Estos caballeros forman una colección pavorosa de “engrupidos” -¿me permite la palabreja?- que cuando se dejan retratar, para aparecer en un diario, tienen el buen cuidado de colocarse al lado de una pila de libros, para que se compruebe de visu que los libros que escribieron suman una altura mayor de la que miden sus cuerpos.", "Querido señor Monner Sans: La gramática se parece mucho al boxeo. Yo se lo explicaré:", "Cuando un señor sin condiciones estudia boxeo, lo único que hace es repetir los golpes que le enseña el profesor. Cuando otro señor estudia boxeo, y tiene condiciones y hace una pelea magnífica, los críticos del pugilismo exclaman: “¡Este hombre saca golpes de ‘todos los ángulos’!” Es decir, que, como es inteligente, se le escapa por una tangente a la escolástica gramatical del boxeo. De más está decir que éste que se escapa de la gramática del boxeo, con sus golpes de “todos los ángulos”, le rompe el alma al otro, y de allí que ya haga camino esa frase nuestra de “boxeo europeo o de salón”, es decir, un boxeo que sirve perfectamente para exhibiciones, pero para pelear no sirve absolutamente nada, al menos frente a nuestros muchachos antigramaticalmente boxeadores.", "Con los pueblos y el idioma, señor Monner Sans, ocurre lo mismo. Los pueblos bestias se perpetúan en su idioma, como que, no teniendo ideas nuevas que expresar, no necesitan palabras nuevas o giros extraños; pero, en cambio, los pueblos que, como el nuestro, están en una continua evolución, sacan palabras de todos los ángulos, palabras que indignan a los profesores, como lo indigna a un profesor de boxeo europeo el hecho inconcebible de que un muchacho que boxea mal le rompa el alma a un alumno suyo que, técnicamente, es un perfecto pugilista. Eso sí; a mí me parece lógico que ustedes protesten. Tienen derecho a ello, ya que nadie les lleva el apunte, ya que ustedes tienen el tan poco discernimiento pedagógico de no darse cuenta de que, en el país donde viven, no pueden obligarnos a decir o escribir: “llevó a su boca un emparedado de jamón”, en vez de decir: “se comió un sandwich”. Yo me jugaría la cabeza que usted, en su vida cotidiana, no dice: “llevó a su boca un emparedado de jamón”, sino que, como todos diría: “se comió un sandwich”. De más está decir que todos sabemos que un sandwich se come con la boca, a menos que el autor de la frase haya descubierto que también se come con las orejas.", "Un pueblo impone su arte, su industria, su comercio y su idioma por prepotencia. Nada más. Usted ve lo que pasa con Estados Unidos. Nos mandan sus artículos con leyendas en inglés, y muchos términos ingleses nos son familiares. En el Brasil, muchos términos argentinos (lunfardos) son populares. ¿Por qué? Por prepotencia. Por superioridad.", "Last Reason, Félix Lima, Fray Mocho y otros, han influido mucho más sobre nuestro idioma, que todos los macaneos filológicos y gramaticales de un señor Cejador y Frauca, Benot y toda la pandilla polvorienta y malhumorada de ratones de biblioteca, que lo único que hacen es revolver archivos y escribir memorias, que ni ustedes mismos, gramáticos insignes, se molestan en leer, porque tan aburridas son.", "Este fenómeno nos demuestra hasta la saciedad lo absurdo que es pretender enchalecar en una gramática canónica, las ideas siempre cambiantes y nuevas de los pueblos. Cuando un malandrín que le va a dar una puñalada en el pecho a un consocio, le dice: “te voy a dar un puntazo en la persiana”, es mucho más elocuente que si dijera: “voy a ubicar mi daga en su esternón”. Cuando un maleante exclama, al ver entrar a una pandilla de pesquisas: “¡los relojié de abanico!”, es mucho más gráfico que si dijera: “al socaire examiné a los corchetes”.", "Señor Monner Sans: Si le hiciéramos caso a la gramática, tendrían que haberla respetado nuestros tatarabuelos, y en progresión retrogresiva, llegaríamos a la conclusión que, de haber respetado al idioma aquellos antepasados, nosotros, hombres de la radio y la ametralladora, hablaríamos todavía el idioma de las cavernas. Su modesto servidor.", "Q. B. S. M."], "larra": ["Gran persona debió de ser el primero que llamó pecado mortal a la pereza; nosotros, que ya en uno de nuestros artículos anteriores estuvimos más serios de lo que nunca nos habíamos propuesto, no entraremos ahora en largas y profundas investigaciones acerca de la historia de este pecado, por más que conozcamos que hay pecados que pican en historia, y que la historia de los pecados sería un tanto cuanto divertida. Convengamos solamente en que esta institución ha cerrado y cerrará las puertas del cielo a más de un cristiano.", "Estas reflexiones hacía yo casualmente no hace muchos días, cuando se presentó en mi casa un extranjero de éstos que, en buena o en mala parte, han de tener siempre de nuestro país una idea exagerada e hiperbólica, de éstos que, o creen que los hombres aquí son todavía los espléndidos, francos, generosos y caballerescos seres de hace dos siglos, o que son aún las tribus nómadas del otro lado del Atlante: en el primer caso vienen imaginando que nuestro carácter se conserva tan intacto como nuestra ruina; en el segundo vienen temblando por esos caminos, y preguntan si son los ladrones que los han de despojar los individuos de algún cuerpo de guardia establecido precisamente para defenderlos de los azares de un camino, comunes a todos los países.", "Verdad es que nuestro país no es de aquellos que se conocen a primera ni a segunda vista, y si no temiéramos que nos llamasen atrevidos, lo compararíamos de buena gana a esos juegos de manos sorprendentes e inescrutables para el que ignora su artificio, que estribando en una grandísima bagatela, suelen después de sabidos dejar asombrado de su poca perspicacia al mismo que se devanó los sesos por buscarles causas extrañas. Muchas veces la falta de una causa determinante en las cosas nos hace creer que debe de haber las profundas para mantenerlas al abrigo de nuestra penetración. Tal es el orgullo del hombre, que más quiere declarar en alta voz que las cosas son incomprensibles cuando no las comprende él, que confesar que el ignorarlas puede depender de su torpeza.", "Esto no obstante, como quiera que entre nosotros mismos se hallen muchos en esta ignorancia de los verdaderos resortes que nos mueven, no tendremos derecho para extrañar que los extranjeros no los puedan tan fácilmente penetrar.", "Un extranjero de éstos fue el que se presentó en mi casa, provisto de competentes cartas de recomendación para mi persona. Asuntos intrincados de familia, reclamaciones futuras, y aun proyectos vastos concebidos en París de invertir aquí sus cuantiosos caudales en tal cual especulación industrial o mercantil, eran los motivos que a nuestra patria le conducían.", "Acostumbrado a la actividad en que viven nuestros vecinos, me aseguró formalmente que pensaba permanecer aquí muy poco tiempo, sobre todo si no encontraba pronto objeto seguro en que invertir su capital. Parecióme el extranjero digno de alguna consideración, trabé presto amistad con él, y lleno de lástima traté de persuadirle a que se volviese a su casa cuanto antes, siempre que seriamente trajese otro fin que no fuese el de pasearse. Admiróle la proposición, y fue preciso explicarme más claro.", "—Mirad —le dije—, monsieur Sans-délai —que así se llamaba—; vos venís decidido a pasar quince días, y a solventar en ellos vuestros asuntos.", "—Ciertamente —me contestó—. Quince días, y es mucho. Mañana por la mañana buscamos un genealogista para mis asuntos de familia; por la tarde revuelve sus libros, busca mis ascendientes, y por la noche ya sé quién soy. En cuanto a mis reclamaciones, pasado mañana las presento fundadas en los datos que aquél me dé, legalizadas en debida forma; y como será una cosa clara y de justicia innegable (pues sólo en este caso haré valer mis derechos), al tercer día se juzga el caso y soy dueño de lo mío. En cuanto a mis especulaciones, en que pienso invertir mis caudales, al cuarto día ya habré presentado mis proposiciones. Serán buenas o malas, y admitidas o desechadas en el acto, y son cinco días; en el sexto, séptimo y octavo, veo lo que hay que ver en Madrid; descanso el noveno; el décimo tomo mi asiento en la diligencia, si no me conviene estar más tiempo aquí, y me vuelvo a mi casa; aún me sobran de los quince cinco días.", "Al llegar aquí monsieur Sans-délai, traté de reprimir una carcajada que me andaba retozando ya hacía rato en el cuerpo, y si mi educación logró sofocar mi inoportuna jovialidad, no fue bastante a impedir que se asomase a mis labios una suave sonrisa de asombro y de lástima que sus planes ejecutivos me sacaban al rostro mal de mi grado.", "—Permitidme, monsieur Sans-délai —le dije entre socarrón y formal—, permitidme que os convide a comer para el día en que llevéis quince meses de estancia en Madrid.", "—¿Cómo?", "—Dentro de quince meses estáis aquí todavía.", "—¿Os burláis?", "—No por cierto.", "—¿No me podré marchar cuando quiera? ¡Cierto que la idea es graciosa!", "—Sabed que no estáis en vuestro país activo y trabajador.", "—¡Oh!, los españoles que han viajado por el extranjero han adquirido la costumbre de hablar mal siempre de su país por hacerse superiores a sus compatriotas.", "—Os aseguro que en los quince días con que contáis, no habréis podido hablar siquiera a una sola de las personas cuya cooperación necesitáis.", "—¡Hipérboles! Yo les comunicaré a todos mi actividad.", "—Todos os comunicarán su inercia.", "Conocí que no estaba el señor de Sans-délai muy dispuesto a dejarse convencer sino por la experiencia, y callé por entonces, bien seguro de que no tardarían mucho los hechos en hablar por mí.", "Amaneció el día siguiente, y salimos entrambos a buscar un genealogista, lo cual sólo se pudo hacer preguntando de amigo en amigo y de conocido en conocido: encontrámosle por fin, y el buen señor, aturdido de ver nuestra precipitación, declaró francamente que necesitaba tomarse algún tiempo; instósele, y por mucho favor nos dijo definitivamente que nos diéramos una vuelta por allí dentro de unos días. Sonreíme y marchámonos. Pasaron tres días: fuimos.", "—Vuelva usted mañana —nos respondió la criada—, porque el señor no se ha levantado todavía.", "—Vuelva usted mañana —nos dijo al siguiente día—, porque el amo acaba de salir.", "—Vuelva usted mañana —nos respondió el otro—, porque el amo está durmiendo la siesta.", "—Vuelva usted mañana —nos respondió el lunes siguiente—, porque hoy ha ido a los toros.", "—¿Qué día, a qué hora se ve a un español?", "Vímosle por fin, y «Vuelva usted mañana —nos dijo—, porque se me ha olvidado. Vuelva usted mañana, porque no está en limpio».", "A los quince días ya estuvo; pero mi amigo le había pedido una noticia del apellido Díez, y él había entendido Díaz, y la noticia no servía. Esperando nuevas pruebas, nada dije a mi amigo, desesperado ya de dar jamás con sus abuelos.", "Es claro que faltando este principio no tuvieron lugar las reclamaciones.", "Para las proposiciones que acerca de varios establecimientos y empresas utilísimas pensaba hacer, había sido preciso buscar un traductor; por los mismos pasos que el genealogista nos hizo pasar el traductor; de mañana en mañana nos llevó hasta el fin del mes. Averiguamos que necesitaba dinero diariamente para comer, con la mayor urgencia; sin embargo, nunca encontraba momento oportuno para trabajar. El escribiente hizo después otro tanto con las copias, sobre llenarlas de mentiras, porque un escribiente que sepa escribir no le hay en este país.", "No paró aquí; un sastre tardó veinte días en hacerle un frac, que le había mandado llevarle en veinticuatro horas; el zapatero le obligó con su tardanza a comprar botas hechas; la planchadora necesitó quince días para plancharle una camisola; y el sombrerero a quien le había enviado su sombrero a variar el ala, le tuvo dos días con la cabeza al aire y sin salir de casa.", "Sus conocidos y amigos no le asistían a una sola cita, ni avisaban cuando faltaban, ni respondían a sus esquelas. ¡Qué formalidad y qué exactitud!", "—¿Qué os parece de esta tierra, monsieur Sans-délai? —le dije al llegar a estas pruebas.", "—Me parece que son hombres singulares...", "—Pues así son todos. No comerán por no llevar la comida a la boca.", "Presentóse con todo, yendo y viniendo días, una proposición de mejoras para un ramo que no citaré, quedando recomendada eficacísimamente.", "A los cuatro días volvimos a saber el éxito de nuestra pretensión.", "—Vuelva usted mañana —nos dijo el portero—. El oficial de la mesa no ha venido hoy.", "«Grande causa le habrá detenido», dije yo entre mí. Fuímonos a dar un paseo, y nos encontramos, ¡qué casualidad!, al oficial de la mesa en el Retiro, ocupadísimo en dar una vuelta con su señora al hermoso sol de los inviernos claros de Madrid.", "Martes era el día siguiente, y nos dijo el portero:", "—Vuelva usted mañana, porque el señor oficial de la mesa no da audiencia hoy.", "—Grandes negocios habrán cargado sobre él —dije yo.", "Como soy el diablo y aun he sido duende, busqué ocasión de echar una ojeada por el agujero de una cerradura. Su señoría estaba echando un cigarrito al brasero, y con una charada del Correo entre manos que le debía costar trabajo el acertar.", "—Es imposible verle hoy —le dije a mi compañero—; su señoría está en efecto ocupadísimo.", "Diónos audiencia el miércoles inmediato, y ¡qué fatalidad! el expediente había pasado a informe, por desgracia, a la única persona enemiga indispensable de monsieur y de su plan, porque era quien debía salir en él perjudicado. Vivió el expediente dos meses en informe, y vino tan informado como era de esperar. Verdad es que nosotros no habíamos podido encontrar empeño para una persona muy amiga del informante. Esta persona tenía unos ojos muy hermosos, los cuales sin duda alguna le hubieran convencido en sus ratos perdidos de la justicia de nuestra causa.", "Vuelto de informe se cayó en la cuenta en la sección de nuestra bendita oficina de que el tal expediente no correspondía a aquel ramo; era preciso rectificar este pequeño error; pasóse al ramo, establecimiento y mesa correspondiente, y hétenos, caminando después de tres meses a la cola siempre de nuestro expediente, como hurón que busca el conejo, y sin poderlo sacar muerto ni vivo de la huronera. Fue el caso al llegar aquí que el expediente salió del primer establecimiento y nunca llegó al otro.", "—De aquí se remitió con fecha de tantos —decían en uno.", "—Aquí no ha llegado nada —decían en otro.", "—¡Voto va! —dije yo a monsieur Sans-délai—, ¿sabéis que nuestro expediente se ha quedado en el aire como el alma de Garibay, y que debe de estar ahora posado como una paloma sobre algún tejado de esta activa población?", "Hubo que hacer otro. ¡Vuelta a los empeños! ¡Vuelta a la prisa! ¡Qué delirio!", "—Es indispensable —dijo el oficial con voz campanuda— que esas cosas vayan por sus trámites regulares.", "Es decir, que el toque estaba, como el toque del ejercicio militar, en llevar nuestro expediente tantos o cuantos años de servicio.", "Por último, después de cerca de medio año de subir y bajar, y estar a la firma o al informe, o a la aprobación, o al despacho, o debajo de la mesa, y de volver siempre mañana, salió con una notita al margen que decía: «A pesar de la justicia y utilidad del plan del exponente, negado».", "—¡Ah, ah!, monsieur Sans-délai —exclamé riéndome a carcajadas—; éste es nuestro negocio.", "Pero monsieur Sans-délai se daba a todos los diablos.", "—¿Para esto he echado yo mi viaje tan largo? ¿Después de seis meses no habré conseguido sino que me digan en todas partes diariamente: «Vuelva usted mañana», y cuando este dichoso mañana llega en fin, nos dicen redondamente que no? ¿Y vengo a darles dinero? ¿Y vengo a hacerles favor? Preciso es que la intriga más enredada se haya fraguado para oponerse a nuestras miras.", "—¿Intriga, monsieur Sans-délai? No hay hombre capaz de seguir dos horas una intriga. La pereza es la verdadera intriga; os juro que no hay otra; ésa es la gran causa oculta; es más fácil negar las cosas que enterarse de ellas.", "Al llegar aquí, no quiero pasar en silencio algunas razones de las que me dieron para la anterior negativa, aunque sea una pequeña digresión.", "—Ese hombre se va a perder —me decía un personaje muy grave y muy patriótico.", "—Ésa no es una razón —le repuse—: si él se arruina, nada, nada se habrá perdido en concederle lo que pide; él llevará el castigo de su osadía o de su ignorancia.", "—¿Cómo ha de salir con su intención?", "—Y suponga usted que quiere tirar su dinero y perderse, ¿no puede uno aquí morirse siquiera, sin tener un empeño para el oficial de la mesa?", "—Puede perjudicar a los que hasta ahora han hecho de otra manera eso mismo que ese señor extranjero quiere.", "—¿A los que lo han hecho de otra manera, es decir, peor?", "—Sí, pero lo han hecho.", "—Sería lástima que se acabara el modo de hacer mal las cosas. ¿Conque, porque siempre se han hecho las cosas del modo peor posible, será preciso tener consideraciones con los perpetuadores del mal? Antes se debiera mirar si podrían perjudicar los antiguos al moderno.", "—Así está establecido; así se ha hecho hasta aquí; así lo seguiremos haciendo.", "—Por esa razón deberían darle a usted papilla todavía como cuando nació.", "—En fin, señor Fígaro, es un extranjero.", "—¿Y por qué no lo hacen los naturales del país?", "—Con esas socaliñas vienen a sacarnos la sangre.", "—Señor mío —exclamé, sin llevar más adelante mi paciencia—, está usted en un error harto general. Usted es como muchos que tienen la diabólica manía de empezar siempre por poner obstáculos a todo lo bueno, y el que pueda que los venza. Aquí tenemos el loco orgullo de no saber nada, de quererlo adivinar todo y no reconocer maestros. Las naciones que han tenido, ya que no el saber, deseos de él, no han encontrado otro remedio que el de recurrir a los que sabían más que ellas. Un extranjero —seguí— que corre a un país que le es desconocido, para arriesgar en él sus caudales, pone en circulación un capital nuevo, contribuye a la sociedad, a quien hace un inmenso beneficio con su talento y su dinero; si pierde es un héroe; si gana es muy justo que logre el premio de su trabajo, pues nos proporciona ventajas que no podíamos acarrearnos solos. Ese extranjero que se establece en este país no viene a sacar de él el dinero, como usted supone; necesariamente se establece y se arraiga en él, y a la vuelta de media docena de años, ni es extranjero ya ni puede serlo; sus más caros intereses y su familia le ligan al nuevo país que ha adoptado; toma cariño al suelo donde ha hecho su fortuna, al pueblo donde ha escogido una compañera; sus hijos son españoles, y sus nietos lo serán; en vez de extraer el dinero, ha venido a dejar un capital suyo que traía, invirtiéndole y haciéndole producir; ha dejado otro capital de talento, que vale por lo menos tanto como el del dinero; ha dado de comer a los pocos o muchos naturales de quien ha tenido necesariamente que valerse; ha hecho una mejora, y hasta ha contribuido al aumento de la población con su nueva familia. Convencidos de estas importantes verdades, todos los Gobiernos sabios y prudentes han llamado a sí a los extranjeros: a su grande hospitalidad ha debido siempre la Francia su alto grado de esplendor; a los extranjeros de todo el mundo que ha llamado la Rusia ha debido el llegar a ser una de las primeras naciones en muchísimo menos tiempo que el que han tardado otras en llegar a ser las últimas; a los extranjeros han debido los Estados Unidos... Pero veo por sus gestos de usted —concluí interrumpiéndome oportunamente a mí mismo— que es muy difícil convencer al que está persuadido de que no se debe convencer. ¡Por cierto, si usted mandara, podríamos fundar en usted grandes esperanzas! La fortuna es que hay hombres que mandan más ilustrados que usted, que desean el bien de su país, y dicen: «Hágase el milagro, y hágalo el diablo». Con el Gobierno que en el día tenemos, no estamos ya en el caso de sucumbir a los ignorantes o a los malintencionados, y quizá ahora se logre que las cosas vayan a mejor, aunque despacio, mal que les pese a los batuecos.", "Concluida esta filípica, fuime en busca de mi Sans-délai.", "—Me marcho, señor Fígaro —me dijo—. En este país no hay tiempo para hacer nada; sólo me limitaré a ver lo que haya en la capital de más notable.", "—¡Ay!, mi amigo —le dije—, idos en paz, y no queráis acabar con vuestra poca paciencia; mirad que la mayor parte de nuestras cosas no se ven.", "—¿Es posible?", "—¿Nunca me habéis de creer? Acordaos de los quince días...", "Un gesto de monsieur Sans-délai me indicó que no le había gustado el recuerdo.", "—Vuelva usted mañana —nos decían en todas partes—, porque hoy no se ve.", "—Ponga usted un memorialito para que le den a usted permiso especial.", "Era cosa de ver la cara de mi amigo al oír lo del memorialito: representábasele en la imaginación el informe, y el empeño, y los seis meses, y... Contentóse con decir:", "—Soy extranjero. —¡Buena recomendación entre los amables compatriotas míos!", "Aturdíase mi amigo cada vez más, y cada vez nos comprendía menos. Días y días tardamos en ver, a fuerza de esquelas y de volver, las pocas rarezas que tenemos guardadas. Finalmente, después de medio año largo, si es que puede haber un medio año más largo que otro, se restituyó mi recomendado a su patria maldiciendo de esta tierra, y dándome la razón que yo ya antes me tenía, y llevando al extranjero noticias excelentes de nuestras costumbres; diciendo sobre todo que en seis meses no había podido hacer otra cosa sino volver siempre mañana, y que a la vuelta de tanto mañana, eternamente futuro, lo mejor, o más bien lo único que había podido hacer bueno, había sido marcharse.", "¿Tendrá razón, perezoso lector (si es que has llegado ya a esto que estoy escribiendo), tendrá razón el buen monsieur Sans-délai en hablar mal de nosotros y de nuestra pereza? ¿Será cosa de que vuelva el día de mañana con gusto a visitar nuestros hogares? Dejemos esta cuestión para mañana, porque ya estarás cansado de leer hoy: si mañana u otro día no tienes, como sueles, pereza de volver a la librería, pereza de sacar tu bolsillo, y pereza de abrir los ojos para ojear las hojas que tengo que darte todavía, te contaré cómo a mí mismo, que todo esto veo y conozco y callo mucho más, me ha sucedido muchas veces, llevado de esta influencia, hija del clima y de otras causas, perder de pereza más de una conquista amorosa; abandonar más de una pretensión empezada, y las esperanzas de más de un empleo, que me hubiera sido acaso, con más actividad, poco menos que asequible; renunciar, en fin, por pereza de hacer una visita justa o necesaria, a relaciones sociales que hubieran podido valerme de mucho en el transcurso de mi vida; te confesaré que no hay negocio que no pueda hacer hoy que no deje para mañana; te referiré que me levanto a las once, y duermo siesta; que paso haciendo el quinto pie de la mesa de un café, hablando o roncando, como buen español, las siete y las ocho horas seguidas; te añadiré que cuando cierran el café, me arrastro lentamente a mi tertulia diaria (porque de pereza no tengo más que una), y un cigarrito tras otro me alcanzan clavado en un sitial, y bostezando sin cesar, las doce o la una de la madrugada; que muchas noches no ceno de pereza, y de pereza no me acuesto; en fin, lector de mi alma, te declararé que de tantas veces como estuve en esta vida desesperado, ninguna me ahorqué y siempre fue de pereza. Y concluyo por hoy confesándote que ha más de tres meses que tengo, como la primera entre mis apuntaciones, el título de este artículo, que llamé: «Vuelva usted mañana»; que todas las noches y muchas tardes he querido durante ese tiempo escribir algo en él, y todas las noches apagaba mi luz diciéndome a mí mismo con la más pueril credulidad en mis propias resoluciones: «¡Eh!, mañana le escribiré». Da gracias a que llegó por fin este mañana, que no es del todo malo; pero ¡ay de aquel mañana que no ha de llegar jamás!"], "marti": ["Cree el aldeano vanidoso que el mundo entero es su aldea, y con tal que él quede de alcalde, o le mortifique al rival que le quitó la novia, o le crezcan en la alcancía los ahorros, ya da por bueno el orden universal, sin saber de los gigantes que llevan siete leguas en las botas y le pueden poner la bota encima, ni de la pelea de los cometas en el Cielo, que van por el aire dormidos engullendo mundos. Lo que quede de aldea en América ha de despertar. Estos tiempos no son para acostarse con el pañuelo a la cabeza, sino con las armas de almohada, como los varones de Juan de Castellanos: las armas del juicio, que vencen a las otras. Trincheras de ideas valen más que trincheras de piedra.", "No hay proa que taje una nube de ideas. Una idea enérgica, flameada a tiempo ante el mundo, para, como la bandera mística del juicio final, a un escuadrón de acorazados. Los pueblos que no se conocen han de darse prisa para conocerse, como quienes van a pelear juntos. Los que se enseñan los puños, como hermanos celosos, que quieren los dos la misma tierra, o el de casa chica, que le tiene envidia al de casa mejor, han de encajar, de modo que sean una, las dos manos.", "(...)", "Ni ¿en qué patria puede tener un hombre más orgullo que en nuestras repúblicas dolorosas de América, levantadas entre las masas mudas de indios, al ruido de pelea del libro con el cirial, sobre los brazos sangrientos de un centenar de apóstoles? De factores tan descompuestos, jamás, en menos tiempo histórico, se han creado naciones tan adelantadas y compactas. Cree el soberbio que la tierra fue hecha para servirle de pedestal, porque tiene la pluma fácil o la palabra de colores, y acusa de incapaz e irremediable a su república nativa, porque no le dan sus selvas nuevas modo continuo de ir por el mundo de gamonal famoso, guiando jacas de Persia y derramando champaña. La incapacidad no está en el país naciente, que pide formas que se le acomoden y grandeza útil, sino en los que quieren regir pueblos originales, de composición singular y violenta, con leyes heredadas de cuatro siglos de práctica libre en los Estados Unidos, de diecinueve siglos de monarquía en Francia. Con un decreto de Hamilton no se le para la pechada al potro del llanero. Con una frase de Sieyès no se desestanca la sangre cuajada de la raza india. A lo que es, allí donde se gobierna, hay que atender para gobernar bien; y el buen gobernante en América no es el que sabe cómo se gobierna el alemán o el francés, sino el que sabe con qué elementos está hecho su país, y cómo puede ir guiándolos en junto, para llegar, por métodos e instituciones nacidas del país mismo, a aquel estado apetecible donde cada hombre se conoce y ejerce, y disfrutan todos de la abundancia que la naturaleza puso para todos en el pueblo que fecundan con su trabajo y defienden con sus vidas. El gobierno ha de nacer del país. El espíritu del gobierno ha de ser el del país. La forma del gobierno ha de avenirse a la constitución propia del país. El gobierno no es más que el equilibrio de los elementos naturales del país.", "(...)", "¿Cómo han de salir de las universidades los gobernantes, si no hay universidad en América donde se enseñe lo rudimentario del arte del gobierno, que es el análisis de los elementos peculiares de los pueblos de América? A adivinar salen los jóvenes al mundo, con antiparras yanquis o francesas, y aspiran a dirigir un pueblo que no conocen. En la carrera de la política habría de negarse la entrada a los que desconocen los rudimentos de la política. El premio de los certámenes no ha de ser para la mejor oda, sino para el mejor estudio de los factores del país en que se vive. En el periódico, en la cátedra, en la academia, debe llevarse adelante el estudio de los factores reales del país. Conocerlos basta, sin vendas ni ambages; porque el que pone de lado, por voluntad u olvido, una parte de la verdad, cae a la larga por la verdad que le faltó, que crece en la negligencia, y derriba lo que se levanta sin ella. Resolver el problema después de conocer sus elementos, es más fácil que resolver el problema sin conocerlos. Viene el hombre natural, indignado y fuerte, y derriba la justicia acumulada de los libros, porque no se la administra en acuerdo con las necesidades patentes del país. Conocer es resolver. Conocer el país, y gobernarlo conforme al conocimiento, es el único modo de librarlo de tiranías. La universidad europea ha de ceder a la universidad americana. La historia de América, de los incas a acá, ha de enseñarse al dedillo, aunque no se enseñe la de los arcontes de Grecia. Nuestra Grecia es preferible a la Grecia que no es nuestra. Nos es más necesaria. Los políticos nacionales han de reemplazar a los políticos exóticos. Injértese en nuestras repúblicas el mundo; pero el tronco ha de ser el de nuestras repúblicas. Y calle el pedante vencido; que no hay patria en que pueda tener el hombre más orgullo que en nuestras dolorosas repúblicas americanas.", "(...)", "Éramos una visión, con el pecho de atleta, las manos de petimetre y la frente de niño. Éramos una máscara, con los calzones de Inglaterra, el chaleco parisiense, el chaquetón de Norteamérica y la montera de España. (...) Ni el libro europeo, ni el libro yanqui, daban la clave del enigma hispanoamericano. (...) Las levitas son todavía de Francia, pero el pensamiento empieza a ser de América. Los jóvenes de América se ponen la camisa al codo, hunden las manos en la masa, y la levantan con la levadura de su sudor. Entienden que se imita demasiado, y que la salvación está en crear. Crear es la palabra de pase de esta generación. El vino, de plátano; y si sale agrio, ¡es nuestro vino!", "(...)", "No hay odio de razas, porque no hay razas. Los pensadores canijos, los pensadores de lámparas, enhebran y recalientan las razas de librería, que el viajero justo y el observador cordial buscan en vano en la justicia de la Naturaleza, donde resalta en el amor victorioso y el apetito turbulento, la identidad universal del hombre. El alma emana, igual y eterna, de los cuerpos diversos en forma y en color. Peca contra la Humanidad el que fomente y propague la oposición y el odio de las razas. (...) Pensar es servir."], "quiroga": ["## I", "Cree en un maestro –Poe, Maupassant, Kipling, Chejov– como en Dios mismo.", "## II", "Cree que su arte es una cima inaccesible. No sueñes en domarla. Cuando puedas hacerlo, lo conseguirás sin saberlo tú mismo.", "## III", "Resiste cuanto puedas a la imitación, pero imita si el influjo es demasiado fuerte. Más que ninguna otra cosa, el desarrollo de la personalidad es una larga paciencia.", "## IV", "Ten fe ciega no en tu capacidad para el triunfo, sino en el ardor con que lo deseas. Ama a tu arte como a tu novia, dándole todo tu corazón.", "## V", "No empieces a escribir sin saber desde la primera palabra adónde vas. En un cuento bien logrado, las tres primeras líneas tienen casi la importancia de las tres últimas.", "## VI", "Si quieres expresar con exactitud esta circunstancia: «Desde el río soplaba el viento frío», no hay en lengua humana más palabras que las apuntadas para expresarla. Una vez dueño de tus palabras, no te preocupes de observar si son entre sí consonantes o asonantes.", "## VII", "No adjetives sin necesidad. Inútiles serán cuantas colas de color adhieras a un sustantivo débil. Si hallas el que es preciso, él solo tendrá un color incomparable. Pero hay que hallarlo.", "## VIII", "Toma a tus personajes de la mano y llévalos firmemente hasta el final, sin ver otra cosa que el camino que les trazaste. No te distraigas viendo tú lo que ellos pueden o no les importa ver. No abuses del lector. Un cuento es una novela depurada de ripios. Ten esto por una verdad absoluta, aunque no lo sea.", "## IX", "No escribas bajo el imperio de la emoción. Déjala morir, y evócala luego. Si eres capaz entonces de revivirla tal cual fue, has llegado en arte a la mitad del camino.", "## X", "No pienses en tus amigos al escribir, ni en la impresión que hará tu historia. Cuenta como si tu relato no tuviera interés más que para el pequeño ambiente de tus personajes, de los que pudiste haber sido uno. No de otro modo se obtiene la vida del cuento."], "arlt3": ["Comienzo por declarar que creo que para vagabundear se necesitan excepcionales condiciones de soñador. Ya lo dijo el ilustre Macedonio Fernández: «No toda es vigilia la de los ojos abiertos».", "Digo esto porque hay vagos, y vagos. Entendámonos. Entre el «crosta» de botines destartalados, pelambre mugrientosa y enjundia con más grasa que un carro de matarife, y el vagabundo bien vestido, soñador y escéptico, hay más distancia que entre la Luna y la Tierra. Salvo que ese vagabundo se llame Máximo Gorki, o Jack London, o Richepin.", "Ante todo, para vagar hay que estar por completo despojado de prejuicios y luego ser un poquitín escéptico, escéptico como esos perros que tienen la mirada de hambre y que cuando los llaman menean la cola, pero en vez de acercarse, se alejan, poniendo entre su cuerpo y la humanidad, una respetable distancia.", "Claro está que nuestra ciudad no es de las más apropiadas para el atorrantismo sentimental, pero ¡qué se le va a hacer!", "Para un ciego, de esos ciegos que tienen las orejas y los ojos bien abiertos inútilmente, nada hay para ver en Buenos Aires, pero, en cambio, ¡qué grandes, qué llenas de novedades están las calles de la ciudad para un soñador irónico y un poco despierto! ¡Cuántos dramas escondidos en las siniestras casas de departamentos! ¡Cuántas historias crueles en los semblantes de ciertas mujeres que pasan! ¡Cuánta canallada en otras caras! Porque hay semblantes que son como el mapa del infierno humano. Ojos que parecen pozos. Miradas que hacen pensar en las lluvias de fuego bíblico. Tontos que son un poema de imbecilidad. Granujas que merecerían una estatua por buscavidas. Asaltantes que meditan sus trapacerías detrás del cristal turbio, siempre turbio, de una lechería.", "El profeta, ante este espectáculo, se indigna. El sociólogo construye indigestas teorías. El papanatas no ve nada y el vagabundo se regocija. Entendámonos. Se regocija ante la diversidad de tipos humanos. Sobre cada uno se puede construir un mundo. Los que llevan escritos en la frente lo que piensan, como aquellos que son más cerrados que adoquines, muestran su pequeño secreto… el secreto que los mueve a través de la vida como fantoches.", "A veces lo inesperado es un hombre que piensa matarse y que lo más gentilmente posible ofrece su suicidio como un espectáculo admirable y en el cual el precio de la entrada es el terror y el compromiso en la comisaría seccional. Otras veces lo inesperado es una señora dándose de cachetadas con su vecina, mientras un coro de mocosos se prende de las polleras de las furias y el zapatero de la mitad de cuadra asoma la cabeza a la puerta de su covacha para no perder el plato.", "Los extraordinarios encuentros de la calle. Las cosas que se ven. Las palabras que se escuchan. Las tragedias que se llegan a conocer. Y de pronto, la calle, la calle lisa y que parecía destinada a ser una arteria de tráfico con veredas para los hombres y calzada para las bestias y los carros, se convierte en un escaparate, mejor dicho, en un escenario grotesco y espantoso donde, como en los cartones de Goya, los endemoniados, los ahorcados, los embrujados, los enloquecidos, danzan su zarabanda infernal.", "Porque, en realidad, ¿qué fue Goya, sino un pintor de las calles de España? Goya, como pintor de tres aristócratas zampatortas, no interesa. Pero Goya, como animador de la canalla de Moncloa, de las brujas de Sierra Divieso, de los bigardos monstruosos, es un genio. Y un genio que da miedo.", "Y todo eso lo vio vagabundeando por las calles.", "La ciudad desaparece. Parece mentira, pero la ciudad desaparece para convertirse en un emporio infernal. Las tiendas, los letreros luminosos, las casas quintas, todas esas apariencias bonitas y regaladoras de los sentidos, se desvanecen para dejar flotando en el aire agriado las nervaduras del dolor universal. Y del espectador se ahuyenta el afán de viajar. Más aún: he llegado a la conclusión de que aquél que no encuentra todo el universo encerrado en las calles de su ciudad, no encontrará una calle original en ninguna de las ciudades del mundo. Y no las encontrará, porque el ciego en Buenos Aires es ciego en Madrid o Calcuta…", "Recuerdo perfectamente que los manuales escolares pintan a los señores o caballeritos que callejean como futuros perdularios, pero yo he aprendido que la escuela más útil para el entendimiento es la escuela de «la calle, escuela agria, que deja en el paladar un placer agridulce y que enseña todo aquello que los libros no dicen jamás». Porque, desgraciadamente, los libros los escriben los poetas o los tontos.", "Sin embargo, aún pasará mucho tiempo antes de que la gente se dé cuenta de la utilidad de darse unos baños de multitud y de callejeo. Pero el día que lo aprendan serán más sabios, y más perfectos y más indulgentes, sobre todo. Sí, indulgentes. Porque más de una vez he pensado que la magnífica indulgencia que ha hecho eterno a Jesús, derivaba de su continua vida en la calle. Y de su comunión con los hombres buenos y malos, y con las mujeres honestas y también con las que no lo eran."], "ia1": ["El martes pasado, en la clase de Historia, la profesora nos devolvió los trabajos sobre la Revolución de Mayo. Doce de veinticinco empezaban con la misma frase: «La Revolución de Mayo fue un proceso complejo y multifacético». Nadie en mi curso habla así. Nadie en ningún curso habla así. La frase la había escrito una inteligencia artificial, doce veces.", "No estoy en contra de la IA. Estoy en contra de que la usemos para no pensar. Y creo que, si seguimos así, vamos a terminar la secundaria con el título en la mano y la cabeza vacía.", "En primer lugar, escribir no es solo producir un texto: es ordenar las ideas. Cuando uno hace un trabajo práctico, lo que importa no es la hoja que entrega, sino lo que tuvo que pensar para llenarla. Pedirle a un programa que lo haga es como mandar a alguien al gimnasio en nuestro lugar y esperar que nos crezcan los músculos.", "Además, los números preocupan. Según una encuesta que hicimos desde el centro de estudiantes, siete de cada diez chicos de la escuela usaron alguna IA para hacer una tarea en el último mes, y la mitad admitió que no leyó lo que entregó. ¿Qué aprendimos, entonces, de la Revolución de Mayo? Que se puede aprobar sin saber nada.", "Es cierto que la IA puede ser útil: explica un tema que no entendimos, sugiere ideas, corrige la ortografía. Mi hermano, que estudia en la universidad, la usa para repasar antes de los parciales. Pero hay una diferencia enorme entre usarla para aprender y usarla para no tener que aprender.", "Algunos dicen que es inútil resistirse porque «el mundo va para ese lado». No es cierto que todo lo que viene haya que aceptarlo sin pensar. El mundo también va para el lado de la comida rápida, y nadie diría que hay que comer hamburguesas todos los días.", "Por eso propongo algo simple: que en la escuela escribamos más en clase, con tiempo; que los trabajos para casa pidan opinión propia y no resúmenes; y que, cuando usemos la IA, lo digamos. Pensar cuesta. Justamente por eso no se puede tercerizar."], "ia2": ["Leí con atención la nota de Valentina Ruiz, «Pensar no se terceriza», y quiero empezar por darle la razón en algo: entregar un texto que uno no leyó es hacerse trampa. Hasta ahí estamos de acuerdo. Lo que no comparto es la conclusión.", "La IA no es el problema; el problema es que la escuela todavía no aprendió a enseñar con ella. Y la solución no es volver al papel y la birome, sino cambiar lo que pedimos.", "Valentina compara usar la IA con mandar a otro al gimnasio en nuestro lugar. La comparación es ingeniosa, pero tramposa: nadie dice que la máquina tenga que pensar por nosotros. Se parece más a una calculadora. Cuando apareció, también se dijo que los chicos iban a dejar de saber sumar. Lo que pasó fue que dejamos de pedir cuentas larguísimas y empezamos a pedir problemas.", "En segundo lugar, esos doce trabajos idénticos sobre la Revolución de Mayo muestran menos un problema de los alumnos que de la consigna. Si una tarea la resuelve un programa en diez segundos, quizás no era una buena tarea. ¿No deberíamos preguntarnos por qué seguimos pidiendo resúmenes que cualquiera puede copiar?", "Por último, la IA ya está en el trabajo, en la universidad y en el celular de todos. Si la escuela no enseña a usarla con criterio —a verificar lo que dice, a detectar sus errores, a citarla—, los chicos lo van a aprender solos, y mal.", "Escribir en clase me parece muy bien; no me opongo. Pero que sea una herramienta más, no un refugio. Propongo otra cosa: en lugar de esconder la IA, pongámosla sobre la mesa. Que los alumnos entreguen la conversación con la máquina junto con el trabajo, que la critiquen, que la corrijan. Pensar cuesta, es verdad. Pensar con una herramienta nueva cuesta todavía más. Esa es, justamente, la tarea de la escuela."], "juegos": ["Escribo esta nota como padre y como ciudadano preocupado. Lo que está pasando con los chicos y los videojuegos es una tragedia silenciosa, y alguien tiene que decirlo.", "Mi sobrino empezó a jugar en línea a los diez años. Hoy tiene quince y no saluda cuando llega a casa. Todos los chicos que juegan terminan así: encerrados, maleducados y sin amigos de verdad.", "Desde que se masificaron los videojuegos en línea, bajaron las notas en las escuelas de todo el país. La conclusión es obvia.", "Los que defienden los videojuegos dicen que hay que poner límites al tiempo de juego. O sea, quieren que los chicos vivan pegados a la pantalla, con un reloj al lado.", "Además, ¿quiénes los defienden? Empresarios que ganan millones vendiéndolos y streamers que no terminaron el secundario. ¿Qué autoridad pueden tener?", "Si hoy les dejamos jugar dos horas, mañana van a querer cuatro, después van a dejar de ir al colegio y al final vamos a tener una generación entera sin futuro.", "Un famoso conductor de televisión dijo la semana pasada que los videojuegos «pudren el cerebro». Si lo dice alguien con su trayectoria, por algo será.", "No se puede estar a favor de los chicos y a favor de los videojuegos al mismo tiempo: o los cuidamos, o los abandonamos a las pantallas.", "Por eso pido que se prohíban los videojuegos para menores de dieciocho años. ¿O vamos a esperar a que sea demasiado tarde?"], "resena": ["Hay juegos que se terminan y juegos que se quedan. Faro del Sur, el primer título del pequeño estudio rosarino Cormorán, pertenece a la segunda especie, aunque no sin tropiezos.", "La historia es sencilla: Mara, una chica de catorce años, llega a un faro abandonado de la costa patagónica para buscar a su abuelo, que desapareció hace un mes. Para encontrarlo tiene que reparar el faro pieza por pieza, mientras descubre cartas, fotos y grabaciones que reconstruyen la vida del viejo farero. No hay enemigos ni armas: hay viento, mar y preguntas.", "Lo mejor del juego es su atmósfera. El dibujo, hecho a mano, convierte cada amanecer en una postal, y la música —una guitarra, un bandoneón, el ruido del mar— acompaña sin invadir. Los acertijos están bien pensados: exigen observar, no adivinar.", "Sin embargo, Faro del Sur tiene problemas. El ritmo decae en la segunda mitad, cuando los acertijos se repiten y la historia parece dar vueltas en el mismo lugar. Y el control en las consolas es impreciso: más de una vez Mara se cae por un acantilado por culpa de un salto mal calculado por el juego, no por el jugador.", "Quien haya jugado juegos de exploración como Gris o Firewatch va a reconocer el tono melancólico. Faro del Sur no llega a esas alturas, pero tiene algo que ellos no tienen: una voz propia, con el viento patagónico y el habla de la costa.", "Es un juego para jugar despacio, en una tarde de lluvia, sin apuro. No es para quien busca acción. Pero quien se anime a perderse en ese faro va a salir con algo parecido a una historia propia. Ocho puntos sobre diez, y muchas ganas de ver qué hace después este estudio."]};

{h:'teoria',n:'Teoría',c:'#7c3aed',c2:'#5b21b6',d:'Diez fichas con todo el cuadernillo, ejemplos nuevos y una pregunta en cada una.',ids:()=>TEORIA.map(t=>t.id)},

const NIV=[[0,'Aprendiz'],[100,'Opinador'],[250,'Argumentador'],[450,'Polemista'],[700,'Orador'],[1000,'Retórico'],[1400,'Maestro de la persuasión']];
const nivel=()=>{let i=0;while(i+1<NIV.length&&S.xp>=NIV[i+1][0])i++;const lo=NIV[i][0],hi=NIV[i+1]?NIV[i+1][0]:lo;return{n:i+1,nom:NIV[i][1],pct:hi>lo?(S.xp-lo)/(hi-lo)*100:100,falta:hi>lo?hi-S.xp:0,sig:NIV[i+1]?.[1]}};
function meBar(){const L=nivel();$('#me').innerHTML=`<span class="pill" title="Racha de respuestas correctas seguidas">${FLAME}${S.racha}</span><span class="pill" title="${esc(L.nom)}">Nivel ${L.n}<span class="xpbar"><i style="width:${L.pct}%"></i></span><span>· ${S.xp} pts</span></span><button class="pill accb" title="Tamaño de letra y lectura en voz alta" aria-label="Opciones de lectura">Aa</button>`;$('.accb').onclick=panelAcc}
function rec(id,ok,host){
  const first=!(id in S.r);if(first)S.r[id]=ok?1:0;
  S.racha=ok?S.racha+1:0;S.rachaMax=Math.max(S.rachaMax,S.racha);
  if(ok&&first){S.xp+=10;if(S.racha>0&&S.racha%5===0)S.xp+=10;if(host)host.insertAdjacentHTML('beforeend',`<span class="xpf">+${S.racha%5===0?20:10}</span>`)}
  save();meBar();
}

/* ---------- motor de preguntas ---------- */
function quiz(el,items,cfg){
  let i=0,pts=0,wrong=[];const N=items.length;
  const show=()=>{
    callar();if(i>=N)return end();
    const it=items[i],opts=cfg.opts(it);
    el.innerHTML=`<div class="qcard"><div class="qtop"><span class="cnt">${i+1}/${N}</span><div class="prog"><i style="width:${i/N*100}%"></i></div><span class="combo">${S.racha>=2?FLAME+S.racha:''}</span></div>
    ${it.src?`<span class="src">${esc(it.src)}</span>`:''}
    ${cfg.pre?cfg.pre(it):''}${cfg.q(it)}
    ${cfg.ask?`<p class="qask">${esc(cfg.ask)}</p>`:''}
    <div class="opts ${cfg.chips?'chips':''}">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.l)}</button>`).join('')}</div>${S.reps>0&&opts.length>2?`<button class="btn lnk comodin">Usar comodín 50/50 (te quedan ${S.reps})</button>`:''}<div class="after"></div></div>`;
    {const op=$('.opts',el),sb=spkBtn(()=>[...el.querySelectorAll('.qtext,.dice,.qask')].map(x=>({t:x.textContent})).concat(opts.map((o,k)=>({t:'Opción '+(k+1)+': '+o.l}))),'mini');op.before(sb)}
    const cm=$('.comodin',el);if(cm)cm.onclick=()=>{const wrong=shuf(opts.map((o,k)=>k).filter(k=>!cfg.isOk(it,opts[k].v)));wrong.slice(0,Math.floor(wrong.length/2)||1).forEach(k=>{const b=el.querySelector(`.opt[data-k="${k}"]`);b.disabled=true;b.style.visibility='hidden'});S.reps--;save();cm.remove()};
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.k],ok=cfg.isOk(it,o.v);
      el.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(cfg.isOk(it,opts[k].v))x.classList.add('ok')});
      if(!ok)b.classList.add('bad');
      $('.comodin',el)?.remove();rec(it.id,ok,$('.qcard',el));if(ok){pts++;if(cfg.cat)hit(cfg.cat(it,o.v))}else wrong.push(it);
      const extra=cfg.extra?cfg.extra(it,o.v):'';
      $('.after',el).innerHTML=`<div class="fb ${ok?'':'bad'}"><span class="fi">${ok?CHECK:CROSS}</span><b>${ok?shuf(['¡Bien!','¡Exacto!','¡Eso!','¡Muy bien!'])[0]:'No es esa.'}</b><span>${extra}${esc(cfg.exp(it,o.v))}</span></div>
      <div class="row" style="margin-top:16px"><button class="btn nx">${i+1<N?'Siguiente':'Ver resultado'}</button></div>`;
      const nx=$('.nx',el);nx.onclick=()=>{i++;show();el.scrollIntoView({block:'nearest'})};nx.focus({preventScroll:true});
    });
  };
  const end=()=>{
    if(cfg.onEnd){cfg.onEnd(pts);return}
    const pct=Math.round(pts/N*100),st=pct>=90?3:pct>=70?2:pct>=40?1:0;
    if(cfg.key){S.best[cfg.key]=Math.max(S.best[cfg.key]||0,pct);save()}
    checkTxt();
    el.innerHTML=`<div class="qcard result"><div class="stars">${[1,2,3].map(k=>STAR(k<=st)).join('')}</div><div class="score">${pts}/${N}</div>
    <p style="font-size:18px;font-weight:600">${pct>=90?'¡Impecable! Esto lo tenés dominado.':pct>=70?'Muy bien. Repasá las que fallaste.':pct>=40?'Vas bien, pero conviene repasar la teoría.':'Volvé a la ficha de teoría y probá otra vez.'}</p>
    ${cfg.key?`<p class="small">Tu mejor marca en esta actividad: ${S.best[cfg.key]} %</p>`:''}
    <div class="row" style="margin-top:14px"><button class="btn again">Otra ronda</button>${wrong.length?'<button class="btn sec rep">Repasar las que fallé</button>':''}</div></div>`;
    $('.again',el).onclick=()=>cfg.restart();
    const r=$('.rep',el);if(r)r.onclick=()=>quiz(el,wrong,Object.assign({},cfg,{key:null}));
  };
  show();
}

function inlineMC(el,it){
  el.innerHTML=`<div class="qcard"><p class="qask">${esc(it.q)}</p><div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><div class="after"></div></div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k===it.ok;
    el.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===it.ok)x.classList.add('ok')});if(!ok)b.classList.add('bad');
    rec(it.id,ok,$('.qcard',el));checkTxt();$('.after',el).innerHTML=`<div class="fb ${ok?'':'bad'}"><span class="fi">${ok?CHECK:CROSS}</span><b>${ok?'¡Bien!':'No es esa.'}</b><span>${esc(it.exp)}</span></div>`});
}

/* Lectura */
let lecId=null,lecMode='leer',lecTool='Tesis';
const TOOLS=['Tesis',...Object.values(ARG_TIPOS),'Ironía','Otro'];
const ABR=/(?:^|[\s(])(?:Dr|Sr|Sra|Vd|Ud|ud|Esq|atte|Q|B|S|M)\.$/;
const splitS=t=>{const out=[],re=/[.!?…]+["”»’)]*\s+(?=[A-ZÁÉÍÓÚÑ¿¡“"«–—(])/g;let st=0,m;while((m=re.exec(t))){if(ABR.test(t.slice(st,m.index+1)))continue;const e=m.index+m[0].length;out.push(t.slice(st,e));st=e}if(st<t.length)out.push(t.slice(st));return out.length?out:[t]};
V.lectura=()=>{
  if(!lecId){
    M.innerHTML=`${head('lectura','Elegí un texto. Vas a poder marcar oraciones, armar la estructura, encontrar la tesis, responder las preguntas y comparar con la lectura del profe.')}
    ${[['cuad','Del cuadernillo'],['clas','Clásicos'],['orig','Escritos para esta app']].map(([g,gt])=>`<h3 style="margin:22px 0 12px">${gt}</h3><div class="lgrid">${LECTURAS.filter(l=>l.grupo===g).map(l=>{const b=S.best['est-'+l.id];return `<button class="lcard" data-id="${l.id}"><span class="tag">${g==='cuad'?'Cuadernillo '+esc(l.pag):g==='clas'?'Dominio público':'Original'}</span><b>${esc(l.titulo)}</b><em>${esc(l.autor)}</em>${b!=null?`<div class="bar"><i style="width:${b}%"></i></div><span class="small">Estructura: ${b} %</span>`:''}</button>`}).join('')}</div>`).join('')}`;
    M.querySelectorAll('.lcard').forEach(b=>b.onclick=()=>{lecId=b.dataset.id;lecMode='leer';V.lectura();scrollTo(0,0)});
    return;
  }
  const L=LECTURAS.find(l=>l.id===lecId),P=TEXTS[L.id];
  const mk=S.marcas[L.id]||(S.marcas[L.id]={}),es=S.est[L.id]||(S.est[L.id]={});
  const pf={};L.profe.forEach((a,n)=>{const ss=splitS(P[a.p]||'');let j=ss.findIndex(s=>s.includes(a.f));if(j<0)j=0;pf[a.p+'-'+j]=(pf[a.p+'-'+j]||[]).concat(n+1)});
  const para=(t,i)=>{
    if(t.startsWith('## '))return `<h5>${esc(t.slice(3))}</h5>`;
    if(t==='(...)')return `<p class="eli">(…)</p>`;
    const sel=lecMode==='estructura'&&L.est[i]?`<span class="estsel" data-p="${i}">${L.etiq.map(e=>`<button class="${es[i]===e?'on':''}" data-e="${esc(e)}">${esc(e)}</button>`).join('')}</span>`:'';
    return `<p data-i="${i}">${sel}${splitS(t).map((s,j)=>{const id=i+'-'+j,m=mk[id],p=lecMode==='profe'&&pf[id];
      return `<span class="s${p?' pf':''}" data-id="${id}"${m&&lecMode!=='estructura'?` data-m="${esc(m)}"`:''}>${p?p.map(n=>`<span class="pn">${n}</span>`).join(''):''}${esc(s)}</span>`}).join('')}</p>`;
  };
  M.innerHTML=`<button class="btn lnk back">← Todos los textos</button>
  <h2 style="margin-top:6px">${esc(L.titulo)}</h2><p class="lead" style="margin-bottom:4px"><b>${esc(L.autor)}</b></p><p class="small" style="margin-bottom:18px">${esc(L.fuente)}${L.grupo==='cuad'?' En el cuadernillo: '+esc(L.pag)+'.':''}</p>
  <div class="seg">${[['leer','Leer y marcar'],['estructura','Estructura'],['tesis','Tesis'],['profe','Lectura del profe'],['preguntas','Preguntas']].map(([k,l],n)=>`<button class="${lecMode===k?'on':''}" data-m="${k}"><i>${n+1}</i>${l}</button>`).join('')}</div>
  <div class="reader"><div class="texto ${lecMode==='leer'?'mk-on':''}">${L.intro&&!['tesis','preguntas'].includes(lecMode)?`<p class="small" style="font-family:var(--sans)">${esc(L.intro)}</p>`:''}${['tesis','preguntas'].includes(lecMode)?'':P.map(para).join('')}<div id="lx"></div></div>
  <aside class="side" id="side"></aside></div>`;
  $('.back').onclick=()=>{lecId=null;V.lectura();scrollTo(0,0)};
  M.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{lecMode=b.dataset.m;V.lectura()});
  const side=$('#side'),lx=$('#lx');
  if(lecMode==='leer'){
    side.classList.add('mkside');
    side.innerHTML=`<div class="panel"><h3>¿Qué querés marcar?</h3><div class="pal">${TOOLS.map(t=>`<button class="${t===lecTool?'on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    <p class="small" style="margin:10px 0 0">Tocá una oración del texto para marcarla. Tocala otra vez para borrar la marca.</p></div>
    <div class="panel cntp"><h3>Tus marcas</h3><p class="small" id="cnt"></p><button class="btn lnk clr">Borrar todas mis marcas</button></div>`;
    side.querySelector('.panel').append(spkBtn(()=>[...M.querySelectorAll('.texto > p, .texto > h5')].map(e=>({t:e.textContent,el:e}))));
    const cnt=()=>{const v=Object.values(mk);$('#cnt').textContent=v.length?Object.entries(v.reduce((o,x)=>(o[x]=(o[x]||0)+1,o),{})).map(([k,n])=>`${k}: ${n}`).join(' · '):'Todavía no marcaste nada.'};cnt();
    side.querySelectorAll('.pal button').forEach(b=>b.onclick=()=>{lecTool=b.dataset.t;side.querySelectorAll('.pal button').forEach(x=>x.classList.toggle('on',x===b))});
    M.querySelectorAll('.texto .s').forEach(s=>s.onclick=()=>{const id=s.dataset.id;if(mk[id]===lecTool){delete mk[id];s.removeAttribute('data-m')}else{mk[id]=lecTool;s.dataset.m=lecTool}save();cnt()});
    const clr=$('.clr');clr.onclick=()=>confirmIn(clr,'¿Borrar todas?',()=>{S.marcas[L.id]={};save();V.lectura()});
  }else if(lecMode==='estructura'){
    side.innerHTML=`<div class="panel"><h3>Armá la estructura</h3><p class="small">Elegí, para cada párrafo, a qué parte del texto pertenece. Después corregí.</p>
    <div class="row"><button class="btn corr">Corregir</button></div><div id="eres" style="margin-top:10px"></div></div>`;
    M.querySelectorAll('.estsel button').forEach(b=>b.onclick=()=>{const p=b.parentNode.dataset.p;es[p]=b.dataset.e;save();b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
    $('.corr').onclick=()=>{const ks=Object.keys(L.est);let ok=0;
      ks.forEach(k=>{const p=M.querySelector(`.texto p[data-i="${k}"]`),good=L.est[k].includes(es[k]);if(good)ok++;p.classList.toggle('okp',good);p.classList.toggle('badp',!good);
        const sel=p.querySelector('.estsel');sel.querySelector('.sol')?.remove();if(!good)sel.insertAdjacentHTML('beforeend',`<span class="sol">→ ${esc(L.est[k].join(' o '))}</span>`)});
      const pct=Math.round(ok/ks.length*100);rec('est-'+L.id,pct>=80,null);S.best['est-'+L.id]=Math.max(S.best['est-'+L.id]||0,pct);save();
      checkTxt();
      $('#eres').innerHTML=`<div class="stars" style="justify-content:flex-start">${[1,2,3].map(k=>STAR(k<=(pct>=90?3:pct>=70?2:pct>=40?1:0))).join('')}</div><div class="score" style="font-size:44px">${pct} %</div><p class="small">${ok} de ${ks.length} párrafos bien ubicados. Los de borde verde están bien; en los rojos aparece la respuesta esperada.</p>`};
  }else if(lecMode==='tesis'){
    lx.innerHTML=`<div id="tq1"></div><div id="tq2" style="margin-top:16px"></div>`;
    inlineMC($('#tq1'),Object.assign({id:'tes-'+L.id},L.tesis));
    const E=L.explicita;inlineMC($('#tq2'),{id:'exp-'+L.id,q:'Esa tesis, ¿es explícita o implícita?',opts:['Explícita','Implícita'],ok:E.ok==='Explícita'?0:1,exp:E.exp});
    if(L.extra){lx.insertAdjacentHTML('beforeend','<h3 style="margin:26px 0 10px;font-family:var(--sans)">Detectá las falacias</h3>');L.extra.forEach(x=>{const d=document.createElement('div');d.style.marginTop='14px';lx.append(d);inlineMC(d,x)})}
    side.innerHTML=`<div class="panel"><h3>Recordá</h3><p class="small">La tesis es la idea que el autor quiere demostrar. Es <b>explícita</b> si aparece escrita en el texto e <b>implícita</b> si se deduce. En los textos irónicos, la tesis real casi siempre es implícita.</p></div>`;
  }else if(lecMode==='profe'){
    side.innerHTML=`<div class="panel"><h3>Lectura del profe</h3><ol class="notas">${L.profe.map(a=>`<li><b>${esc(a.tipo)}</b>${a.n?' — '+esc(a.n):''}</li>`).join('')}</ol>
    <p class="small" style="margin-top:10px">Los números marcan las oraciones en el texto. Tus propias marcas siguen resaltadas: comparalas. No hay una sola lectura posible: si marcaste algo distinto, pensá por qué.</p></div>`;
  }else{
    const R=S.resp[L.id]||(S.resp[L.id]={});
    lx.innerHTML=`<div style="font-family:var(--sans)">${L.preg.map((q,k)=>`<div class="preg"><label for="pr${k}">${k+1}. ${esc(q.q)}</label><textarea id="pr${k}" rows="4" data-k="${k}">${esc(R[k]||'')}</textarea>
    ${q.pista?`<details><summary>Ver una pista</summary><p class="small">${esc(q.pista)}</p></details>`:''}${q.taller?`<button class="btn lnk" data-tal="${q.taller}">Abrir en el Taller de escritura →</button>`:''}</div>`).join('')}</div>`;
    lx.querySelectorAll('textarea').forEach(t=>t.oninput=()=>{R[t.dataset.k]=t.value;save()});
    lx.querySelectorAll('[data-tal]').forEach(b=>b.onclick=()=>{talId=b.dataset.tal;location.hash='taller'});

function confirmIn(btn,msg,yes){const s=document.createElement('span');s.className='confirm';s.innerHTML=`<span class="small">${esc(msg)}</span><button class="btn">Sí</button><button class="btn sec">No</button>`;btn.replaceWith(s);
