<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Argumentar · 3.º año</title>
<meta name="description" content="El texto argumentativo para practicar: teoría, ejercicios, lectura anotada, taller de escritura y debate.">
<meta name="theme-color" content="#7c3aed"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Argumentar"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>/*
VOICE: a game for 15-year-olds that happens to teach rhetoric: energetic, friendly, never babyish.
IDEA: a debate arena / quiz game — each module is a "world" with its own colour, you earn points, streaks and levels.
PICTURE: two big speech bubbles arguing (one violet, one orange) with a lightning bolt between them; module tiles with drawn icons.
COLOUR and TYPE: one saturated colour per module on a near-white lavender ground; chunky Rubik for UI, Literata for reading texts.
LAYOUT: coloured top bar with level/XP; big pressable tiles and buttons; one column under 600px.
*/
:root{color-scheme:light dark;
--bg:light-dark(#f7f6fb,#14121a);--paper:light-dark(#ffffff,#1f1c27);--ink:light-dark(#1d1a2b,#f1eff8);--mut:light-dark(#6b6780,#a9a5bb);
--line:light-dark(#e6e3f0,#322e3d);--c:#7c3aed;--c2:#5b21b6;--ct:light-dark(#f1eafe,#2a2140);
--ok:#16a34a;--ok2:#15803d;--okbg:light-dark(#dcfce7,#163a24);--bad:#e11d48;--bad2:#be123c;--badbg:light-dark(#ffe4e8,#3d1a24);
--hl:#ffe14d;--okt:light-dark(#15803d,#6ee7a0);--badt:light-dark(#be123c,#ff8fa3);--serif:'Literata',Georgia,serif;--sans:'Rubik',system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--c)}
:focus-visible{outline:3px solid var(--c);outline-offset:2px}
/* top bar */
.top{position:sticky;top:0;z-index:10;background:var(--c);color:#fff;box-shadow:0 4px 0 var(--c2);transition:background .3s}
.topin{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px max(3vw,12px) 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;color:#fff;text-decoration:none;letter-spacing:-.01em}
.logo svg{width:34px;height:34px}
.me{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:999px;padding:5px 12px 5px 8px;font-weight:700;font-size:14px;white-space:nowrap}
.pill svg{width:20px;height:20px}
.xpbar{width:70px;height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:#fff;border-radius:4px}
.rail{display:flex;gap:6px;overflow-x:auto;max-width:1140px;margin:0 auto;padding:10px max(3vw,12px) 12px;scrollbar-width:none}
.rail a{flex:none;display:flex;align-items:center;gap:7px;text-decoration:none;color:#fff;font-weight:600;font-size:14.5px;padding:7px 13px 7px 8px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.rail a i{width:14px;height:14px;border-radius:50%;background:var(--mc);box-shadow:0 0 0 2px #fff}
.rail a.on{background:#fff;color:var(--c2)}
main{max-width:1140px;margin:0 auto;padding:clamp(20px,3vw,40px) max(4vw,14px) 80px}
h1,h2,h3{font-weight:800;line-height:1.08;text-wrap:balance;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(42px,7vw,64px)}
h2{font-size:clamp(28px,4vw,40px)}
h3{font-size:20px}
h4{font-size:18px;margin:1.4em 0 .3em}
.lead{font-size:18px;color:var(--mut);max-width:62ch;margin:0 0 1.2em}
.small{font-size:13.5px;color:var(--mut)}
/* module header */
.mhead{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.mhead .ic{flex:none;width:64px;height:64px;border-radius:20px;background:var(--c);display:grid;place-items:center;box-shadow:0 5px 0 var(--c2)}
.mhead .ic svg{width:36px;height:36px}
.mhead h2{margin:0}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--c);color:#fff;border-radius:14px;padding:12px 22px;min-height:48px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;box-shadow:0 4px 0 var(--c2);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c2)}
.btn.sec{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.lnk{background:none;color:var(--c);box-shadow:none;padding:8px 2px;min-height:40px;text-decoration:underline;font-weight:600}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center;margin-bottom:30px}
.hero .kick{font-weight:700;color:var(--c);margin:0 0 8px}
.hero svg.big{width:100%;height:auto;display:block}
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px 20px;margin-top:22px;max-width:520px}
.lvl .badge{grid-row:span 2;width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,#7c3aed,#db2777);display:grid;place-items:center;color:#fff;font-weight:800;font-size:28px;box-shadow:0 4px 0 #5b21b6}
.lvl b{font-size:19px}
.lvl .bar{height:12px}
.who{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.who input{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;font-size:16px;width:min(280px,100%)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mod{position:relative;display:flex;flex-direction:column;text-decoration:none;color:#fff;background:var(--mc);border-radius:24px;padding:20px 20px 18px;box-shadow:0 6px 0 var(--mc2);transition:transform .12s;overflow:hidden;min-height:200px}
.mod:hover{transform:translateY(-3px) rotate(-.4deg)}
.mod:active{transform:translateY(4px);box-shadow:0 2px 0 var(--mc2)}
.mod .ic{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;margin-bottom:12px}
.mod .ic svg{width:32px;height:32px}
.mod b{font-size:22px;line-height:1.1;margin-bottom:6px}
.mod span{font-size:14.5px;line-height:1.4;opacity:.92;flex:1}
.mod::after{content:'';position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12)}
.mod.dark{color:#2a1f00}.mod.dark .ic{background:rgba(0,0,0,.1)}
.bar{height:10px;background:rgba(0,0,0,.12);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px}
.mod .bar{background:rgba(255,255,255,.3);margin-top:14px}.mod .bar i{background:#fff}.mod.dark .bar{background:rgba(0,0,0,.15)}.mod.dark .bar i{background:#2a1f00}
.mod small{font-size:13px;margin-top:6px;font-weight:600;opacity:.95}
/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.tab{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:9px 16px;min-height:46px;cursor:pointer;font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--line)}
.tab.on{background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 3px 0 var(--c2)}
.tab.sm{min-height:38px;padding:5px 12px;font-size:14px}
/* quiz */
.qcard{background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:clamp(18px,3vw,32px);max-width:780px;position:relative}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.qtop .prog{flex:1;height:16px;background:var(--ct);border-radius:9px;overflow:hidden}
.qtop .prog i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .3s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.qtop .cnt{font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
.combo{display:flex;align-items:center;gap:4px;font-weight:800;color:#f97316;font-size:15px}
.combo svg{width:20px;height:20px}
.src{display:inline-block;background:var(--hl);color:#2a2300;border-radius:8px;padding:2px 10px;font-weight:700;font-size:13px;margin-bottom:10px}
.qtext{font-family:var(--serif);font-size:clamp(19px,2.5vw,22px);line-height:1.5;margin:0 0 20px;padding:16px 18px;background:var(--ct);border-radius:16px}
.qask{font-weight:800;font-size:18px;margin:0 0 12px}
.opts{display:grid;gap:10px}
.opts.chips{display:flex;flex-wrap:wrap}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 16px;min-height:50px;cursor:pointer;font-size:16px;font-weight:600;line-height:1.35;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s,background .15s}
.opt:hover:not(:disabled){border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--okbg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok2);animation:pop .35s}
.opt.bad{background:var(--badbg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad2);animation:shake .4s}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:18px;padding:16px 18px;border-radius:18px;background:var(--okbg);border:2px solid var(--ok);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb .fi{grid-row:span 2;width:40px;height:40px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.fb.bad .fi{background:var(--bad)}
.fb .fi svg{width:22px;height:22px}
.fb b{font-size:18px;color:var(--okt)}.fb.bad b{color:var(--badt)}
:root[data-theme=dark] .fb b,.fb b{filter:none}
.xpf{position:absolute;right:24px;top:18px;font-weight:800;color:var(--ok);font-size:22px;animation:up 1s forwards;pointer-events:none}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
.result{text-align:center}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0 4px}
.stars svg{width:58px;height:58px}
.stars svg.on{animation:pop .5s backwards}
.stars svg:nth-child(2).on{animation-delay:.15s}.stars svg:nth-child(3).on{animation-delay:.3s}
.score{font-size:clamp(52px,9vw,84px);font-weight:800;line-height:1;color:var(--c);margin:6px 0}
.result .row{justify-content:center}
/* teoria */
.teo{display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(18px,3vw,40px)}
.teo-nav{display:flex;flex-direction:column;gap:6px;position:sticky;top:130px;align-self:start}
.teo-nav button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:9px 12px;cursor:pointer;font-weight:600;min-height:44px;font-size:14.5px}
.teo-nav button .d{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ct);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--c)}
.teo-nav button .d.k{background:var(--ok);color:#fff}
.teo-nav button.on{border-color:var(--c);background:var(--ct)}
.ficha{max-width:740px;font-size:17px;background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:clamp(20px,3vw,36px)}
.ficha p,.ficha li{max-width:68ch}
.ej{background:var(--ct);padding:14px 18px;border-radius:16px;margin:14px 0;font-family:var(--serif)}
dl.tipos dt{font-weight:800;margin-top:18px;color:var(--c2)}
:root[data-theme=dark] dl.tipos dt{color:var(--c)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) dl.tipos dt{color:var(--c)}}
dl.tipos dd{margin:3px 0 0}
dl.tipos dd span{display:block;font-family:var(--serif);font-style:italic;margin-top:6px;padding:8px 12px;background:var(--ct);border-radius:10px}
table.conn{border-collapse:separate;border-spacing:0 6px;width:100%;margin:12px 0}
table.conn th{text-align:left;vertical-align:top;padding:10px 14px;width:30%;font-weight:700;background:var(--c);color:#fff;border-radius:12px 0 0 12px}
table.conn td{padding:10px 14px;background:var(--ct);border-radius:0 12px 12px 0}
.mini mark{color:inherit;padding:1px 0;border-radius:3px}
.m-i{background:light-dark(#dbeafe,#1e3a5f)}.m-t{background:var(--hl);color:#1a1a1a!important}.m-a{background:light-dark(#fde2e4,#4a2228)}.m-c{background:light-dark(#dcfce7,#173d2a)}
.ley span{display:inline-block;padding:2px 9px;border-radius:6px;font:700 13px var(--sans);margin:2px}
/* lectura */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lcard{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px 18px 16px;cursor:pointer;text-align:left;box-shadow:0 5px 0 var(--line);transition:transform .1s}
.lcard:hover{border-color:var(--c);box-shadow:0 5px 0 var(--c)}
.lcard:active{transform:translateY(3px)}
.lcard .tag{display:inline-block;background:var(--c);color:#fff;font-weight:700;font-size:12px;border-radius:8px;padding:2px 9px;margin-bottom:10px}
.lcard b{display:block;font-family:var(--serif);font-size:20px;line-height:1.25;margin-bottom:4px}
.lcard em{font-style:normal;color:var(--mut);font-size:14px}
.lcard .bar{margin-top:12px;height:8px;background:var(--ct)}
.reader{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:clamp(18px,3vw,36px);align-items:start}
.texto{font-family:var(--serif);font-size:18.5px;line-height:1.75;background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:clamp(18px,3vw,38px)}
.texto p{margin:0 0 1em;position:relative}
.texto h5{font:800 14px var(--sans);letter-spacing:.03em;margin:1.6em 0 .5em;color:var(--c)}
.texto .eli{color:var(--mut);text-align:center}
.s{cursor:pointer;border-radius:4px;transition:background .15s}
.mk-on .s:not([data-m]):hover{background:var(--ct)}
.s[data-m]{background:light-dark(#ffeeb8,#5a4d12)}
.s[data-m=Tesis]{background:var(--hl);color:#1a1a1a}
.s[data-m=Ironía]{background:light-dark(#ecdcff,#3d2a5c)}
.s[data-m]::after{content:attr(data-m);font:700 11px var(--sans);color:#fff;background:var(--c);border-radius:6px;padding:1px 5px;vertical-align:2px;margin-left:4px;white-space:nowrap}
.s.pf{outline:2.5px solid var(--c);outline-offset:1px}
.s .pn{font:800 11px var(--sans);background:var(--c);color:#fff;border-radius:9px;padding:0 6px;margin-right:4px;vertical-align:2px}
.side{position:sticky;top:130px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px}
.panel h3{font-size:17px;margin-bottom:8px}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 11px;font-size:13.5px;font-weight:700;cursor:pointer;min-height:38px}
.pal button.on{border-color:var(--c);background:var(--c);color:#fff}
.estsel{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px;font-family:var(--sans)}
.estsel button{font-size:12.5px;font-weight:700;border:2px solid var(--line);background:var(--paper);border-radius:9px;padding:3px 9px;cursor:pointer;min-height:34px}
.estsel button.on{background:var(--c);color:#fff;border-color:var(--c)}
.texto p.okp{box-shadow:-12px 0 0 var(--ok)}
.texto p.badp{box-shadow:-12px 0 0 var(--bad)}
.estsel .sol{font-size:12.5px;color:var(--badt);align-self:center;font-weight:700}
ol.notas{padding-left:22px;margin:0;font-size:14.5px}
ol.notas li{margin-bottom:8px}
ol.notas li::marker{color:var(--c);font-weight:800}
ol.notas b{color:var(--c)}
.preg{margin:0 0 20px}
.preg label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:11px 14px;font-size:16px;line-height:1.5;resize:vertical}
textarea:focus,input:focus,select:focus{outline:3px solid var(--c);outline-offset:0;border-color:transparent}
details{margin-top:6px}
summary{cursor:pointer;color:var(--c);font-weight:700;font-size:14.5px;min-height:32px}
.seg{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:9px 14px;font-weight:700;cursor:pointer;min-height:46px;box-shadow:0 3px 0 var(--line)}
.seg button.on{background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 3px 0 var(--c2)}
.seg button i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ct);color:var(--c);font-size:12px;margin-right:6px}
.seg button.on i{background:rgba(255,255,255,.25);color:#fff}
/* taller */
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(18px,3vw,36px);align-items:start}
.paso{margin-bottom:18px;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
.paso label{display:flex;gap:10px;align-items:center;font-weight:800;font-size:17px}
.paso label i{font-style:normal;flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:14px}
.paso p{margin:4px 0 8px;font-size:14.5px;color:var(--mut)}
.hoja{background:#fffdf5;color:#1d1a2b;border-radius:6px;padding:clamp(18px,3vw,32px);font-family:var(--serif);font-size:17px;line-height:1.7;white-space:pre-wrap;box-shadow:0 2px 0 rgba(0,0,0,.06),0 18px 36px -18px rgba(40,20,80,.35);min-height:220px;transform:rotate(-.4deg);border-top:8px solid var(--c)}
.hoja h3{font-family:var(--serif);white-space:normal}
.hoja .vacio{color:#8a8698;font-style:italic}
.chipsF{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chipsF span{background:var(--ct);border-radius:999px;padding:4px 11px;font-size:13.5px;font-weight:600;color:var(--mut)}
.chipsF span.c{background:var(--ok);color:#fff}
.check label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--c)}
.temas{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.temas button{border:2px dashed var(--c);background:var(--ct);border-radius:12px;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.sticky2{position:sticky;top:130px}
/* polemica */
.cuadro{display:grid;gap:14px;max-width:900px}
.fila{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px}
.fila .k{font-family:var(--serif);font-size:17.5px;margin-bottom:10px}
.fila .k::before{content:'Karakas dice';display:block;font:800 12px var(--sans);color:#fff;background:var(--c);border-radius:6px;padding:1px 8px;width:max-content;margin-bottom:6px}
.fila select{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-size:15px;min-height:46px}
.fila.okf{border-color:var(--ok);background:var(--okbg)}
.fila.badf{border-color:var(--bad);background:var(--badbg)}

<header class="top"><div class="topin"><a class="logo" href="#inicio"><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M4 9q0-5 5-5h16q5 0 5 5v10q0 5-5 5H14l-6 5 1.5-5H9q-5 0-5-5z" fill="#fff"/><path d="M19 7l-5 9h4l-3 8 8-10h-4l3-7z" fill="#ffe14d" stroke="#1d1a2b" stroke-width="1.3" stroke-linejoin="round"/></svg><span>Argumentar</span></a><div class="me" id="me"></div></div><nav class="rail" id="rail" aria-label="Módulos"></nav></header>
<main id="app"></main>
<footer>Material de práctica basado en el cuadernillo «El texto argumentativo», Prácticas del Lenguaje, 3.er año, Colegio Armenio Arzruni. Uso exclusivo para la clase. · <a href="#profe">Para el profe</a></footer>
<script>const ARG_TIPOS={cita:'Cita de autoridad',gen:'Generalización',con:'Concesión',ref:'Refutación',ej:'Ejemplificación',preg:'Pregunta retórica',ana:'Analogía',acu:'Acumulación',dat:'Datos y cifras'};

const TEORIA=[
{id:'t1',titulo:'¿Qué es argumentar?',html:`
<p>Un texto argumentativo busca <b>convencer</b> a alguien de algo o <b>expresar una opinión</b> fundamentada. Tiene dos componentes básicos:</p>
<ul><li><b>La tesis:</b> la idea que se quiere demostrar. Casi siempre se puede resumir en una sola oración.</li>
<li><b>Los argumentos:</b> las razones que sostienen esa tesis.</li></ul>
<p>La tesis puede ser <b>explícita</b> (aparece escrita en el texto) o <b>implícita</b> (no está escrita, pero se deduce de lo que se dice). En los textos irónicos, como el de Swift, la tesis real casi siempre es implícita: el autor dice una cosa para que entendamos otra.</p>
<div class="ej"><b>Tesis posibles:</b> «Los celulares deberían estar permitidos en el aula con reglas claras». «Usar IA para hacer la tarea sin entenderla es hacerse trampa a uno mismo». «El ciberacoso debería tratarse en todas las materias, no solo en tutoría».</div>
<p>Ojo: una tesis no es un tema. «Las redes sociales» es un tema; «Las redes sociales deberían tener edad mínima de 16 años» es una tesis, porque toma posición y se puede discutir.</p>`,
prueba:{q:'¿Cuál de estas opciones es una tesis y no solo un tema?',opts:['Los videojuegos en la adolescencia','Los videojuegos en línea enseñan a trabajar en equipo','La historia de los videojuegos','Videojuegos y violencia'],ok:1,exp:'Solo la segunda toma una posición que alguien podría discutir. Las otras nombran un tema, pero no dicen qué se piensa de él.'}},

{id:'t2',titulo:'Tipos de argumentos',html:`
<p>Hay muchas maneras de sostener una tesis. Estas son las más frecuentes. Todos los ejemplos defienden o atacan la misma tesis: <i>«Hay que enseñar a usar la IA en la escuela en lugar de prohibirla»</i>.</p>
<dl class="tipos">
<dt>Cita de autoridad</dt><dd>Se apoya en alguien que sabe del tema: un especialista, una institución, una ley. Marcas: «según…», «como afirma…», «de acuerdo con…».<span>«Según la UNESCO, los sistemas educativos deben preparar a los estudiantes para usar la IA de manera crítica y ética.»</span></dd>
<dt>Generalización</dt><dd>Enuncia una supuesta ley general, algo que valdría para todos o casi todos los casos.<span>«Hoy cualquier adolescente sabe pedirle a un chatbot que le resuma un texto.»</span></dd>
<dt>Concesión</dt><dd>Acepta (o finge aceptar) parte de lo que dice el otro, para después reafirmar la posición propia. Marcas: «si bien…», «es cierto que…, pero…», «aunque…».<span>«Es cierto que la IA puede usarse para copiar, pero justamente por eso la escuela tiene que enseñar a usarla bien.»</span></dd>
<dt>Refutación (o negación)</dt><dd>Niega o discute la validez de un argumento contrario. Marcas: «no es cierto que…», «es falso que…».<span>«No es verdad que prohibir la IA evite que se use: los chicos la usan igual, solo que a escondidas.»</span></dd>
<dt>Ejemplificación</dt><dd>Apoya la tesis con un caso concreto. Marcas: «por ejemplo», «tal es el caso de…».<span>«En algunas escuelas, por ejemplo, ya se pide entregar la conversación con la IA junto con el trabajo, para ver cómo se la usó.»</span></dd>
<dt>Pregunta retórica</dt><dd>Una pregunta que no espera respuesta, porque la respuesta ya está implícita. Busca la complicidad del lector.<span>«¿De verdad creemos que una prohibición va a frenar una tecnología que está en todos los celulares?»</span></dd>
<dt>Analogía</dt><dd>Compara una situación con otra a partir de un parecido.<span>«Prohibir la IA en la escuela es como haber prohibido la calculadora: no la hizo desaparecer, solo dejó a los alumnos sin saber usarla.»</span></dd>
<dt>Acumulación</dt><dd>Enumera una serie de elementos que apuntan a lo mismo.<span>«La IA ya está en los buscadores, en los celulares, en los procesadores de texto, en los traductores y en las redes sociales.»</span></dd>
<dt>Datos y cifras</dt><dd>Usa números, porcentajes o estadísticas para respaldar lo que se afirma.<span>«En nuestro curso, 24 de 28 alumnos dijeron haber usado alguna IA en el último mes.»</span></dd>
</dl>
<p>Un mismo fragmento puede combinar varios tipos: una cita de autoridad que trae datos, una acumulación de ejemplos, una pregunta retórica que encierra una analogía.</p>`,
prueba:{q:'«Si bien las redes sociales nos acercan a quienes están lejos, también nos alejan de quienes están cerca.» ¿Qué tipo de argumento es?',opts:['Refutación','Concesión','Generalización','Analogía'],ok:1,exp:'«Si bien…» acepta una parte del argumento contrario (las redes acercan) para reafirmar la propia posición (también alejan). Es una concesión.'}},

{id:'t3',titulo:'Estructura del texto argumentativo',html:`
<p>En general, un texto argumentativo tiene tres partes:</p>
<ol><li><b>Introducción o presentación del tema.</b> Puede empezar con un hecho que conecte el tema con la realidad del lector, con una pregunta que invite a pensar o con los antecedentes del problema. A veces se omite y el texto arranca directamente con la tesis.</li>
<li><b>Argumentación.</b> Se exponen ordenadamente los argumentos que sostienen la tesis (y, muchas veces, se refutan los del otro).</li>
<li><b>Conclusión.</b> Sintetiza lo expuesto y cierra el razonamiento. Puede incluir una apelación al lector para que tome posición o actúe.</li></ol>
<div class="ej mini"><p><mark class="m-i">Esta semana, en un curso de tercero, una foto trucada con IA de una alumna circuló por todos los celulares de la escuela.</mark> <mark class="m-t">La escuela no puede seguir tratando el ciberacoso como un tema menor.</mark></p>
<p><mark class="m-a">En primer lugar, el acoso en las redes no termina cuando suena el timbre: sigue de noche, los fines de semana, en vacaciones. Además, es fácil y barato: hoy cualquiera puede fabricar una imagen falsa en segundos. Es cierto que la escuela no controla lo que pasa fuera del aula, pero sí puede enseñar qué hacer, a quién recurrir y por qué compartir también es participar.</mark></p>
<p><mark class="m-c">Por eso, el ciberacoso tiene que ser tema de todas las materias. ¿O vamos a esperar a que le pase a alguien de nuestro curso?</mark></p>
<p class="ley"><span class="m-i">introducción</span> <span class="m-t">tesis</span> <span class="m-a">argumentación</span> <span class="m-c">conclusión</span></p></div>`,
prueba:{q:'¿Qué parte del texto suele incluir una apelación al lector para que tome posición?',opts:['La introducción','La argumentación','La conclusión','El título'],ok:2,exp:'La conclusión cierra el razonamiento y muchas veces interpela directamente al lector.'}},

{id:'t4',titulo:'Conectores',html:`
<p>Los conectores relacionan las ideas y le muestran al lector cómo avanza el razonamiento. Elegir bien el conector es parte del argumento.</p>
<table class="conn"><tbody>
<tr><th>Ordenar</th><td>en primer lugar, en segundo lugar, por un lado, por otro lado, por una parte, por otra parte, finalmente, por último</td></tr>
<tr><th>Agregar</th><td>además, también, asimismo, es más, incluso</td></tr>
<tr><th>Oponer</th><td>sin embargo, pero, no obstante, en cambio, por el contrario</td></tr>
<tr><th>Conceder</th><td>aunque, si bien, a pesar de que, aun cuando</td></tr>
<tr><th>Explicar la causa</th><td>porque, ya que, puesto que, dado que</td></tr>
<tr><th>Mostrar la consecuencia</th><td>por eso, por lo tanto, en consecuencia, entonces, así que</td></tr>
<tr><th>Ejemplificar</th><td>por ejemplo, como, tal es el caso de, así</td></tr>
<tr><th>Reformular</th><td>es decir, o sea, en otras palabras</td></tr>
<tr><th>Concluir</th><td>en conclusión, en síntesis, en definitiva, para terminar</td></tr>
</tbody></table>
<div class="ej">«Las redes nos conectan con gente que está lejos; <b>sin embargo</b>, pueden aislarnos de quienes tenemos al lado. <b>Por eso</b>, el problema no son las redes, sino cómo las usamos.»</div>`,
prueba:{q:'«Dormimos con el celular al lado de la almohada; ___, llegamos cansados a la escuela.» ¿Qué conector corresponde?',opts:['sin embargo','en consecuencia','por ejemplo','aunque'],ok:1,exp:'La segunda idea es una consecuencia de la primera: «en consecuencia», «por eso», «por lo tanto».'}},

{id:'t5',titulo:'Recursos de la argumentación',html:`
<p>Además de los argumentos, quien argumenta usa recursos de lenguaje que dejan ver su posición.</p>
<h4>Modalizadores</h4>
<p>Palabras o expresiones que muestran qué tan seguro está el autor o cómo valora lo que dice: «sin duda», «evidentemente», «quizás», «lamentablemente», «por suerte», «es necesario que…».</p>
<div class="ej">«<b>Lamentablemente</b>, la escuela llegó tarde a la discusión sobre la IA. <b>Quizás</b> todavía esté a tiempo.»</div>
<h4>Subjetivemas</h4>
<p>Palabras cargadas de valoración (sobre todo adjetivos y sustantivos): no es lo mismo decir «un videojuego» que «un videojuego <b>adictivo</b>», ni «un influencer» que «un <b>vendehúmo</b>».</p>
<h4>Ironía</h4>
<p>Decir lo contrario de lo que se piensa, para que el lector entienda lo que realmente se piensa. Swift propone comerse a los niños pobres para denunciar la crueldad de los ricos; Caparrós escribe «Fantástico…» para burlarse de lo que describe.</p>
<div class="ej">«¡Qué buena idea dejar el grupo del curso abierto toda la noche! Así nadie duerme y todos llegan frescos a la prueba.»</div>
<h4>Polifonía</h4>
<p>En la argumentación suelen aparecer otras voces: citas de especialistas, palabras del oponente para refutarlas, frases hechas. Arlt, por ejemplo, copia lo que dijo Monner Sans para después burlarse de eso.</p>`,
prueba:{q:'«Ningún científico duda de que nada de todo esto habría sucedido si no se hubiesen excedido en la caza del mamut.» (Caparrós) ¿Qué recurso predomina?',opts:['Cita de autoridad seria','Ironía','Datos y cifras','Concesión'],ok:1,exp:'El autor imita el tono de una cita científica para decir algo absurdo: es ironía. Se burla del razonamiento que critica.'}},

{id:'t6',titulo:'Nota de opinión, noticia y editorial',html:`
<p>En diarios, revistas y portales conviven textos que informan y textos que opinan.</p>
<table class="conn"><tbody>
<tr><th>Noticia</th><td>Informa un hecho reciente, sin juzgarlo (o intentando no hacerlo). No suele estar firmada.</td></tr>
<tr><th>Nota de opinión</th><td>Un autor (periodista o especialista) expresa su punto de vista personal sobre un tema. Está firmada: la opinión es de esa persona, no del medio.</td></tr>
<tr><th>Editorial</th><td>Expresa la posición del medio. Por eso no suele estar firmado (o lo firma el director). Usa fórmulas como «desde este diario…».</td></tr>
<tr><th>Carta de lectores</th><td>Un lector le escribe al medio para opinar, quejarse o responder a algo publicado.</td></tr>
<tr><th>Carta abierta</th><td>Una carta dirigida a alguien en particular, pero publicada para que la lea todo el mundo. Puede ser seria o, como la de Podetti, humorística.</td></tr>
</tbody></table>
<p>En internet la frontera es más borrosa: un posteo, un hilo o un video de un influencer pueden funcionar como notas de opinión.</p>`,
prueba:{q:'«Desde este diario sostenemos que la ley contra el ciberacoso no puede esperar más.» ¿Qué tipo de texto es?',opts:['Noticia','Nota de opinión','Editorial','Reseña'],ok:2,exp:'«Desde este diario» indica que habla el medio, no una persona: es un editorial.'}},

{id:'t7',titulo:'Publicidad y propaganda',html:`
<p>La publicidad es un discurso que busca <b>persuadir</b> a un público (los consumidores) para que compre algo. Su tesis es casi siempre la misma: <b>«comprá X porque Y»</b>.</p>
<ul><li>Está dirigida a un <b>público determinado</b>, y eso se nota en el tipo de lenguaje, los personajes, la música, los colores y los lugares donde aparece (no se publicita lo mismo en un video de Twitch que en un noticiero).</li>
<li>No apela solo a razones: busca la <b>identificación emotiva</b>. Propone una idea de felicidad a partir del consumo.</li>
<li>Muchas veces difunde <b>estereotipos y clichés</b>: la madre que limpia, el gamer encerrado, la chica perfecta.</li>
<li>Usa mucho algunas <b>falacias</b>: «lo usan millones» (ad populum), «lo recomienda tal famoso» (ad verecundiam).</li></ul>
<p>Hoy buena parte de la publicidad no parece publicidad: el influencer que «recomienda» un producto, el video patrocinado, el sorteo en Instagram. Reconocerla es el primer paso para no dejarse llevar.</p>
<p>La <b>propaganda política</b> es un discurso emparentado: busca que el público apoye a un candidato, un partido o una idea.</p>`,
prueba:{q:'«Los auriculares que usan los campeones de esports.» ¿Qué falacia publicitaria usa este eslogan?',opts:['Ad baculum','Ad verecundiam','Pregunta compleja','Petición de principio'],ok:1,exp:'Apela al prestigio de los campeones, que pueden saber de juegos pero no necesariamente de calidad de sonido: apelación a la autoridad (ad verecundiam).'}},

{id:'t8',titulo:'La reseña crítica',html:`
<p>La reseña mezcla <b>exposición</b> y <b>argumentación</b>: resume una obra (libro, película, serie, videojuego, disco, obra de teatro) y la <b>valora</b>. Debe resumir sin arruinar la sorpresa (sin spoilers) y dejar claro que la valoración es del autor de la reseña.</p>
<p>Partes habituales:</p>
<ol><li><b>Título</b> (muchas veces ya adelanta la valoración).</li>
<li><b>Presentación de la obra:</b> los datos de la ficha (autor o director, título, editorial o productora, año, duración o páginas, etc.).</li>
<li><b>Resumen expositivo:</b> los contenidos fundamentales, seleccionados y condensados. Suele incluir algo sobre el autor.</li>
<li><b>Comentario crítico:</b> la valoración, con argumentos.</li>
<li><b>Conclusión.</b></li></ol>
<p>A veces resumen y comentario aparecen mezclados. No hay que confundir la reseña con la <b>sinopsis</b>, que es solo un resumen, sin valoración.</p>`,
prueba:{q:'¿Qué diferencia a una reseña de una sinopsis?',opts:['La reseña es más corta','La reseña incluye una valoración crítica','La sinopsis tiene ficha técnica','La sinopsis cuenta el final'],ok:1,exp:'La sinopsis solo resume; la reseña también valora y argumenta esa valoración.'}},

{id:'t9',titulo:'La polémica',html:`
<p>La palabra viene del griego <i>polemikós</i>, «relativo a la guerra»: una polémica es una «guerra de palabras» en la que se enfrentan dos o más posiciones sobre un mismo tema. Por eso es un discurso <b>polifónico</b>: intervienen por lo menos dos voces, la del enunciador y la del oponente.</p>
<p>Como todo texto argumentativo busca persuadir, pero además se dirige a un <b>blanco</b> (el discurso del oponente, o el oponente mismo). Es un <b>contradiscurso</b>: no solo defiende su tesis, también intenta debilitar o destruir la contraria. Por eso abundan las citas del adversario, refutadas enseguida.</p>
<p>La polémica tiene tres tipos de destinatarios:</p>
<dl class="tipos">
<dt>Prodestinatario</dt><dd>El que ya está de acuerdo. No hay que convencerlo, solo fortalecerlo en sus ideas.</dd>
<dt>Contradestinatario</dt><dd>El rival. Tampoco se lo intenta convencer: es el blanco al que se ataca.</dd>
<dt>Paradestinatario</dt><dd>El indeciso, el que todavía no tomó posición. Es el verdadero destinatario de la persuasión.</dd></dl>
<div class="ej">En una discusión en el grupo del curso sobre si hacer o no el viaje de egresados en julio, tus amigos que ya están de acuerdo con vos son prodestinatarios; el que propone diciembre es el contradestinatario; los que todavía no votaron son los paradestinatarios: a ellos les estás hablando de verdad.</div>`,
prueba:{q:'En una polémica, ¿a quién se intenta persuadir realmente?',opts:['Al prodestinatario','Al contradestinatario','Al paradestinatario','A ninguno'],ok:2,exp:'El paradestinatario es el indeciso: de él se busca la adhesión. Al pro ya se lo tiene, y al contra se lo ataca.'}},

{id:'t10',titulo:'Falacias',html:`
<p>Una <b>falacia</b> es un argumento incorrecto que parece correcto: un razonamiento mal construido. No hay que confundir falacia con falsedad: la conclusión puede ser verdadera por casualidad, pero el razonamiento sigue estando mal. Conocer las falacias sirve para no dejarse engañar y para razonar mejor.</p>
<dl class="tipos">
<dt>Ad baculum (apelación a la fuerza)</dt><dd>Convencer con una amenaza, física o simbólica.<span>«Si no votás lo que digo, te saco del grupo.»</span></dd>
<dt>Ad hominem ofensivo</dt><dd>Atacar a la persona en lugar de su argumento.<span>«No le hagan caso a Tomás sobre el uniforme: es un vago.»</span></dd>
<dt>Ad hominem circunstancial</dt><dd>Descalificar el argumento por la situación de quien lo dice.<span>«Claro que la delegada quiere recreos más largos: es alumna.»</span></dd>
<dt>Tu quoque («vos también»)</dt><dd>Una variante del ad hominem: rechazar una crítica porque el que la hace comete la misma falta.<span>«¿Vos me decís que uso mucho el celular? ¡Si vos no lo soltás nunca!»</span></dd>
<dt>Ad ignorantiam (apelación a la ignorancia)</dt><dd>Afirmar que algo es verdadero porque no se probó que es falso (o al revés).<span>«Nadie demostró que la IA no tenga sentimientos; por lo tanto, los tiene.»</span></dd>
<dt>Ad populum (apelación a la mayoría)</dt><dd>Dar algo por válido porque mucha gente lo cree o lo hace.<span>«Todo el curso usa esa app para copiar; no puede estar tan mal.»</span></dd>
<dt>Ad verecundiam (falsa autoridad)</dt><dd>Citar a alguien importante en un campo, pero no en el tema que se discute.<span>«Esta dieta funciona: la recomienda un streamer con cinco millones de seguidores.»</span></dd>
<dt>Ad misericordiam (apelación a la piedad)</dt><dd>Provocar lástima para que se acepte lo que se dice.<span>«Profe, apruébeme: estuve toda la noche buscando a mi gato.»</span></dd>
<dt>Causa falsa</dt><dd>Establecer una relación de causa y efecto que no existe (por ejemplo, porque una cosa pasó después de otra).<span>«Desde que uso estas zapatillas ganamos todos los partidos: son de la suerte.»</span></dd>
<dt>Pregunta compleja</dt><dd>Una pregunta que esconde una afirmación previa.<span>«¿Ya dejaste de copiarte en las pruebas?»</span></dd>
<dt>Petición de principio</dt><dd>Dar como razón lo mismo que se quiere demostrar.<span>«Las redes son dañinas porque hacen daño.»</span></dd>
<dt>Falso dilema</dt><dd>Presentar solo dos opciones cuando hay más.<span>«O prohibimos la IA o nadie vuelve a pensar por sí mismo.»</span></dd>
<dt>Hombre de paja</dt><dd>Deformar la posición del otro para que sea más fácil atacarla.<span>«—Habría que regular las redes para menores. —O sea que querés prohibir internet.»</span></dd>
<dt>Pendiente resbaladiza</dt><dd>Suponer que un primer paso lleva sí o sí a una cadena de consecuencias catastróficas.<span>«Si dejamos el celular en el recreo, después lo van a querer en clase, después en las pruebas y al final nadie va a aprender nada.»</span></dd>
<dt>Generalización apresurada</dt><dd>Sacar una conclusión general a partir de uno o pocos casos.<span>«Conozco dos gamers agresivos: los videojuegos vuelven violenta a la gente.»</span></dd>
<dt>Conclusión irrelevante</dt><dd>Dar razones que no tienen nada que ver con lo que se concluye.<span>«Tiene que ganar el premio a mejor deportista: es muy buena persona y dona a una ONG.»</span></dd>
</dl>`,
prueba:{q:'«O estás conmigo o estás contra mí.» ¿Qué falacia es?',opts:['Hombre de paja','Falso dilema','Ad populum','Causa falsa'],ok:1,exp:'Reduce todo a dos opciones, cuando se puede, por ejemplo, no estar de acuerdo en todo sin ser un enemigo.'}}
];

{id:'quiroga',grupo:'clas',titulo:'Decálogo del perfecto cuentista',autor:'Horacio Quiroga',fuente:'Publicado en la revista El Hogar, Buenos Aires, 1927. Dominio público.',pag:'texto nuevo',
intro:'Un decálogo es una lista de diez reglas. No tiene introducción ni conclusión: cada regla es una tesis breve. En la parte de estructura vas a clasificar las reglas.',
etiq:['Actitud del escritor','Técnica de escritura'],
est:{1:['Actitud del escritor'],3:['Actitud del escritor'],5:['Actitud del escritor'],7:['Actitud del escritor'],9:['Técnica de escritura'],11:['Técnica de escritura'],13:['Técnica de escritura'],15:['Técnica de escritura'],17:['Técnica de escritura','Actitud del escritor'],19:['Actitud del escritor','Técnica de escritura']},
tesis:{q:'¿Qué idea general sostiene el decálogo?',opts:['Escribir un buen cuento exige oficio y disciplina: aprender de los maestros, planificar, elegir cada palabra y dominar la emoción.','Para escribir bien hay que dejarse llevar por la inspiración del momento.','Los cuentos tienen que ser largos y llenos de adjetivos.','Solo los escritores europeos saben escribir cuentos.'],ok:0,exp:'La segunda opción es lo contrario de la regla IX: «No escribas bajo el imperio de la emoción».'},
explicita:{ok:'Implícita',exp:'Ninguna regla la enuncia completa: se deduce del conjunto. Cada regla es una tesis parcial.'},
profe:[
{p:1,f:'Poe, Maupassant, Kipling, Chejov',tipo:'Cita de autoridad / acumulación',n:'Los maestros del cuento.'},
{p:7,f:'Ama a tu arte como a tu novia',tipo:'Analogía',n:''},
{p:9,f:'las tres primeras líneas tienen casi la importancia',tipo:'Argumento (razón de la regla)',n:''},
{p:11,f:'Desde el río soplaba el viento frío',tipo:'Ejemplificación',n:'Un ejemplo con rima interna que, igual, no hay que cambiar.'},
{p:13,f:'Inútiles serán cuantas colas de color',tipo:'Metáfora',n:'Los adjetivos como adornos que no salvan a un sustantivo débil.'},
{p:15,f:'Ten esto por una verdad absoluta, aunque no lo sea',tipo:'Ironía / concesión',n:'Reconoce que su propia regla no es absoluta.'},
{p:17,f:'No escribas bajo el imperio de la emoción',tipo:'Regla (tesis parcial)',n:''}],
preg:[
{q:'¿Por qué el decálogo usa el imperativo («cree», «resiste», «no adjetives»)? ¿Qué efecto tiene en el lector?',pista:''},
{q:'Elegí la regla con la que más estés de acuerdo y la que menos. Argumentá por qué.',pista:''},
{q:'Escribí tu propio decálogo: «Decálogo del perfecto estudiante», «del perfecto gamer», «del perfecto compañero».',pista:'Cada regla tiene que ser una tesis breve, y si podés, con su razón.'}]},

const TEXTS={"arlt1": ["Me escribe un lector:", "\"Me interesaría muchísimo que Vd. escribiera algunas notas sobre los libros que deberían leer los jóvenes, para que aprendan y se formen un concepto claro, amplio, de la existencia (no exceptuando, claro está, la experiencia propia de la vida)\".", "## NO LE PIDE NADA EL CUERPO...", "No le pide nada a usted el cuerpo, querido lector. Pero, ¿en dónde vive? ¿Cree usted acaso, por un minuto, que los libros le enseñarán a formarse \"un concepto claro y amplio de la existencia\"? Está equivocado, amigo; equivocado hasta decir basta. Lo que hacen los libros es desgraciarlo al hombre, créalo. No conozco un solo hombre feliz que lea. Y tengo amigos de todas las edades. Todos los individuos de existencia más o menos complicada que he conocido habían leído. Leído, desgraciadamente, mucho.", "Si hubiera un libro que enseñara, fíjese bien, si hubiera un libro que enseñara a formarse un concepto claro y amplio de la existencia, ese libro estaría en todas las manos, en todas las escuelas, en todas las universidades; no habría hogar que, en estante de honor, no tuviera ese libro que usted pide. ¿Se da cuenta?", "No se ha dado usted cuenta todavía de que si la gente lee, es porque espera encontrar la verdad en los libros. Y lo más que puede encontrarse en un libro es la verdad del autor, no la verdad de todos los hombres. Y esa verdad es relativa... esa verdad es tan chiquita... que es necesario leer muchos libros para aprender a despreciarlos.", "## LOS LIBROS Y LA VERDAD", "Calcule usted que en Alemania se publican anualmente más o menos 10.000 libros, que abarcan todos los géneros de la especulación literaria; en París ocurre lo mismo; en Londres, ídem; en Nueva York, igual.", "Piense esto:", "Si cada libro contuviera una verdad, una sola verdad nueva en la superficie de la tierra, el grado de civilización moral que habrían alcanzado los hombres sería incalculable. ¿No es así? Ahora bien, piense usted que los hombres de esas naciones cultas, Alemania, Inglaterra, Francia, están actualmente discutiendo la reducción de armamentos (no confundir con supresión). Ahora bien, sea un momento sensato usted. ¿Para qué sirve esa cultura de diez mil libros por nación, volcada anualmente sobre la cabeza de los habitantes de esas tierras? ¿Para qué sirve esa cultura, si en el año 1930, después de una guerra catastrófica como la de 1914, se discute un problema que debía causar espanto?", "¿Para qué han servido los libros, puede decirme usted? Yo, con toda sinceridad, le declaro que ignoro para qué sirven los libros. Que ignoro para qué sirve la obra de un señor Ricardo Rojas, de un señor Leopoldo Lugones, de un señor Capdevilla, para circunscribirme a este país.", "## EL ESCRITOR COMO OPERARIO", "Si usted conociera los entretelones de la literatura, se daría cuenta de que el escritor es un señor que tiene el oficio de escribir, como otro de fabricar casas. Nada más. Lo que lo diferencia del fabricante de casas, es que los libros no son tan útiles como las casas, y después... después que el fabricante de casas no es tan vanidoso como el escritor.", "En nuestros tiempos, el escritor se cree el centro del mundo. Macanea a gusto. Engaña a la opinión pública, consciente o inconscientemente. No revisa sus opiniones. Cree que lo que escribió es verdad por el hecho de haberlo escrito él. El es el centro del mundo. La gente que hasta experimenta dificultades para escribirle a la familia, cree que la mentalidad del escritor es superior a la de sus semejantes y está equivocada respecto a los libros y respecto a los autores. Todos nosotros, los que escribimos y firmamos, lo hacemos para ganarnos el puchero. Nada más. Y para ganarnos el puchero no vacilamos a veces en afirmar que lo blanco es negro y viceversa. Y, además, hasta a veces nos permitimos el cinismo de reírnos y de creernos genios...", "## DESORIENTADORES", "La mayoría de los que escribimos, lo que hacemos es desorientar a la opinión pública. La gente busca la verdad y nosotros les damos verdades equivocadas. Lo blanco por lo negro. Es doloroso confesarlo, pero es así. Hay que escribir. En Europa los autores tienen su público; a ese público le dan un libro por un año. ¿Usted puede creer, de buena fe, que en un año se escribe un libro que contenga verdades? No, señor. No es posible. Para escribir un libro por año hay que macanear. Dorar la píldora. Llenar páginas de frases.", "Es el oficio, \"el métier\". La gente recibe la mercadería y cree que es materia prima, cuando apenas se trata de una falsificación burda de otras falsificaciones, que también se inspiraron en falsificaciones.", "## CONCEPTO CLARO", "Si usted quiere formarse \"un concepto claro\" de la existencia, viva.", "Piense. Obre. Sea sincero. No se engañe a sí mismo. Analice. Estúdiese. El día que se conozca a usted mismo perfectamente, acuérdese de lo que le digo: en ningún libro va a encontrar nada que lo sorprenda. Todo será viejo para usted. Usted leerá por curiosidad libros y libros y siempre llegará a esa fatal palabra terminal: \"Pero sí esto lo había pensado yo, ya\". Y ningún libro podrá enseñarle nada.", "Salvo los que se han escrito sobre esta última guerra. Esos documentos trágicos valen la pena conocerlos. El resto es papel..."], "caparros1": ["Hoy empiezan las clases y no empiezan las clases: para la mayoría de los alumnos argentinos, esta mañana no hay escuela. Los maestros de medio país van a la huelga para pedir un sueldo que ninguno de nosotros, periodistas, por ejemplo, aceptaría ni para empezar. Son sueldos tan elocuentes, tan didácticos: dicen, antes que nada, que a la sociedad argentina la educación le importa tres carajos. O, mejor: que a la sociedad argentina le importa tres carajos la educación de sus pobres.", "Soy un producto de la escuela pública argentina y a veces, cuando me distraigo, me da orgullo; mi hijo también fue a la escuela pública y acaba de terminar su quinto año. Pero en las décadas que pasaron desde que empecé primer grado –inferior– nuestro sistema educativo cambió brutalmente. Cuando yo era chico sólo iban a colegios privados los garcas que querían educarse a fuerza de hostias y los raros que preferían hablar otros idiomas y los vagos que la escuela pública no soportaba más. Pero mis amigos y yo –hijos de la clásica clase media porteña– sabíamos que el sistema de educación estatal era nuestro lugar: la escuela pública era la mejor, la primera opción. Ahora no: mis amigos dudan mucho antes de mandar a sus hijos a una escuela del Estado –y la mayoría no lo hace.", "La educación pública ya no es para todos, ni para el que la elige; es para quien no tiene más remedio. Tres de cada cuatro alumnos estatales pertenecen al tercio más pobre de la población. Entre el 20 por ciento más pobre, nueve de cada diez van a la escuela pública; entre el 20 por ciento más rico, uno de cada siete. Y la tendencia se acelera: en 1997 el 24 por ciento de los chicos acomodados iba a escuelas públicas; en 2006, según un informe del Centro de Estudios de Políticas Públicas, sólo el 15 por ciento. Las cifras precisan lo que ya sabemos: que los padres quieren mandar a sus hijos al privado porque –mejores o peores– por lo menos les garantizan que van a tener clases. Cosa que el Estado no consigue hacer. Así que, entre 2003 y 2006, en apenas tres años kirchneristas, 800.000 argentinitos –casi todos los que pueden– pasaron del público al privado. En la escuela sarmientina quedan los que no pueden: los más pobres.", "El fracaso de la educación pública es el efecto más espectacular del derrumbe del Estado argentino. Solía ser su estandarte: la forma más eficiente de producir esa relativa integración social que nos constituyó como país, en esas aulas donde, bajo los delantales blancos, las clases sociales se mezclaban por un rato y se formaban con las mismas consignas, las posibilidades brevemente emparejadas. La educación pública servía para equilibrar, para integrar, para “redistribuir” –y para producir un país más educado, con mejores posibilidades en todos los terrenos. Ahora parece como si no importara. Y, de hecho, no les importa a los que manejan el Estado: hace mucho que mandan a sus chicos a colegios privados. Es una característica de muchos estados actuales –sus dirigentes no se incluyen en ellos, no usan sus escuelas y hospitales, no le pagan impuestos, no respetan sus leyes–y es curiosa: ¿quién se imagina al gerente de la cocacola pidiéndose una pepsi?", "Así que tengo una propuesta populista para encarar la cuestión educativa. Es una ley que habría que votar cuanto antes: “Queridos gobernantes, no todo pueden ser alegrías, ganancias extraordinarias, honores merecidos, gratitud popular. Los cargos deben tener alguna carga. Y ésta será modesta pero inflexible: se ordena, so pena de prisión y pedorreta pública, que todos los funcionarios del Estado –de un nivel equis para arriba– manden a sus hijos y nietos, sin excepción, a la escuela estatal más cercana”. Es posible que, entonces, la educación pública mejore seriamente. Así estamos, en la lucha de clases."], "batlle": ["Dicen quienes desprecian al fútbol que son 22 personas corriendo detrás de una pelota y podrían argumentar aquellos que minimicen los alcances de John Wick 4 que son tres horas de tipos golpeándose y/o disparándose. No estoy con unos ni con otros. No escribiré aquí en defensa del arte del fútbol, pero sí una exaltación de los logros y hallazgos de la saga en general y de esta cuarta entrega en particular.", "El de John Wick es un caso único (o muy infrecuente) de una saga que va creciendo en todos los aspectos con el paso del tiempo. La primera película (2014) costó 20 millones de dólares, duraba 101 minutos y recaudó 86 millones en las salas de todo el mundo; la segunda (2017) duraba 122 y tuvo 172 millones de ingresos; la tercera (2019) pasó a 130 minutos, costó 75 millones y consiguió 328 millones en taquilla, mientras que esta cuarta tuvo un presupuesto de 90 millones, dura 169 minutos y seguramente tendrá la mejor recaudación de toda la franquicia.", "Semejante “inflación”, contra todos los pronósticos, no afecta sino que incluso potencia el resultado final de esta cuarta entrega. Cualquiera dirá que el corte final podría haber tenido 20, 40 o 60 minutos menos, pero es precisamente en la acumulación, en el desborde, en sus ínfulas desmedidas, que la película encuentra su aspecto distintivo, su razón de ser. De hecho, tras una primera parte impecable, pero bastante genérica, John Wick 4 alcanza en su segunda mitad (rodada en los lugares más emblemáticos de París como la Torre Eiffel, el Arco de Triunfo o la basílica de Sacré-Cœur de Montmartre) el pico no solo de esta película sino de toda la saga.", "Con muy pocos diálogos, mínimo desarrollo de personajes y excusas argumentales básicas, John Wick arranca su viaje por Nueva York, Osaka, Berlín y no se detendrá hasta el mencionado desenlace parisino. A Wick lo perseguirán por el mundo temibles organizaciones (como la denominada Mesa Alta que lidera El Marqués de Bill Skarsgård) e individuos (desde Caine, el eximio luchador no vidente de Donnie Yen, hasta el Tracker de Shamier Anderson y su feroz perro) y contará en principio con algunas ayudas: el Bowery King de Laurence Fishburne, el Shimazu de Hiroyuki Sanada y su hija, la Akira de Rina Sawayama, o el Winston del gran Ian McShane, a quien en los primeros minutos le vuelan por los aires su hotel Continental y le matan frente a sus ojos a su leal conserje Charon (Lance Reddick).", "Las influencias de John Wick son conocidas (las coreografías de Bruce Lee, la estilización de John Woo y los thrillers del cine hongkonés de la década de 1980, el neo-noir del danés Nicolas Winding Refn, pero también la saga Matrix, la estética de los videojuegos de acción, el comic y el universo animado de Tex Avery) y en esta cuarta entrega Chad Stahelski lleva esa mixtura a nuevas dimensiones con largas secuencias dentro de una discoteca, en plena calle o sobre unas escaleras; bajo el agua o en un virtuoso plano secuencia con una cámara siempre cenital.", "Y habrá un duelo con espíritu de spaghetti western a-la-Sergio Leone. Y un cierre con mucho de épica y toque romántico. Si es que efectivamente se trata del final de la saga, con John Wick 4 se termina a lo grande, como para que el universo concebido por Stahelski-Reeves quede en cuatro entregas de culto, con su propia mitología y un legado indeleble."], "forn": ["Un hombre cualquiera, al que vamos a llamar Emmanuel Carrère, está de vacaciones en un hotel en las playas de Sri Lanka, con su mujer y su hijo, cuando sobreviene el terrible tsunami de 2004. Los tres salen ilesos, pero una joven pareja que se les sentaba a la mesa de al lado en cada comida pierde a su pequeña hija. El hotel y la zona quedan aislados. Todo es atroz. Hay cientos de muertos y los vivos los tienen en sus caras. La pareja que perdió a su hija es francesa, como Carrère y su mujer; la nena muerta tenía casi la misma edad que el hijo de la mujer de Carrère. Casi sin conocerse, las dos parejas pasan a ser familia, en la aciaga tarea de recuperar el cadáver y dar sostén y acompañar en el dolor. Están tan íntimamente próximas y tan radicalmente distanciadas como es posible estarlo: una pareja salió ilesa, a la otra le pasó lo peor. En determinado momento, en una caótica sala de hospital, mientras esperan por el cadáver de la niña, asisten al encuentro de una mujer con el esposo que creía muerto. La sala entera queda en silencio contemplando cómo ese hombre y esa mujer se tocan el rostro y se miran atónitos a los ojos y lloran. Incluso la pareja que ha perdido a su hija se queda contemplando la escena, por un instante idos de su terrible realidad. Cuando Carrère y su mujer se echan a descansar por primera vez, horas antes de abordar el avión que los devuelva a Francia, lo único que puede pensar él, como un mantra protector, es un anhelo desesperado: que un día esa mujer a la que abraza sea vieja, y él también, y siga queriéndola. Que sigan vivos, que sigan juntos, como en esa cama, en ese momento.", "Dos meses después, ya en París, la mujer de Carrère recibe la noticia de que su hermana menor tiene cáncer, y es fulminante y sin esperanzas. La hermana tiene 38 años, marido y tres hijas pequeñas. Es jueza en una pequeña ciudad de provincia. Es, además, feliz. A los quince años zafó del primer zarpazo del cáncer, pero ese zarpazo le llevó una pierna. Eso definió su vida. Se hundió en los libros de Derecho, creyó que no tenía posibilidad de ser feliz hasta que apareció alguien que no la quería porque fuera lisiada ni a pesar de que fuera lisiada: simplemente la quería. El Derecho y ese hombre que le dio tres hijas son la vida de ella. Una vida pequeña, burguesa, de provincia, que acaba de entrar en brutal y acelerada cuenta regresiva. Los médicos le han explicado cómo será. La joven jueza encara su muerte con la parsimonia con que encaró cada juicio que le tocó presidir. Carrère y su mujer asisten a ese rito de despedida: llegan para verla despedirse paso a paso de sus pequeñas hijas y morir abrazada por el hombre que la amó totalmente (a quien ella le pide: “Diles que luché, que hice todo lo que pude para no dejarlas”).", "Carrère tuvo delante, en breves meses, las dos cosas que más miedo dan en este mundo: la muerte de una hija pequeña para sus padres y la muerte de una mujer joven para su marido y sus hijos. “La vida me hizo testigo de esas desgracias una tras otra y me encomendó, o al menos así lo he entendido, dar testimonio de ello.” ¿Por qué dice eso Carrère? Porque, después del entierro de la jueza, conoce a un colega de la difunta, un hombre que es de la edad de ella y es juez como ella, y está felizmente casado y tiene hijos pequeños como ella, y es lisiado y víctima del cáncer como ella: ese hombre convoca a la familia para explicarles qué clase de juez fue la jueza y cómo fue la vida para ella, tal como se la confesó a la única persona en el mundo a quien podía contarle todo sin temer despertar lástima, compasión. La manera en que ese hombre les habla “no era serenidad, ni sabiduría, ni dominio de sí mismo, sino una forma de apoyarse en su miedo y desplegarlo. Era todo lo que siendo él no era él: lo que lo superaba, lo inspiraba, lo maltrataba y lo salvaba, y a lo que poco a poco había aprendido a dejar actuar”.", "Hay experiencias que nos enseñan algo inequívocamente. Incluso la vecindad con ciertas experiencias puede enseñarnos algo inequívocamente. Es asombroso que eso pueda ocurrir a través de la palabra. Eso es lo que siente Carrère cuando lo ve ocurrir delante de sus ojos, en las palabras de ese joven juez lisiado. Porque ese hombre que mira a la muerte de frente habla como debería hablar la literatura, como alguna vez habló. Así intenta Carrère que hable el libro que escribe, un libro que en francés se llamó De otras vidas que la mía (en castellano se llama, más escuetamente, De vidas ajenas). Viene la desgracia y pasa su guadaña y qué queda. Hay una escena en el libro en que la jueza lisiada entra por primera vez en la oficina del juez lisiado. Al verla, éste se sonríe y se alza de su escritorio con sus muletas, para que las vea la mujer en muletas que tiene enfrente. Carrère dice: “Se reconocieron al instante”. Yo creo hace mucho en las hermandades que produce la desgracia: el nivel de comunicación casi absoluta que se da de pronto entre hermanos de desgracia. Carrère encuentra nombre a lo que estuvo asistiendo, a través de las palabras de aquel juez. Se reconoce al instante, como se reconocieron esos dos jueces. Se siente adentro de la escena, como todos aquellos que miraban a la pareja reencontrada en aquel hospital de Sri Lanka, como la familia de su mujer mirando a la jueza decir a su marido, poco antes de partir por última vez al hospital, cuando la hija menor, que es un bebé, pide que la alce la madre: “No tiene que acostumbrarse a mí porque después me echará más en falta”.", "Hay ciertos libros capaces de producir lo mismo que nos hace la desgracia, la enfermedad, la muerte, cuando nos pasa cerca, cuando nos semblantea. En ambos casos hacen que nos importe más lo que nos asemeja a las demás personas que lo que nos distingue de ellas. Quizá sea imposible vivir ahí siempre, o incluso estar ahí seguido, pero cuando ocurre es estremecedor, nos queda grabado en el adn. Lo que nos asemeja a los demás por encima de lo que nos distingue de ellos. Lo que aprendemos entre todos es lo más valioso que se puede aprender, porque no lo sabemos solos: sabemos que otro lo sabe también. Esa ceremonia logra Carrère que ocurra en su libro. El juez, la jueza, su viudo con tres hijas pequeñas, la pareja que perdió a su hijita, el aleteo de esa mariposa negra que es la desgracia, y nosotros, los demás. Hay otras vidas que no son la nuestra.", "Si van a leer un solo libro este año, que sea éste."], "karakas": ["Me siento obligado a señalar las engañosas analogías y la incorrecta información histórica que se menciona en el artículo “La gran novela del genocidio armenio”, escrito por Marcos Aguinis y publicado en LA NACION el 12 de marzo. Allí, Aguinis intenta trazar un paralelismo entre el Holocausto y los acontecimientos de 1915. En lugar de hacer analogías directas entre los dos acontecimientos de la historia, Aguinis optó por un enfoque más sutil.", "Los turcos no niegan el sufrimiento de los armenios durante la Primera Guerra Mundial. Muchos armenios murieron o fueron asesinados en ese trágico período. Sin embargo, sin duda muchos más turcos perecieron en el período previo y durante esa guerra. El hecho es que los acontecimientos de 1915 son incomparables a lo que sucedió en Alemania entre 1933 y 1945. Es éticamente problemático y sumamente injusto, tanto para los turcos como para los judíos, tratar de establecer una analogía entre el Holocausto, un fenómeno reconocido a nivel mundial, y los eventos de 1915, sobre los cuales continúa una genuina controversia histórica. Las diferencias entre los dos en términos de naturaleza, propósito y alcance son tan amplias que hacer una comparación resulta altamente problemático.", "El autor menciona la repetida frase atribuida a Hitler (“¿Quién se acuerda del genocidio armenio?”). No hay ninguna evidencia verdadera disponible de que Hitler se haya referido a los armenios de esa manera. De hecho, los juicios de Nuremberg rechazaron todo documento que incluyera cualquier expresión parecida atribuida a Hitler. Además, de haber realizado Hitler esa declaración, ¿deberían sus ideas personales sobre temas específicos ser tomadas como referencia para avanzar en un argumento? De hecho, la supuesta declaración de Hitler es tan poco confiable que hoy es solamente utilizada por aquellos que quieren influir en audiencias desinformadas.", "A menudo se olvida que el genocidio es un delito específico definido por la ley internacional. La Convención de 1948 nos dice qué es genocidio y cómo puede determinarse: un tribunal internacional competente puede establecer si un evento es un genocidio. Ese fallo judicial existe para el Holocausto, Ruanda y Srebrenica. Sin embargo, ningún fallo de este tipo existe para 1915.", "El Holocausto se basó en una ideología racista; se nutrió del antisemitismo que prevaleció en Europa durante siglos. Los judíos no se habían rebelado contra el gobierno alemán, no habían cooperado con las potencias extranjeras contra Alemania, no habían traicionado al ejército alemán y tampoco constituían una amenaza para el Estado alemán. Las mismas observaciones no se pueden aplicar a los grupos militantes armenios del Imperio Otomano que cooperaron con los ejércitos invasores.", "Los judíos fueron aniquilados en una consciente, planificada, coordinada y sistemática campaña de desgaste. Durante la reubicación de la población armenia, el Imperio Otomano tomó medidas de seguridad para proteger las caravanas. El gobierno otomano condenó y castigó severamente a alrededor de 2000 administradores civiles y militares que dañaron o maltrataron a los armenios durante su reubicación. Por el contrario, los judíos fueron matados donde estuviesen y quienes protegían a los judíos fueron castigados severamente.", "Los acontecimientos de 1915 no son comparables con el Holocausto. Ambas partes sufrieron en este período. A los armenios les gustaría establecer su narrativa nacional como la verdad indiscutible, pero esto no conduce a la reconciliación. Los turcos y los armenios deben trabajar para reconstruir la amistad histórica que existía desde hace siglos, hasta finales del siglo XIX y principios del XX, sin olvidar los momentos difíciles de su pasado común. El diálogo y los estudios académicos conjuntos entre las dos naciones son esenciales para resolver este tema controversial."], "tokatlian": ["La nota publicada el 26 de abril por LA NACION y escrita por el embajador de Turquía en la Argentina, Taner Karakas, en torno al genocidio armenio es un escrito inquietante para los argentinos descendientes de armenios y para todos aquellos que, desde diferentes orillas ideológicas, partidistas y sociales creemos que la defensa y la promoción de los derechos humanos es un pilar de la convivencia nacional, un compromiso ineludible de la política exterior y un imperativo de la comunidad internacional.", "El señor Karakas pretende desconocer las múltiples evidencias sólidas que afirman que lo que ocurrió entre 1915-1924 a los armenios en el Imperio Otomano, y en Turquía como Estado sucesor, fue un genocidio en términos de la Convención de 1948. El señor Karakas no menciona el hecho de que en varios países (entre ellos, la Argentina), tanto los Ejecutivos como los legislativos y algunos jueces han reconocido explícitamente que lo ocurrido entre 1915-24 fue un genocidio. El señor Karakas se permite dudar de la frase de Hitler (“¿Quién se acuerda del genocidio armenio?”) a pesar de que hay fundadas evidencias de que Hitler conoció lo sucedido al pueblo armenio y varios alemanes (Max Erwin von Scheubner-Richter, Karl Dönitz, Hans von Seeckt y Rudolf Höss, por ejemplo) que años más tarde apoyaron o rodearon al Führer estuvieron en Turquía durante los años del genocidio armenio. El señor Karakas procura, mediante una comparación opaca y sofística, separar las vivencias genocidas que en distintas circunstancias históricas sufrieron judíos y armenios.", "A pesar de que es claro que los argumentos anteriores forman parte de la lógica de la diplomacia turca es inadmisible y alarmante que para sostenerlos señale que los armenios, a diferencia de los judíos, habrían sido merecedores de su destino por su supuesta cooperación “con los ejércitos invasores”, lo que es una falacia.", "Este argumento significa un escalamiento en la política de negación del genocidio por parte de Turquía. No es suficiente la negación; ahora se trata de tergiversar los hechos históricos. “Algo habrán hecho” era el mensaje de la última dictadura argentina para legitimar su política de tortura, desaparición y muerte. Esa noción supo calar en algunos sectores de la sociedad argentina. El señor Karakas transmite hoy el mismo mensaje ominoso: algo hicieron los armenios.", "Es posible que se crea que sus palabras sólo deben ser repudiadas por los argentinos descendientes de armenios. Sin embargo, creerlo sería pensar que la tentación genocida, en muchas latitudes, es cosa del pasado."], "melikian": ["En un artículo reciente, bajo el título “El genocidio, un delito definido por la ley”, el embajador de Turquía Taner Karakas apela a variados recursos para demostrar que el exterminio de 1.500.000 armenios por parte del Imperio Otomano no fue un genocidio.", "La verdad histórica es que hace 98 años se cometió un crimen diabólico contra el pueblo armenio, que vivía pacíficamente en la cuna de su nacionalidad. Ese crimen sería caracterizado y definido varias décadas después, en 1944, por el jurista polaco Rafael Lemkin, quien, al crear el término genocidio, intentaba describir y definir la política nazi de asesinatos y violaciones, así como las atrocidades cometidas en 1915 contra los armenios.", "En 1948, la ONU adoptó la Convención sobre Prevención y Castigo del Delito de Genocidio, definido como un crimen internacional, y desde entonces, los países miembros de la convención están obligados a prevenir, así como a castigar a los que cometen un crimen de esa naturaleza.", "El plan de exterminio y destierro del pueblo armenio fue trazado y ejecutado fríamente por el gobierno del Imperio Otomano y hoy se inscribe entre los ejemplos más claros del terrorismo de Estado. El objetivo era uno solo: el gobierno de los Jóvenes Turcos, para preservar los restos del debilitado Imperio Otomano, dio nacimiento a la ideología del panturquismo, es decir, la constitución de un inmenso imperio cuyas fronteras llegarían hasta China y abarcaría a todos los pueblos de habla turca del Cáucaso y de Asia Central. El plan preveía también la turquificación de todas las minorías nacionales. La población armenia era considerada el principal obstáculo en ese camino.", "Preparado detalladamente, el plan se ejecutó en varias etapas. La primera etapa comenzó con la eliminación de cientos de intelectuales armenios el 24 de abril de 1915. La segunda fue el reclutamiento de más de 60.000 armenios para el ejército otomano, que fueron asesinados por sus compañeros de armas turcos. La tercera parte del genocidio se caracterizó por la matanza y el destierro de mujeres, ancianos y niños hacia los desiertos de Siria, donde miles de ellos murieron de hambre y enfermedades. Decenas de miles de armenios cristianos fueron islamizados por la fuerza. La última etapa del genocidio está definida por la negación de las deportaciones y del plan de exterminio por parte del gobierno turco.", "Esa política de negacionismo continúa hasta hoy, como lo prueba el artículo del embajador Taner Karakas. La negación es la continuación más directa del genocidio, un hecho innegable que, tarde o temprano, obligará a Turquía a enfrentarse con su pasado y saldar cuentas con la historia.", "Se podría haber esperado del embajador turco un mínimo respeto a la memoria de los armenios víctimas del genocidio, decenas de miles de cuyos descendientes hoy viven en la Argentina.", "El reconocimiento y la condena del genocidio de 1915-1923, por los cuales lucha todo el pueblo armenio unido, no constituyen un fin en sí mismos. Es un permanente mensaje a la comunidad internacional destinado a prevenir futuros crímenes, impedir la repetición de los ya cometidos y detener nuevos intentos, porque el genocidio no es un crimen contra tal o cual nación, sino contra toda la humanidad."], "swift": ["Es un asunto melancólico para quienes pasean por esta gran ciudad o viajan por el campo, ver las calles, los caminos y las puertas de las cabañas atestados de mendigos del sexo femenino, seguidos de tres, cuatro o seis niños, todos en harapos e importunando a cada viajero por una limosna. Esas madres, en vez de hallarse en condiciones de trabajar para ganarse la vida honestamente, se ven obligadas a perder su tiempo en la vagancia, mendigando el sustento de sus desvalidos infantes: quienes, apenas crecen, se hacen ladrones por falta de trabajo. (...)", "Creo que todos los partidos están de acuerdo en que este número prodigioso de niños en los brazos, sobre las espaldas o a los talones de sus madres, y frecuentemente de sus padres, resulta en el deplorable estado actual del Reino un perjuicio adicional muy grande; y por lo tanto, quienquiera que encontrase un método razonable, económico y fácil para hacer de ellos miembros cabales y útiles del estado, merecería tanto agradecimiento del público como para tener instalada su estatua como protector de la Nación.", "(...)", "Por mi parte, habiendo volcado mis pensamientos durante muchos años sobre este importante asunto, y sopesado maduradamente los diversos planes de otros proyectistas, siempre los he encontrado groseramente equivocados en su cálculo. Es cierto que un niño recién nacido puede ser mantenido durante un año solar por la leche materna y poco alimento más; a lo sumo por un valor no mayor de dos chelines o su equivalente en mendrugos, que la madre puede conseguir ciertamente mediante su legítima ocupación de mendigar. Y es exactamente al año de edad que yo propongo que nos ocupemos de ellos de manera tal que en lugar de constituir una carga para sus padres o la parroquia, o de carecer de comida y vestido por el resto de sus vidas, contribuirán por el contrario a la alimentación, y en parte a la vestimenta, de muchos miles.", "Hay además otra gran ventaja en mi plan, que evitará esos abortos voluntarios y esa práctica horrenda, ¡cielos!, ¡demasiado frecuente entre nosotros!, de mujeres que asesinan a sus hijos bastardos, sacrificando a los pobres bebés inocentes, no sé si más por evitar los gastos que la vergüenza, lo cual arrancaría las lágrimas y la piedad del pecho más salvaje e inhumano.", "El número de almas en este reino se estima usualmente en un millón y medio, de éstas calculo que puede haber aproximadamente doscientas mil parejas cuyas mujeres son fecundas; de ese número resto treinta mil parejas capaces de mantener a sus hijos, aunque entiendo que puede no haber tantas bajo las actuales angustias del reino; pero suponiéndolo así, quedarán ciento setenta mil parideras. Resto nuevamente cincuenta mil por las mujeres que abortan, o cuyos hijos mueren por accidente o enfermedad antes de cumplir el año. Quedan sólo ciento veinte mil hijos de padres pobres nacidos anualmente: la cuestión es entonces, cómo se educará y sostendrá a esta cantidad, lo cual, como ya he dicho, es completamente imposible, en el actual estado de cosas, mediante los métodos hasta ahora propuestos. Porque no podemos emplearlos ni en la artesanía ni en la agricultura; ni construimos casas (quiero decir en el campo) ni cultivamos la tierra: raramente pueden ganarse la vida mediante el robo antes de los seis años, excepto cuando están precozmente dotados. (...)", "Propondré ahora por lo tanto humildemente mis propias reflexiones, que espero no se prestarán a la menor objeción.", "Me ha asegurado un americano muy entendido que conozco en Londres, que un tierno niño sano y bien criado constituye al año de edad el alimento más delicioso, nutritivo y saludable, ya sea estofado, asado, al horno o hervido; y no dudo que servirá igualmente en un fricasé o un ragout.", "Ofrezco por lo tanto humildemente a la consideración del público que de los ciento veinte mil niños ya calculados, veinte mil se reserven para la reproducción, de los cuales sólo una cuarta parte serán machos; lo que es más de lo que permitimos a las ovejas, las vacas y los puercos; y mi razón es que esos niños raramente son frutos del matrimonio, una circunstancia no muy estimada por nuestros salvajes, en consecuencia un macho será suficiente para servir a cuatro hembras. De manera que los cien mil restantes pueden, al año de edad, ser ofrecidos en venta a las personas de calidad y fortuna del reino; aconsejando siempre a las madres que los amamanten copiosamente durante el último mes, a fin de ponerlos regordetes y mantecosos para una buena mesa. Un niño llenará dos fuentes en una comida para los amigos; y cuando la familia cene sola, el cuarto delantero o trasero constituirá un plato razonable, y sazonado con un poco de pimienta o de sal después de hervirlo resultará muy bueno hasta el cuarto día, especialmente en invierno.", "He calculado que como término medio un niño recién nacido pesará doce libras, y en un año solar, si es tolerablemente criado, alcanzará las veintiocho.", "Concedo que este manjar resultará algo costoso, y será por lo tanto muy apropiado para terratenientes, quienes, como ya han devorado a la mayoría de los padres, parecen acreditar los mejores derechos sobre los hijos.", "(...)", "Ya he calculado el costo de crianza de un hijo de mendigo (entre los que incluyo a todos los cabañeros, a los jornaleros y a cuatro quintos de los campesinos) en unos dos chelines por año, harapos incluidos; y creo que ningún caballero se quejaría de pagar diez chelines por el cuerpo de un buen niño gordo, del cual, como he dicho, sacará cuatro fuentes de excelente carne nutritiva cuando sólo tenga a algún amigo o a su propia familia a comer con él. De este modo, el hacendado aprenderá a ser un buen terrateniente y se hará popular entre los arrendatarios; y la madre tendrá ocho chelines de ganancia limpia y quedará en condiciones de trabajar hasta que produzca otro niño.", "Quienes sean más ahorrativos (como debo confesar que requieren los tiempos) pueden desollar el cuerpo; con la piel, artificiosamente preparada, se podrán hacer admirables guantes para damas y botas de verano para caballeros elegantes.", "En nuestra ciudad de Dublín, los mataderos para este propósito pueden establecerse en sus zonas más convenientes, y podemos estar seguros de que carniceros no faltarán; aunque más bien recomiendo comprar los niños vivos y adobarlos mientras aún están tibios del cuchillo, como hacemos para asar los cerdos.", "(...)", "Algunas personas de espíritu agorero están muy preocupadas por la gran cantidad de pobres que están viejos, enfermos o inválidos, y me han pedido que dedique mi talento a encontrar el medio de desembarazar a la nación de un estorbo tan gravoso. Pero este asunto no me aflige en absoluto, porque es muy sabido que esa gente se está muriendo y pudriendo cada día por el frío y el hambre, la inmundicia y los piojos, tan rápidamente como se puede razonablemente esperar. Y en cuanto a los trabajadores jóvenes, están en una situación igualmente prometedora; no pueden conseguir trabajo y desfallecen de hambre, hasta tal punto que si alguna vez son tomados para un trabajo común no tienen fuerza para cumplirlo; y entonces el país y ellos mismos son felizmente librados de los males futuros.", "He divagado excesivamente, de manera que volveré al tema. Me parece que las ventajas de la proposición que he enunciad
