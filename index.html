function copy(txt,msgEl){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{if(msgEl)msgEl.textContent=' ¡Copiado!'}).catch(()=>{if(msgEl)msgEl.textContent=' No se pudo copiar: seleccioná el texto a mano.'})}

/* Taller */
let talId=null;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function analiza(txt){
  const n=norm(txt),words=(txt.match(/\S+/g)||[]).length;
  const con=CONN_DETECT.filter(c=>new RegExp('(^|[^a-zñ])'+norm(c)+'([^a-zñ]|$)').test(n));
  return {words,con,preg:(txt.match(/¿[^?]+\?/g)||[]).length,conc:/(si bien|aunque|es cierto que|es verdad que|a pesar de)/.test(n),refu:/(no es cierto|es falso|no es verdad|no es asi)/.test(n),
    cita:/(segun|como dice|como afirma|de acuerdo con|«|")/.test(n),dato:/\d/.test(n),ej:/(por ejemplo|tal es el caso|como ocurre)/.test(n),ana:/(es como|se parece a|igual que)/.test(n)};
}
V.taller=()=>{
  if(!talId){
    M.innerHTML=`${head('taller','Elegí qué querés escribir. Cada plantilla te guía paso a paso y, mientras escribís, te muestra qué recursos estás usando. Lo que escribas se guarda en este dispositivo.')}
    <div class="lgrid">${TALLER.map(t=>{const has=Object.values(S.taller[t.id]||{}).some(v=>v&&v.trim());return `<button class="lcard" data-id="${t.id}"><span class="tag">${has?'Empezado':'Nuevo'}</span><b>${esc(t.titulo)}</b><em>${esc(t.bajada)}</em></button>`}).join('')}</div>`;
    M.querySelectorAll('.lcard').forEach(b=>b.onclick=()=>{talId=b.dataset.id;V.taller();scrollTo(0,0)});return;
  }
  const T=TALLER.find(t=>t.id===talId),D=S.taller[T.id]||(S.taller[T.id]={}),C=S.checks[T.id]||(S.checks[T.id]={});
  M.innerHTML=`<button class="btn lnk back">← Todas las plantillas</button><h2 style="margin-top:6px">${esc(T.titulo)}</h2><p class="lead">${esc(T.bajada)}</p>
  ${T.temas?`<p class="small" style="margin:0;font-weight:700">Ideas para arrancar (tocá una):</p><div class="temas">${T.temas.map(x=>`<button>${esc(x)}</button>`).join('')}</div>`:''}
  <div class="tgrid"><div>${T.pasos.map((p,n)=>`<div class="paso"><label for="f-${p.k}"><i>${n+1}</i>${esc(p.l)}</label>${p.a?`<p>${esc(p.a)}</p>`:''}<textarea id="f-${p.k}" data-k="${p.k}" rows="${p.r}" placeholder="${esc(p.ph)}">${esc(D[p.k]||'')}</textarea></div>`).join('')}
  <div class="panel check"><h3>Antes de entregar, revisá</h3>${T.check.map((c,i)=>`<label><input type="checkbox" data-i="${i}" ${C[i]?'checked':''}> ${esc(c)}</label>`).join('')}</div></div>
  <div class="sticky2"><div class="panel"><h3>Devolución automática</h3><div id="an"></div></div><h3 style="margin:20px 0 12px">Tu texto</h3><div class="hoja" id="hoja"></div>
  <div class="row" style="margin-top:18px"><button class="btn cp">Copiar el texto</button><span class="small cpm"></span><button class="btn lnk del">Borrar todo</button></div></div></div>`;
  $('.back').onclick=()=>{talId=null;V.taller();scrollTo(0,0)};
  M.querySelectorAll('.temas button').forEach(b=>b.onclick=()=>{const tx=b.textContent;
    if(T.id==='opinion'){D._tema=tx;$('.lead').textContent='Tema elegido: '+tx}
    else{const k=T.pasos[0].k,f=$('#f-'+k);if(!f.value.trim()){f.value=T.id==='swift'?'Una modesta proposición para '+tx.charAt(0).toLowerCase()+tx.slice(1):tx;D[k]=f.value}else f.focus()}
    save();upd()});
  const assemble=()=>{const tit=T.pasos.find(p=>p.k==='titulo'||p.k==='eslogan');const h=tit&&!T.orden.includes(tit.k)&&D[tit.k]?D[tit.k].trim():'';
    return {h,body:T.orden.map(k=>(D[k]||'').trim()).filter(Boolean).join('\n\n')}};
  const upd=()=>{const {h,body}=assemble();$('#hoja').innerHTML=(h?`<h3>${esc(h)}</h3>`:'')+(body?esc(body):'<span class="vacio">Acá va a ir apareciendo tu texto a medida que completes los pasos.</span>');
    const a=analiza(body),tips=[];
    if(a.words<80&&a.words>0)tips.push('Todavía es corto: desarrollá más los argumentos.');
    if(['opinion','carta','swift'].includes(T.id)){if(!a.conc&&!a.refu)tips.push('Probá agregar una concesión («si bien…», «es cierto que…, pero…») o una refutación.');
      if(a.con.length<3)tips.push('Usá más conectores para ordenar y relacionar las ideas.');
      if([a.preg,a.cita,a.dato,a.ej,a.ana,a.conc,a.refu].filter(Boolean).length<3&&a.words>40)tips.push('Variá los tipos de argumentos: ¿un dato, una analogía, una pregunta retórica?')}
    $('#an').innerHTML=`<p class="small" style="margin:0 0 6px"><b>${a.words}</b> palabras</p>
    <div class="chipsF">${[['Pregunta retórica',a.preg],['Concesión',a.conc],['Refutación',a.refu],['Cita o voz ajena',a.cita],['Datos o cifras',a.dato],['Ejemplo',a.ej],['Analogía',a.ana]].map(([l,v])=>`<span class="${v?'c':''}">${v?'✓':'○'} ${l}</span>`).join('')}</div>
    <p class="small" style="margin:8px 0 4px"><b>Conectores que usaste (${a.con.length}):</b> ${a.con.length?esc(a.con.join(', ')):'ninguno todavía'}</p>
    ${tips.length?`<ul class="small" style="margin:6px 0 0;padding-left:18px">${tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:(a.words>80?'<p class="small" style="margin:6px 0 0">Bien variado. Releelo en voz alta antes de entregarlo.</p>':'')}
    <p class="small" style="margin:8px 0 0">La detección es automática y aproximada: es una ayuda, no una nota.</p>`};
  M.querySelectorAll('.paso textarea').forEach(t=>t.oninput=()=>{D[t.dataset.k]=t.value;save();upd()});
  M.querySelectorAll('.check input').forEach(c=>c.onchange=()=>{C[c.dataset.i]=c.checked;save()});
  $('.cp').onclick=()=>{const {h,body}=assemble();copy((h?h+'\n\n':'')+body,$('.cpm'))};
  $('.cp').closest('.row').after(entregaBtn('taller',T.titulo,()=>{const {h,body}=assemble();return (h?h+'\n\n':'')+body},()=>{const a=analiza(assemble().body);return `${a.words} palabras · ${a.con.length} conectores · revisión: ${T.check.filter((c,i)=>C[i]).length}/${T.check.length}`}));
  const del=$('.del');del.onclick=()=>confirmIn(del,'¿Borrar todo lo escrito?',()=>{S.taller[T.id]={};S.checks[T.id]={};save();V.taller()});
  if(T.id==='opinion'&&D._tema)$('.lead').textContent='Tema elegido: '+D._tema;
  upd();
};

function cardHTML(a,opts={}){
  const got=S.album[a.key];

function popFig(key){

}
function unlock(key){if(S.album[key])return;S.album[key]=1;S.xp+=25;save();meBar();setTimeout(()=>popFig(key),350)}
function hit(key){
  if(!key)return;const n=(S.hits[key]=(S.hits[key]||0)+1);
  if(n===NEED)unlock(key);else if(n>NEED&&(n-NEED)%NEED===0){S.reps++;toast('¡Figurita repetida! Ganaste un comodín 50/50.')}

}

}

/* ---- generador con semilla (para el desafío del día) ---- */
const hashS=s=>{let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0};
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const sshuf=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const hoy=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires'}).format(new Date());
const diaMas=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
function rachaDias(){let d=hoy(),n=0;if(!S.diario[d])d=diaMas(d,-1);while(S.diario[d]){n++;d=diaMas(d,-1)}return n}
const codigo=(nom,d,p)=>{const h=hashS(norm(nom||'anon').trim()+'|'+d+'|'+p).toString(36).toUpperCase();return h.slice(-4).padStart(4,'X')};

/* opciones y enunciados compartidos por desafíos */
function mixItem(kind,it,r){
  const R=r||Math.random;const sh=a=>r?sshuf(a,r):shuf(a);
  if(kind==='arg'){const o=sh(Object.keys(ARG_TIPOS).filter(k=>!it.ok.includes(k))).slice(0,3);return sh([it.ok[0],...o]).map(v=>({v,l:ARG_TIPOS[v]}))}
  if(kind==='fal'){const o=sh(Object.keys(FAL_TIPOS).filter(k=>!it.ok.includes(k))).slice(0,3);return sh([it.ok[0],...o]).map(v=>({v,l:FAL_TIPOS[v]}))}
  if(kind==='gen'){const o=sh(GENEROS_OPC.filter(k=>k!==it.ok)).slice(0,3);return sh([it.ok,...o]).map(v=>({v,l:v}))}
  return sh(it.opts.map((l,k)=>({l,v:k})));
}
const qMix=it=>it._k==='teo'?`<p class="qask">${esc(it.q)}</p>`:it._k==='con'?`<p class="qask">¿Qué conector completa la oración?</p><p class="qtext">${esc(it.t).replace('___','<b style="display:inline-block;border-bottom:3px solid var(--c);width:5em"> </b>')}</p>`:`<p class="qask">${it._k==='arg'?'¿Qué tipo de argumento es?':it._k==='fal'?'¿Qué problema tiene este argumento?':'¿Qué tipo de texto es?'}</p><p class="qtext">«${esc(it.t)}»</p>`;
const okMix=(it,v)=>it._k==='arg'||it._k==='fal'?it.ok.includes(v):v===it.ok;
const catMix=(it,v)=>it._k==='arg'?'a:'+v:it._k==='fal'&&v!=='valida'?'f:'+v:null;

function dDia(el){

    <h3 style="margin:2px 0 4px">Cinco preguntas, las mismas para todo el curso</h3><p class="small" style="margin:0">Un intento por día. Completarlo suma 30 puntos extra y alarga tu racha de días.</p></div>

    <p style="font-weight:600">Ya jugaste el desafío de hoy. Mañana hay otro.</p><p class="small">Para comparar con tus compañeros, mostrá este código:</p><div class="code">${done.p}/5 · ${codigo(S.nombre,d,done.p)}</div>
    ${S.nombre?'':'<p class="small">Escribí tu nombre en el inicio para que el código sea tuyo.</p>'}</div>`;return}
  const r=rng(hashS('argumentar|'+d));
  const pool=[...sshuf(ARGS,r).slice(0,2).map(a=>({_k:'arg',...a})),...sshuf(FALACIAS,r).slice(0,2).map(a=>({_k:'fal',...a})),
    ...sshuf([...CONECTORES.map(a=>({_k:'con',...a})),...GENEROS.map(a=>({_k:'gen',...a}))],r).slice(0,1)];
  const items=sshuf(pool,r),opts=new Map(items.map(it=>[it,mixItem(it._k,it,r)]));
  el.innerHTML=header+'<div id="dq" style="margin-top:18px"></div>';
  quiz($('#dq'),items,{key:null,daily:1,q:qMix,opts:it=>opts.get(it),isOk:okMix,cat:catMix,exp:it=>it.exp,
    onEnd:p=>{S.diario[d]={p};S.xp+=30;save();meBar();setTimeout(()=>dDia(el),50)},restart:()=>dDia(el)});
}
function dFinal(el){
  el.insertAdjacentHTML('beforebegin','<p class="lead">Quince preguntas al azar de todos los módulos. Tu mejor marca se guarda.</p>');
  const pool=[...shuf(ARGS).slice(0,4).map(a=>({_k:'arg',...a})),...shuf(FALACIAS).slice(0,4).map(a=>({_k:'fal',...a})),...shuf(CONECTORES).slice(0,2).map(a=>({_k:'con',...a})),
    ...shuf(GENEROS).slice(0,2).map(a=>({_k:'gen',...a})),...shuf(TEORIA).slice(0,2).map(t=>({_k:'teo',id:t.id,...t.prueba})),...shuf(POL_PREG).slice(0,1).map(a=>({_k:'teo',...a}))];

function dJefes(el){
  el.innerHTML=`<p class="lead">Cada jefe te discute con falacias. Detectá cuál usa: cada acierto le baja la credibilidad; cada error te cuesta un corazón. Tenés tres. Si lo vencés, va a tu álbum.</p>
  <div class="jgrid">${JEFES.map(j=>{const w=S.jefes[j.id];return `<button class="jcard" data-id="${j.id}" style="--jc:${j.c};--jc2:${j.c2}"><svg viewBox="0 0 120 120">${j.art}</svg><b>${esc(j.n)}</b><span>${esc(j.lema)}</span><em>${w?'Vencido · revancha':'¡A pelear!'}</em></button>`}).join('')}</div>`;
  el.querySelectorAll('.jcard').forEach(b=>b.onclick=()=>pelea(el,JEFES.find(j=>j.id===b.dataset.id)));

function pelea(el,J){
  const HP=5;let hp=HP,vidas=3,lines=shuf(J.lineas),i=0,dicho=J.intro,estado='juega';
  const R=document.documentElement.style;R.setProperty('--c',J.c);R.setProperty('--c2',J.c2);R.setProperty('--ct',`color-mix(in srgb, ${J.c} 12%, var(--paper))`);
  const draw=(fb)=>{
    const it=lines[i%lines.length];
    const pool=shuf(Object.keys(FAL_TIPOS).filter(k=>!it.ok.includes(k)&&k!=='valida'));
    const opts=it.ok[0]==='valida'?shuf(['valida',...pool.slice(0,3)]):shuf([it.ok[0],'valida',...pool.slice(0,2)]);
    el.innerHTML=`<button class="btn lnk volver">← Todos los jefes</button>
    <div class="arena" style="--jc:${J.c}">
      <div class="boss"><div class="bav ${fb==='hit'?'hurt':fb==='miss'?'laugh':''}"><svg viewBox="0 0 120 120">${J.art}</svg></div>
        <div class="bstat"><b>${esc(J.n)}</b><span class="small">Credibilidad</span><div class="hp"><i style="width:${hp/HP*100}%"></i></div></div></div>
      <div class="bubble">${esc(dicho)}</div>
      <div class="you"><span class="small" style="font-weight:700">Vos</span><span class="hearts">${[0,1,2].map(k=>`<svg viewBox="0 0 24 24" class="${k<vidas?'on':''}"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z"/></svg>`).join('')}</span></div>
      ${estado==='juega'?`<div class="qcard"><p class="qask">${esc(J.n)} dice:</p><p class="qtext">«${esc(it.t)}»</p><p class="qask">¿Qué falacia usa?</p>
        <div class="opts">${opts.map(v=>`<button class="opt" data-v="${v}">${esc(FAL_TIPOS[v])}</button>`).join('')}</div></div>`:
      `<div class="qcard result"><div class="score" style="font-size:44px">${estado==='gano'?'¡Ganaste!':'Perdiste'}</div><p>${estado==='gano'?`+50 puntos${S.album['j:'+J.id]?'':' y una figurita nueva'}.`:'Repasá las falacias y volvé a intentarlo.'}</p>
        <div class="row"><button class="btn otra">Revancha</button><button class="btn sec volver2">Otros jefes</button></div></div>`}
    </div>`;
    $('.volver',el).onclick=()=>{route()};
    if(estado!=='juega'){$('.otra',el).onclick=()=>pelea(el,J);$('.volver2',el).onclick=()=>route();return}
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const v=b.dataset.v,ok=it.ok.includes(v);
      el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(it.ok.includes(x.dataset.v))x.classList.add('ok')});if(!ok)b.classList.add('bad');
      S.racha=ok?S.racha+1:0;S.rachaMax=Math.max(S.rachaMax,S.racha);if(ok&&v!=='valida')hit('f:'+v);save();meBar();
      setTimeout(()=>{i++;
        if(ok){hp--;dicho=hp?shuf(J.golpe)[0]:J.gana}else{vidas--;dicho=vidas?shuf(J.falla)[0]+' (Era: '+it.ok.map(k=>FAL_TIPOS[k]).join(' / ')+'.)':J.pierde}
        if(!hp){estado='gano';S.jefes[J.id]=(S.jefes[J.id]||0)+1;S.xp+=50;save();meBar();unlock('j:'+J.id)}
        else if(!vidas)estado='perdio';
        draw(ok?'hit':'miss')},700);
    });
  };
  draw();
}

/* voz */
let vozActiva=null;
function vozES(){const vs=speechSynthesis.getVoices();return vs.find(v=>/es[-_]AR/i.test(v.lang))||vs.find(v=>/es[-_](419|US|MX)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))}
function callar(){if('speechSynthesis' in window)speechSynthesis.cancel();if(vozActiva){vozActiva.btn&&(vozActiva.btn.innerHTML=SPK+' Escuchar');vozActiva.els?.forEach(e=>e.classList.remove('leyendo'))}vozActiva=null}
const SPK='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
function hablar(btn,partes){
  if(!('speechSynthesis' in window))return;
  if(vozActiva&&vozActiva.btn===btn){callar();return}
  callar();const st={btn,els:partes.map(p=>p.el).filter(Boolean)};vozActiva=st;btn.innerHTML=SPK+' Detener';
  let i=0;const v=vozES();
  const next=()=>{if(vozActiva!==st)return;if(i>0)partes[i-1].el?.classList.remove('leyendo');if(i>=partes.length){callar();return}
    const p=partes[i++];p.el?.classList.add('leyendo');p.el?.scrollIntoView({block:'center',behavior:'smooth'});
    const u=new SpeechSynthesisUtterance(p.t);u.lang=v?.lang||'es-AR';if(v)u.voice=v;u.rate=.95;u.onend=next;u.onerror=next;speechSynthesis.speak(u)};
  next();
}
function spkBtn(getPartes,cls=''){const b=document.createElement('button');b.className='btn sec spk '+cls;b.innerHTML=SPK+' Escuchar';b.onclick=()=>hablar(b,getPartes());if(!('speechSynthesis' in window))b.hidden=true;return b}

function showInst(){const el=$('#inst');if(!el)return;
  if(standalone()){el.innerHTML='';return}
  if(deferred){el.innerHTML='<button class="btn sec ins">Instalar la app</button><span class="small">Queda en tu pantalla de inicio y funciona sin conexión.</span>';
    $('.ins',el).onclick=async()=>{deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;showInst()};return}
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){el.innerHTML='<span class="small"><b>Para instalarla en iPhone:</b> tocá el botón Compartir de Safari y después «Agregar a inicio».</span>';return}
  el.innerHTML='';}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;showInst()});
addEventListener('appinstalled',()=>{deferred=null;showInst()});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}

/* router */
const rail=document.getElementById('rail');
rail.innerHTML=[MOD.inicio,...MODS].map(m=>`<a href="#${m.h}" data-h="${m.h}" style="--mc:${m.c}"><i></i>${m.n}</a>`).join('');
const tint=(hex,a)=>`color-mix(in srgb, ${hex} ${a}%, var(--paper))`;
function route(){
  const h=(location.hash||'#inicio').slice(1);const v=V[h]?h:'inicio',m=MOD[v],R=document.documentElement.style;
  R.setProperty('--c',m.c);document.querySelector('meta[name=theme-color]')?.setAttribute('content',m.c);R.setProperty('--c2',m.c2);R.setProperty('--ct',tint(m.c,12));
  rail.querySelectorAll('a').forEach(a=>{const on=a.dataset.h===v;a.classList.toggle('on',on);if(on)a.scrollIntoView({block:'nearest',inline:'nearest'})});
  meBar();V[v]();window.scrollTo(0,0);
}
aplicarPref();addEventListener('hashchange',route);route();
}
</script></body></html>
